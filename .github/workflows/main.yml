# في الخطوة الأخيرة، نفس المنطق موجود:
$ctrlId = Send-Ctrl $webhookUrl "⏰ نافذة الحفظ النهائية (ذكية)" ...
$deadline  = (Get-Date).AddSeconds(900)   # 15 دقيقة
$lastMap   = @{}
$saveCount = 0

while ((Get-Date) -lt $deadline) {
    Start-Sleep -Seconds 5
    $currentMap = Get-ReactionMap $webhookUrl $ctrlId   # نفس الدالة
    # نفس منطق تتبع الإضافات
    if ($added) {
        Invoke-RemoteSave ...  # نفس الحفظ
    }
    $lastMap = @{}  # تحديث الخريطة
}