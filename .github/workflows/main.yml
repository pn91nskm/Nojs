          '🌐 Public IP: ' + publicIp + '\n' +
          '👤 RDP User: ' + rdpUser + '\n' +
          '🔑 Password: ' + rdpPassword + '\n' +
          '🔌 RDP Port: 3389\n' +
          '📡 Status: ' + status + '\n' +
          '🕐 Time: ' + time + '\n' +
          '━━━━━━━━━━━━━━━━━━━━━\n' +
          'Connect via: mstsc /v:' + ip;
          }
          let discordOk = false;
