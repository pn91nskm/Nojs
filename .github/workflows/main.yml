name: RDP_ULTRA_STATION_FINAL_V25

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Timezone to Saudi Arabia (UTC+3)
        run: |
          tzutil /s "Arabic Standard Time"
          Write-Host "✅ تم ضبط التوقيت إلى: $(Get-TimeZone -Id 'Arabic Standard Time').DisplayName"

      - name: Install Tools (Pre-requisites)
        run: |
          choco install rclone tailscale -y --silent --no-progress
          $tailscalePath = "C:\Program Files\Tailscale"
          $rclonePath = "C:\Program Files\rclone"
          echo "$tailscalePath" >> $env:GITHUB_PATH
          echo "$rclonePath" >> $env:GITHUB_PATH

      - name: Set Chrome as Official Default Browser
        shell: pwsh
        run: |
          $xmlPath = "C:\defaultapps.xml"
          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chromePath)) { $chromePath = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe" }

          try {
              if (!(Test-Path $chromePath)) { throw "Chrome غير مثبت" }

              $xmlContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <DefaultAssociations>
            <Association Identifier=".htm" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier=".html" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier="http" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier="https" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
          </DefaultAssociations>
          "@

              $xmlContent | Set-Content -Path $xmlPath -Encoding UTF8 -Force
              Start-Process dism.exe -ArgumentList "/Online /Import-DefaultAppAssociations:$xmlPath" -Wait -NoNewWindow
          } catch {}
          if (Test-Path $xmlPath) { Remove-Item $xmlPath -Force }

      # ═══════════════════════════════════════════════════════════
      #  تعديل 1: إجبار Google + حذف Yahoo نهائياً
      # ═══════════════════════════════════════════════════════════
      - name: Force Google Search & Kill Yahoo
        shell: pwsh
        run: |
          # ── 1) سياسات Chrome الكاملة: Google فقط (managed = لا يمكن تغييره) ──
          $polPath = "HKLM:\Software\Policies\Google\Chrome"
          if (!(Test-Path $polPath)) { New-Item -Path $polPath -Force | Out-Null }

          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderEnabled"       -Value 1       -Type DWord  -Force
          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderName"          -Value "Google" -Type String -Force
          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderKeyword"       -Value "google.com" -Type String -Force
          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderSearchURL"     -Value "https://www.google.com/search?q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderSuggestURL"    -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderIconURL"       -Value "https://www.google.com/favicon.ico" -Type String -Force
          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderNewTabURL"     -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderEncodings"     -Value "UTF-8" -Type String -Force

          # ── 2) حظر إضافات Yahoo عبر السياسة (تمنع التثبيت والتشغيل) ──
          $blockPath = "$polPath\ExtensionInstallBlocklist"
          if (!(Test-Path $blockPath)) { New-Item -Path $blockPath -Force | Out-Null }
          Set-ItemProperty -Path $blockPath -Name "1" -Value "cnmdgidklhhnmpphlfmmopmghfjhgkdi" -Type String -Force
          Set-ItemProperty -Path $blockPath -Name "2" -Value "nljkibfhlpcnanjgbnlnbjecgicbjkge" -Type String -Force
          Set-ItemProperty -Path $blockPath -Name "3" -Value "fpmeembnagmagppkgghhfjfdfajdfcah" -Type String -Force

          # ── 3) حذف ملفات إضافات Yahoo من القرص مباشرة ──
          $extDir = "$env:LOCALAPPDATA\Google\Chrome\User Data\Default\Extensions"
          if (Test-Path $extDir) {
              $yahooIds = @("cnmdgidklhhnmpphlfmmopmghfjhgkdi","nljkibfhlpcnanjgbnlnbjecgicbjkge","fpmeembnagmagppkgghhfjfdfajdfcah")
              foreach ($id in $yahooIds) {
                  $p = Join-Path $extDir $id
                  if (Test-Path $p) {
                      Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue
                      Write-Host "🗑️ حُذف Yahoo extension: $id"
                  }
              }
          }

          # ── 4) تخطي شاشة Chrome الترحيبية (تمنع اقتراح Yahoo) ──
          $userData = "$env:LOCALAPPDATA\Google\Chrome\User Data"
          if (!(Test-Path $userData)) { New-Item -Path $userData -ItemType Directory -Force | Out-Null }
          "" | Set-Content "$userData\First Run" -Force

          Write-Host "✅ تم إجبار Google كمحرك بحث وحيد + حذف Yahoo"

      - name: Setup Environment & User
        run: |
          $password = "admin@123"
          $username = "TOOLBOXLAP"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username

          $dirs = @("C:\Users\Public\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop\Apps")
          foreach ($dir in $dirs) {
            if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }

      - name: Setup SSH Key from GitHub Secrets
        shell: pwsh
        run: |
          $sshDir = Join-Path $env:USERPROFILE ".ssh"
          if (!(Test-Path $sshDir)) { New-Item -ItemType Directory -Path $sshDir -Force | Out-Null }
          
          $privateKey = '${{ secrets.SSH_PRIVATE_KEY }}'
          Set-Content -Path "$sshDir\id_ed25519" -Value $privateKey -NoNewline
          
          icacls "$sshDir\id_ed25519" /inheritance:r /grant "${env:USERNAME}:R" | Out-Null
          
          $githubKeys = @"
          github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkVzrm7g6W66XGsCW75OU69nM5w/vC2gclRcxhT
          github.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEmKSENjQEezOmxkZMy7opKgwFB9nkt5Y4JL8PCWI/a61GZ3LYgtJTTVEGO2+FiM21iLuGOWc84GcZXMz85Ju1I=
          github.com ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCj7ndNxQowgcQnjshcLrqPEiiphnt+VTTvDP6mHBL9j1aNUkY4Ue1gvwnGLCS1YAxC7Y6yBYQA48FAdK9MMg56Uh9oQbrZilCNdX7mC9U8FoE+S7DQMmd9Ewvf1CoK9p4fLaxOpYycf8s6asFqSAsg8H6r39w1X7yTo256dyuu9S84DGlWbTwnn3xL22A9n93BTI1fO45A6n/6C7Xj83+P+n9e1G1`#Z8w==
          "@
          Set-Content -Path "$sshDir\known_hosts" -Value $githubKeys -Encoding UTF8 -Force

      - name: Enable RDP Config
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Configure Rclone & Create save.txt
        shell: pwsh
        run: |
          $configContent = '${{ secrets.RCLONE_CONFIG_CONTENT }}'

          $confDir = "$env:APPDATA\rclone"
          if (!(Test-Path $confDir)) { 
            New-Item -ItemType Directory -Path $confDir -Force | Out-Null 
          }

          $publicDir = "C:\Users\Public"
          if (!(Test-Path $publicDir)) { 
            New-Item -ItemType Directory -Path $publicDir -Force | Out-Null 
          }

          Set-Content -Path "$confDir\rclone.conf" -Value $configContent -Encoding UTF8 -Force
          Set-Content -Path "C:\Users\Public\save.txt" -Value $configContent -Encoding UTF8 -NoNewline -Force
          
      - name: Restore Latest Project ZIP
        continue-on-error: true
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5

          $projectBase = "C:\Users\Public\Desktop\Project"
          $remote = "MyDrive:/RDP_BACKUPS"

          $latestZip = rclone lsf $remote --files-only --include "{rfcity-*,zyntra-*}.zip" --format "tp" |
                       Sort-Object |
                       Select-Object -Last 1

          if ($latestZip) {
              $fileName = ($latestZip -split ';')[1]

              $folderName = $fileName -replace '\.zip$', ''
              $targetPath = Join-Path $projectBase $folderName

              if (!(Test-Path $targetPath)) { New-Item -ItemType Directory -Path $targetPath -Force | Out-Null }

              rclone copy "$remote/$fileName" "$env:TEMP" --progress

              Expand-Archive -Path (Join-Path "$env:TEMP" $fileName) -DestinationPath $targetPath -Force
              Remove-Item (Join-Path "$env:TEMP" $fileName) -Force
          }

      - name: Download Apps
        continue-on-error: true
        run: |
          $appsDir = "C:\Users\Public\Desktop\Apps"
          rclone copy "MyDrive:/Apps/Lingma.exe" "$appsDir" --progress
          curl.exe -L -o "$appsDir\DiscordSetup.exe" "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x86"

      - name: Fetch Launcher & Create Files
        run: |
          $publicDir = "C:\Users\Public"
          $launcher = "$publicDir\Launcher.ps1"

          try {
              $url = "https://autumn-base-f34e.alkshwly7.workers.dev/raw/01909c10"
              $rawContent = (New-Object System.Net.WebClient).DownloadString($url + "?t=" + (Get-Date).Ticks)
              $cleanContent = $rawContent -replace '(?m)^(\s*)//.*$', '$1'
              $cleanContent | Set-Content -Path $launcher -Encoding UTF8 -NoNewline
          } catch { exit 1 }

          $infoLines = @("k66903189@gmail.com","ARar12zxnmasqw","wzc2ff2cf2zwjk6wqli5gitvqohjvux7")
          $infoLines | Set-Content -Path "$publicDir\info.txt" -Encoding UTF8 -NoNewline

          $WshShell = New-Object -ComObject WScript.Shell
          $pwsh = "C:\Program Files\PowerShell\7\pwsh.exe"

          foreach ($t in @("SETUP","SAVE")) {
              $sc = $WshShell.CreateShortcut("C:\Users\Public\Desktop\$t.lnk")
              $sc.TargetPath = $pwsh
              $sc.Arguments = "-ExecutionPolicy Bypass -File `"$launcher`" $t"
              $sc.Save()
          }

          New-Item -Path "C:\session_active.lock" -ItemType File -Force | Out-Null

      - name: Tailscale Connect → Discord → Wait
        shell: pwsh
        run: |
          $webhookUrl = "https://discord.com/api/webhooks/1530298811593785405/i7bwlK9fbDlwFp2cJN2Z2rwnFBAnoUbwjmMoxY8mak2lyKnR4Q5Kp04cvyW-2GynZQ6W"

          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (!(Test-Path $tsExe)) { $tsExe = (Get-Command tailscale -ErrorAction SilentlyContinue).Source }

          Start-Process -FilePath $tsExe `
            -ArgumentList @("up","--hostname=HACKER-STATION") `
            -NoNewWindow -PassThru | Out-Null

          Write-Host "⏳ بانتظار توليد رابط المصادقة..."
          Start-Sleep -Seconds 5

          $loginUrl  = $null
          $fullJson  = ""
          $textStatus = ""

          for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                  $fullJson = & $tsExe status --json 2>&1 | Out-String
                  $st = $fullJson | ConvertFrom-Json -ErrorAction Stop
                  if ($st.AuthURL) {
                      $loginUrl = $st.AuthURL
                      Write-Host "✅ AuthURL: $loginUrl"
                      break
                  }
                  Write-Host "  محاولة $($i+1): BackendState=$($st.BackendState)"
              } catch {
                  Write-Host "  محاولة $($i+1): $($_.Exception.Message)"
              }
          }

          $textStatus = & $tsExe status 2>&1 | Out-String

          $content = ""
          if ($loginUrl) {
              $content += "🔗 $loginUrl`n"
          } else {
              $content += "❌ لم يُعثر على AuthURL`n"
          }
          $content += "`n📋 **tailscale status:**`n``````$textStatus``````"
          $content += "`n📦 **Full JSON:**`n``````json`n$fullJson`n``````"

          if ($content.Length -gt 1995) {
              $content = $content.Substring(0, 1995) + "`n...(truncated)"
          }

          $body = @{ content = $content } | ConvertTo-Json
          try {
              Invoke-RestMethod -Uri $webhookUrl -Method POST -Body $body -ContentType "application/json" | Out-Null
              Write-Host "✅ أُرسلت البيانات إلى Discord"
          } catch {
              Write-Host "❌ فشل الويبهوك: $_"
          }

          Write-Host "⏳ الجلسة نشطة. افتح الرابط من Discord وصادق، ثم اتصل بـ RDP."
          while (Test-Path "C:\session_active.lock") {
              Start-Sleep -Seconds 10
          }
          if (Test-Path "C:\session_active.lock") {
              Remove-Item "C:\session_active.lock" -Force
          }

      # ═══════════════════════════════════════════════════════════
      #  تعديل 2: حفظ قسري — يعمل دائماً ولا يعلّق أبداً
      # ═══════════════════════════════════════════════════════════
      - name: Auto-Save (Forced — Never Hangs)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        shell: pwsh
        run: |
          $launcher   = "C:\Users\Public\Launcher.ps1"
          $lockFile   = "C:\session_active.lock"
          $pwsh       = "C:\Program Files\PowerShell\7\pwsh.exe"
          $maxWaitSec = 600   # 10 دقائق كحد أقصى — بعدها قتل إجباري

          if (Test-Path $lockFile) {
              Write-Host "🔄 lock موجود → حفظ تلقائي إجباري..."

              if (Test-Path $launcher) {
                  try {
                      $proc = Start-Process -FilePath $pwsh `
                          -ArgumentList "-ExecutionPolicy Bypass -File `"$launcher`" SAVE" `
                          -NoNewWindow -PassThru

                      # انتظار مع مهلة — لا تعلّق للأبد
                      $exited = $proc.WaitForExit($maxWaitSec * 1000)

                      if (!$exited) {
                          Write-Host "⚠️ انتهت المهلة ($maxWaitSec ث) → قتل إجباري"
                          $proc.Kill()
                          Start-Sleep -Seconds 2
                          Write-Host "⛔ قُتلت عملية الحفظ"
                      } else {
                          Write-Host "✅ الحفظ اكتمل (Exit Code: $($proc.ExitCode))"
                      }
                  } catch {
                      Write-Host "❌ خطأ في الحفظ: $_"
                  }
              } else {
                  Write-Host "⚠️ Launcher.ps1 غير موجود — تخطي"
              }

              Remove-Item $lockFile -Force -ErrorAction SilentlyContinue
          } else {
              Write-Host "✅ lock غير موجود → الحفظ تم يدوياً مسبقاً — تخطي"
          }

          Write-Host "🏁 انتهت الخطوة — الـ workflow يُغلق الآن"