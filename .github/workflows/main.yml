name: RDP_ULTRA_STATION_FINAL_V26

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Timezone to Saudi Arabia (UTC+3)
        run: |
          tzutil /s "Arabic Standard Time"
          Write-Host "✅ تم ضبط التوقيت إلى: $(Get-TimeZone -Id 'Arabic Standard Time').DisplayName"

      - name: Install Tools (Pre-requisites)
        run: |
          choco install rclone tailscale -y --silent --no-progress
          $tailscalePath = "C:\Program Files\Tailscale"
          $rclonePath = "C:\Program Files\rclone"
          echo "$tailscalePath" >> $env:GITHUB_PATH
          echo "$rclonePath" >> $env:GITHUB_PATH

      - name: Set Chrome as Official Default Browser
        shell: pwsh
        run: |
          $xmlPath = "C:\defaultapps.xml"
          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chromePath)) { $chromePath = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe" }
          try {
              if (!(Test-Path $chromePath)) { throw "Chrome غير مثبت" }
              $xmlContent = @"
          <?xml version="1.0" encoding="UTF-8"?>
          <DefaultAssociations>
            <Association Identifier=".htm" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier=".html" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier="http" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
            <Association Identifier="https" ProgId="ChromeHTML" ApplicationName="Google Chrome" />
          </DefaultAssociations>
          "@
              $xmlContent | Set-Content -Path $xmlPath -Encoding UTF8 -Force
              Start-Process dism.exe -ArgumentList "/Online /Import-DefaultAppAssociations:$xmlPath" -Wait -NoNewWindow
          } catch {}
          if (Test-Path $xmlPath) { Remove-Item $xmlPath -Force }

      - name: Force Google & Destroy Yahoo (All Layers)
        shell: pwsh
        run: |
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $pol = "HKLM:\Software\Policies\Google\Chrome"
          if (!(Test-Path $pol)) { New-Item -Path $pol -Force | Out-Null }
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEnabled"    -Value 1        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderName"       -Value "Google" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderKeyword"    -Value "google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL"  -Value "https://www.google.com/search?q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSuggestURL" -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderIconURL"    -Value "https://www.google.com/favicon.ico" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderNewTabURL"  -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEncodings"  -Value "UTF-8"  -Type String -Force
          Set-ItemProperty -Path $pol -Name "PasswordManagerEnabled"    -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "BrowserSignin"             -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "AutofillAddressEnabled"    -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "AutofillCreditCardEnabled" -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "DeveloperToolsAvailability"  -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "PromotionalTabsEnabled"       -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "WelcomePageOnOSUpgradeEnabled"-Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "BackgroundModeEnabled"        -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "StartupBoostEnabled"          -Value 0 -Type DWord -Force
          Write-Host "✅ الطبقة 1: سياسات Chrome + Sync/كلمات المرور"
          $blockPath = "$pol\ExtensionInstallBlocklist"
          if (!(Test-Path $blockPath)) { New-Item -Path $blockPath -Force | Out-Null }
          Set-ItemProperty -Path $blockPath -Name "1" -Value "*" -Type String -Force
          $typeBlock = "$pol\ExtensionInstallTypeBlocklist"
          if (!(Test-Path $typeBlock)) { New-Item -Path $typeBlock -Force | Out-Null }
          Set-ItemProperty -Path $typeBlock -Name "1" -Value "development" -Type String -Force
          Set-ItemProperty -Path $typeBlock -Name "2" -Value "sideload"    -Type String -Force
          Write-Host "✅ الطبقة 2: حظر جميع الإضافات + التثبيت الخارجي"
          $yahooIds = @("cnmdgidklhhnmpphlfmmopmghfjhgkdi","nljkibfhlpcnanjgbnlnbjecgicbjkge","fpmeembnagmagppkgghhfjfdfajdfcah")
          Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $extDir = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data\Default\Extensions"
              if (Test-Path $extDir) {
                  foreach ($yid in $yahooIds) {
                      $p = Join-Path $extDir $yid
                      if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue; Write-Host "  🗑️ extension $yid ($($_.Name))" }
                  }
              }
          }
          $uninstallKeys = @("HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*")
          foreach ($key in $uninstallKeys) {
              Get-ItemProperty $key -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*Yahoo*" } | ForEach-Object {
                  if ($_.UninstallString) {
                      $cmd = $_.UninstallString -replace '/I','/X'
                      Start-Process cmd -ArgumentList "/c `"$cmd`" /S /quiet /norestart" -Wait -NoNewWindow -ErrorAction SilentlyContinue
                  }
              }
          }
          @("HKLM:\SOFTWARE\Yahoo","HKCU:\SOFTWARE\Yahoo","HKLM:\SOFTWARE\WOW6432Node\Yahoo") | ForEach-Object {
              if (Test-Path $_) { Remove-Item $_ -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "✅ الطبقة 3: حذف Yahoo"
          Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $profileDir = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data\Default"
              if (Test-Path $profileDir) {
                  @("Preferences","Secure Preferences") | ForEach-Object {
                      $fp = Join-Path $profileDir $_
                      if (Test-Path $fp) { Remove-Item $fp -Force -ErrorAction SilentlyContinue }
                  }
              }
              $userData = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data"
              if (!(Test-Path $userData)) { New-Item -Path $userData -ItemType Directory -Force | Out-Null }
              "" | Set-Content (Join-Path $userData "First Run") -Force
          }
          Write-Host "✅ الطبقة 4: حذف Preferences + First Run"
          try {
              $regKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Software\Policies\Google\Chrome",[Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree,[System.Security.AccessControl.RegistryRights]::ChangePermissions)
              $acl = $regKey.GetAccessControl()
              $usersRule = New-Object System.Security.AccessControl.RegistryAccessRule("BUILTIN\Users","ReadKey","ContainerInherit,ObjectInherit","None","Allow")
              $acl.AddAccessRule($usersRule)
              $regKey.SetAccessControl($acl); $regKey.Close()
              Write-Host "✅ الطبقة 5: حماية Registry بـ ACLs"
          } catch { Write-Host "⚠️ تعذر ضبط ACLs: $_" }
          $watchdogContent = @'
          $pol = "HKLM:\Software\Policies\Google\Chrome"
          $cur = Get-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL" -ErrorAction SilentlyContinue
          if ($cur.DefaultSearchProviderSearchURL -notlike "*google.com*") {
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEnabled"    -Value 1        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderName"       -Value "Google" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderKeyword"    -Value "google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL"  -Value "https://www.google.com/search?q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSuggestURL" -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderIconURL"    -Value "https://www.google.com/favicon.ico" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderNewTabURL"  -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEncodings"  -Value "UTF-8"  -Type String -Force
          }
          '@
          Set-Content -Path "C:\Users\Public\search_watchdog.ps1" -Value $watchdogContent -Encoding UTF8
          try {
              $pwshPath = "C:\Program Files\PowerShell\7\pwsh.exe"
              $action   = New-ScheduledTaskAction -Execute $pwshPath -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File C:\Users\Public\search_watchdog.ps1"
              $trigger  = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(5) -RepetitionInterval 00:00:30 -RepetitionDuration 06:00:00
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
              Register-ScheduledTask -TaskName "GoogleSearchWatchdog" -Action $action -Trigger $trigger -Settings $settings -RunLevel Highest -User "SYSTEM" -Force | Out-Null
              Write-Host "✅ الطبقة 6: Watchdog مُسجّل (كل 30 ثانية كـ SYSTEM)"
          } catch { Write-Host "⚠️ تعذر تسجيل Watchdog: $_" }
          Write-Host "🛡️ اكتمل الدفاع متعدد الطبقات — Google مُجبر + كلمات المرور مفعّلة"

      - name: Setup Environment & User
        run: |
          $password = "admin@123"
          $username = "TOOLBOXLAP"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          $dirs = @("C:\Users\Public\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop\Apps")
          foreach ($dir in $dirs) {
            if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }

      - name: Setup SSH Key from GitHub Secrets
        shell: pwsh
        run: |
          $sshDir = Join-Path $env:USERPROFILE ".ssh"
          if (!(Test-Path $sshDir)) { New-Item -ItemType Directory -Path $sshDir -Force | Out-Null }
          $privateKey = '${{ secrets.SSH_PRIVATE_KEY }}'
          Set-Content -Path "$sshDir\id_ed25519" -Value $privateKey -NoNewline
          icacls "$sshDir\id_ed25519" /inheritance:r /grant "${env:USERNAME}:R" | Out-Null
          $githubKeys = @"
          github.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkVzrm7g6W66XGsCW75OU69nM5w/vC2gclRcxhT
          github.com ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEmKSENjQEezOmxkZMy7opKgwFB9nkt5Y4JL8PCWI/a61GZ3LYgtJTTVEGO2+FiM21iLuGOWc84GcZXMz85Ju1I=
          github.com ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQCj7ndNxQowgcQnjshcLrqPEiiphnt+VTTvDP6mHBL9j1aNUkY4Ue1gvwnGLCS1YAxC7Y6yBYQA48FAdK9MMg56Uh9oQbrZilCNdX7mC9U8FoE+S7DQMmd9Ewvf1CoK9p4fLaxOpYycf8s6asFqSAsg8H6r39w1X7yTo256dyuu9S84DGlWbTwnn3xL22A9n93BTI1fO45A6n/6C7Xj83+P+n9e1G1Z8w==
          "@
          Set-Content -Path "$sshDir\known_hosts" -Value $githubKeys -Encoding UTF8 -Force

      - name: Enable RDP Config
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Configure Rclone & Create save.txt
        shell: pwsh
        run: |
          $configContent = '${{ secrets.RCLONE_CONFIG_CONTENT }}'
          $confDir = "$env:APPDATA\rclone"
          if (!(Test-Path $confDir)) { New-Item -ItemType Directory -Path $confDir -Force | Out-Null }
          $publicDir = "C:\Users\Public"
          if (!(Test-Path $publicDir)) { New-Item -ItemType Directory -Path $publicDir -Force | Out-Null }
          Set-Content -Path "$confDir\rclone.conf" -Value $configContent -Encoding UTF8 -Force
          Set-Content -Path "C:\Users\Public\save.txt" -Value $configContent -Encoding UTF8 -NoNewline -Force

      - name: Restore Latest Project ZIP
        continue-on-error: true
        shell: pwsh
        run: |
          $projectBase = "C:\Users\Public\Desktop\Project"
          $tempDir     = $env:TEMP
          $driveRemote = "MyDrive:/RDP_BACKUPS"

          # ── متغيرات البوت من .env / secrets ──
          $botToken = '${{ secrets.TG_BOT_TOKEN }}'
          $chatId   = '${{ secrets.TG_CHAT_ID }}'

          # إذا لم تُعرَّف كـ secrets، اقرأها من .env محلي (للتطوير)
          if (-not $botToken -or $botToken -eq '') {
              $envPath = "C:\Users\Public\bot_telegram\.env"
              if (Test-Path $envPath) {
                  Get-Content $envPath | ForEach-Object {
                      if ($_ -match '^BOT_TOKEN=(.+)$') { $botToken = $matches[1].Trim() }
                      if ($_ -match '^CHAT_ID=(.+)$')   { $chatId   = $matches[1].Trim() }
                  }
              }
          }

          $restoredOk = $false

          # ════════════════════════════════════════════════════
          # الخيار 1: جلب من Telegram (Bot API getUpdates)
          # ════════════════════════════════════════════════════
          if ($botToken -and $chatId) {
              Write-Host "📱 [TELEGRAM] جاري البحث عن أحدث ملف في القناة..."
              try {
                  # جلب آخر 100 رسالة من القناة عبر getHistory
                  $apiBase = "https://api.telegram.org/bot$botToken"

                  $updatesUrl = "$apiBase/getUpdates?limit=100&offset=-100&allowed_updates=[""channel_post"",""message""]"
                  $resp = Invoke-RestMethod -Uri $updatesUrl -Method GET -TimeoutSec 30 -ErrorAction Stop

                  $latestFileMsg = $null
                  $latestMsgDate = 0

                  foreach ($update in $resp.result) {
                      $msg = if ($update.channel_post) { $update.channel_post } elseif ($update.message) { $update.message } else { $null }
                      if (-not $msg) { continue }

                      # تأكد من أنها من الـ chat الصحيح
                      $msgChatId = if ($msg.chat.id) { "$($msg.chat.id)" } else { "" }
                      $targetChatId = $chatId -replace '^-100',''   # normalize
                      $msgChatIdNorm = $msgChatId -replace '^-100',''
                      if ($msgChatIdNorm -ne $targetChatId -and $msgChatId -ne $chatId) { continue }

                      # تحقق من وجود document (ملف)
                      $doc = if ($msg.document) { $msg.document } else { $null }
                      if (-not $doc) { continue }

                      # خذ الأحدث
                      if ($msg.date -gt $latestMsgDate) {
                          $latestMsgDate = $msg.date
                          $latestFileMsg = $msg
                      }
                  }

                  if ($latestFileMsg) {
                      $doc = $latestFileMsg.document

                      # ─── التعديل هنا: استخدم اسم الملف الأصلي كما هو ───
                      $fileName = $doc.file_name
                      if (-not $fileName) { $fileName = "restore_$($latestFileMsg.date).zip" }

                      # تعقيم الاسم (للأمان)
                      $fileName = $fileName -replace '[\/\\:*?"<>|]', '_'

                      Write-Host "  📄 الملف: $fileName ($([math]::Round($doc.file_size / 1MB, 2)) MB)"
                      Write-Host "  📅 التاريخ: $(([DateTimeOffset]::FromUnixTimeSeconds($latestFileMsg.date)).LocalDateTime)"

                      # جلب رابط التحميل
                      $fileInfoResp = Invoke-RestMethod -Uri "$apiBase/getFile?file_id=$($doc.file_id)" -Method GET -TimeoutSec 15 -ErrorAction Stop
                      $filePath = $fileInfoResp.result.file_path
                      $downloadUrl = "https://api.telegram.org/file/bot$botToken/$filePath"

                      $destZip = Join-Path $tempDir $fileName
                      Write-Host "  ⬇️  جاري التحميل..."
                      Invoke-WebRequest -Uri $downloadUrl -OutFile $destZip -TimeoutSec 300 -ErrorAction Stop

                      # استخراج في مجلد باسم الملف (بدون امتداد)
                      $folderName = [System.IO.Path]::GetFileNameWithoutExtension($fileName)
                      $targetPath = Join-Path $projectBase $folderName
                      if (!(Test-Path $targetPath)) { New-Item -ItemType Directory -Path $targetPath -Force | Out-Null }

                      Write-Host "  📦 جاري الاستخراج في: $targetPath"
                      Expand-Archive -Path $destZip -DestinationPath $targetPath -Force
                      Remove-Item $destZip -Force -ErrorAction SilentlyContinue

                      Write-Host "  ✅ [TELEGRAM] تمت الاستعادة: $fileName → $targetPath"
                      $restoredOk = $true
                  } else {
                      Write-Host "  ⚠️ [TELEGRAM] لم يُعثر على ملف في الـ updates — سيتم التحول للـ Drive"
                  }
              } catch {
                  Write-Host "  ❌ [TELEGRAM] فشل: $($_.Exception.Message) — سيتم التحول للـ Drive"
              }
          } else {
              Write-Host "⚠️ [TELEGRAM] لا يوجد BOT_TOKEN أو CHAT_ID — سيتم التحول للـ Drive"
          }

          # ════════════════════════════════════════════════════
          # الخيار 2: جلب من Google Drive (احتياط)
          # ════════════════════════════════════════════════════
          if (-not $restoredOk) {
              Write-Host "☁️  [DRIVE] جاري البحث عن أحدث ملف في Drive..."
              try {
                  $latestZip = rclone lsf $driveRemote --files-only --include "{rfcity-*,zyntra-*}.zip" --format "tp" |
                               Sort-Object |
                               Select-Object -Last 1

                  if ($latestZip) {
                      $fileName   = ($latestZip -split ';')[1]
                      $folderName = $fileName -replace '\.zip$', ''
                      $targetPath = Join-Path $projectBase $folderName

                      if (!(Test-Path $targetPath)) { New-Item -ItemType Directory -Path $targetPath -Force | Out-Null }

                      Write-Host "  📄 الملف: $fileName"
                      rclone copy "$driveRemote/$fileName" $tempDir --progress

                      Expand-Archive -Path (Join-Path $tempDir $fileName) -DestinationPath $targetPath -Force
                      Remove-Item (Join-Path $tempDir $fileName) -Force -ErrorAction SilentlyContinue

                      Write-Host "  ✅ [DRIVE] تمت الاستعادة: $fileName → $targetPath"
                      $restoredOk = $true
                  } else {
                      Write-Host "  ⚠️ [DRIVE] لم يُعثر على ملفات مطابقة في Drive"
                  }
              } catch {
                  Write-Host "  ❌ [DRIVE] فشل: $($_.Exception.Message)"
              }
          }

          if (-not $restoredOk) {
              Write-Host "⚠️ لم تتم استعادة أي مشروع (لا Telegram ولا Drive) — المتابعة بدون استعادة"
          }

      - name: Download Apps
        continue-on-error: true
        run: |
          $appsDir = "C:\Users\Public\Desktop\Apps"
          rclone copy "MyDrive:/Apps/Lingma.exe" "$appsDir" --progress
          curl.exe -L -o "$appsDir\DiscordSetup.exe" "https://discord.com/api/downloads/distributions/app/installers/latest?channel=stable&platform=win&arch=x86"

      - name: Fetch Launcher & Create Files
        run: |
          $publicDir = "C:\Users\Public"
          $launcher = "$publicDir\Launcher.ps1"
          try {
              $url = "https://autumn-base-f34e.alkshwly7.workers.dev/raw/01909c10"
              $rawContent = (New-Object System.Net.WebClient).DownloadString($url + "?t=" + (Get-Date).Ticks)
              $cleanContent = $rawContent -replace '(?m)^(\s*)//.*$', '$1'
              $cleanContent | Set-Content -Path $launcher -Encoding UTF8 -NoNewline
          } catch { exit 1 }
          $infoLines = @("k66903189@gmail.com","ARar12zxnmasqw","wzc2ff2cf2zwjk6wqli5gitvqohjvux7")
          $infoLines | Set-Content -Path "$publicDir\info.txt" -Encoding UTF8 -NoNewline
          $pangolinToken = "gcqsayh18b1aybu.wks7auc7clu5oy5cezun5rfmi4aojr5mu4hvsl2g"
          Set-Content -Path "$publicDir\token.txt" -Value $pangolinToken -Encoding UTF8 -NoNewline -Force
          Write-Host "✅ Pangolin token written to $publicDir\token.txt"
          $WshShell = New-Object -ComObject WScript.Shell
          $pwsh = "C:\Program Files\PowerShell\7\pwsh.exe"
          foreach ($t in @("SETUP","SAVE")) {
              $sc = $WshShell.CreateShortcut("C:\Users\Public\Desktop\$t.lnk")
              $sc.TargetPath = $pwsh
              $sc.Arguments = "-ExecutionPolicy Bypass -File `"$launcher`" $t"
              $sc.Save()
          }
          New-Item -Path "C:\session_active.lock" -ItemType File -Force | Out-Null

      # ═══════════════════════════════════════════════════════════
      #  نظام ذكي: أي reaction = حفظ، متكرر، لا إنهاء
      # ═══════════════════════════════════════════════════════════
      - name: Tailscale Connect → Discord → Wait
        shell: pwsh
        run: |
          $webhookUrl = "https://discord.com/api/webhooks/1530298811593785405/i7bwlK9fbDlwFp2cJN2Z2rwnFBAnoUbwjmMoxY8mak2lyKnR4Q5Kp04cvyW-2GynZQ6W"
          $C_IDLE = 10070709; $C_BUSY = 16426522; $C_OK = 5763719; $C_FAIL = 15548997
          function Send-Ctrl($wh, $title, $desc, $color) {
          $body = @{ embeds = @( @{ title = $title; description = $desc; color = $color } ) } | ConvertTo-Json -Depth 6
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          try { $r = Invoke-RestMethod -Uri ($wh + '?wait=true') -Method POST -Body $bytes -ContentType 'application/json; charset=utf-8'; return $r.id } catch { Write-Host "⚠️ فشل إرسال لوحة التحكم: $_"; return $null }
          }
          function Set-Ctrl($wh, $id, $title, $desc, $color) {
          if (-not $id) { return }
          $body = @{ embeds = @( @{ title = $title; description = $desc; color = $color } ) } | ConvertTo-Json -Depth 6
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          try { Invoke-RestMethod -Uri ($wh + '/messages/' + $id) -Method PATCH -Body $bytes -ContentType 'application/json; charset=utf-8' | Out-Null } catch { }
          }
          function Invoke-RemoteSave($wh, $id, $label) {
          Set-Ctrl $wh $id "⏳ جاري الحفظ $label" "تتم عملية الرفع الآن — لا تغلق شيئاً حتى ترى ✅ أو ❌." $C_BUSY
          $pwsh = "C:\Program Files\PowerShell\7\pwsh.exe"
          $launcher = "C:\Users\Public\Launcher.ps1"
          if (-not (Test-Path $launcher)) { Set-Ctrl $wh $id "❌ فشل الحفظ" "Launcher.ps1 غير موجود على الجهاز." $C_FAIL; return $false }
          try {
          $p = Start-Process -FilePath $pwsh -ArgumentList "-ExecutionPolicy Bypass -File `"$launcher`" SAVE" -NoNewWindow -PassThru
          $ok = $p.WaitForExit(600000)
          if (-not $ok) { $p.Kill(); Start-Sleep 2; Set-Ctrl $wh $id "❌ فشل الحفظ" "انتهت مهلة الرفع (10 د) — قُتلت العملية." $C_FAIL; return $false }
