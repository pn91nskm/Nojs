        run: |
          $botDir = "C:\Users\Public\bot"
          $logDir = "C:\logs"
          if (!(Test-Path $logDir)) { New-Item -ItemType Directory -Path $logDir -Force | Out-Null }
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $runNum = $env:RUN_NUMBER
          if ([string]::IsNullOrEmpty($runNum)) { $runNum = "1" }
          $hostname = "rdp-alkshwly-$runNum"
          $rdpUser = "TOOLBOXLAP"
          $password = "admin@123"
          $startTime = Get-Date
          $tgToken  = $env:TELEGRAM_BOT_TOKEN
          $tgChatId = $env:TELEGRAM_CHANNEL_ID
          $nl       = "`n"
          Write-Host "🎯 Hostname: $hostname (run number $runNum)"
          Write-Host "👤 RDP User: $rdpUser"
          $tailscaleIp = "N/A"
          $tailscaleStatus = "Not installed"
          $authUrl = ""
          if (Test-Path $tsExe) {
            Write-Host "Starting Tailscale..."
            function Wait-TailscaleReady {
              param([string]$Label = "")
              Write-Host "⏳ Polling Tailscale ($Label) every 500ms — no timeout..."
              while ($true) {
                Start-Sleep -Milliseconds 500
                try {
                  $j = & $tsExe status --json 2>&1 | Out-String
                  $d = $j | ConvertFrom-Json -ErrorAction Stop
                  $script:tailscaleStatus = $d.BackendState
                  if ($d.BackendState -eq "Running") {
                    if ($d.Self -and $d.Self.TailscaleIPs -and $d.Self.TailscaleIPs.Count -gt 0) {
                      $script:tailscaleIp = $d.Self.TailscaleIPs[0]
                    }
                    Write-Host "✅ Tailscale Running! IP=$($script:tailscaleIp)"
                    return "Running"
                  }
                  elseif ($d.BackendState -eq "NeedsLogin") {
                    if ($d.AuthURL -and [string]::IsNullOrEmpty($script:authUrl)) {
                      $script:authUrl = $d.AuthURL
                    }
                    Write-Host "🔗 NeedsLogin — AuthURL captured"
                    return "NeedsLogin"
                  }
                } catch { }
              }
            }
            $authKey      = "$env:TAILSCALE_AUTHKEY"
            $keyMissing   = [string]::IsNullOrEmpty($authKey)
            $keyWrongFmt  = (-not $keyMissing -and -not $authKey.StartsWith("tskey-auth-"))
            $authKeyValid = (-not $keyMissing -and -not $keyWrongFmt)
            if ($authKeyValid) {
              Write-Host "🔑 PHASE 1: Trying authkey..."
              & $tsExe up --authkey $authKey --hostname=$hostname --accept-routes --reset 2>&1 | Out-Null
              $phase1Result = Wait-TailscaleReady -Label "authkey"
              if ($phase1Result -eq "NeedsLogin") {
                Write-Host "⚠️ AuthKey rejected — falling back to AuthURL"
              }
            }
            elseif ($keyMissing) {
              Write-Host "⚠️ PHASE 2a: No TAILSCALE_AUTHKEY — AuthURL will appear"
              Start-Process -FilePath $tsExe -ArgumentList @("up","--hostname=$hostname","--accept-routes") -NoNewWindow -PassThru | Out-Null
            }
            elseif ($keyWrongFmt) {
              Write-Host "⚠️ PHASE 2b: Wrong AuthKey format — AuthURL will appear"
              Start-Process -FilePath $tsExe -ArgumentList @("up","--hostname=$hostname","--accept-routes") -NoNewWindow -PassThru | Out-Null
            }
            if ($tailscaleIp -eq "N/A") {
              if ([string]::IsNullOrEmpty($authUrl)) {
                $waitResult = Wait-TailscaleReady -Label "waiting-for-AuthURL"
              }
              if (-not [string]::IsNullOrEmpty($authUrl)) {
                $publicIpEarly = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 5) } catch { "N/A" }
                Write-Host "🔗 AuthURL: $authUrl"
                Write-Host "⏳ Waiting for user auth..."
                @{
                  tailscaleIp    = "N/A"
                  publicIp       = $publicIpEarly
                  rdpUser        = $rdpUser
                  rdpPassword    = $password
                  hostname       = $hostname
                  tailscaleStatus= "NeedsLogin"
                  authUrl        = $authUrl
                  startTime      = (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
                } | ConvertTo-Json | Set-Content "C:\Users\Public\session_info.json" -Encoding UTF8
              }
              $connectResult = Wait-TailscaleReady -Label "post-auth-connect"
              if ($connectResult -eq "Running" -and $tailscaleIp -ne "N/A") {
                Write-Host "✅ Tailscale connected — IP: $tailscaleIp"
              }
            }
            if ($tailscaleIp -eq "N/A") {
              $tsIpLine = ipconfig | Select-String "100\.\d+\.\d+\.\d+" | Select-Object -First 1
              if ($tsIpLine) {
                $tailscaleIp     = ($tsIpLine.Line -replace '.*?(\d+\.\d+\.\d+\.\d+).*','$1').Trim()
                $tailscaleStatus = "Connected (fallback)"
                Write-Host "✅ Tailscale IP via ipconfig fallback: $tailscaleIp"
              }
            }
            try {
              $rawJson = & $tsExe status --json 2>&1 | Out-String
              [System.IO.File]::WriteAllText("C:\Users\Public\tailscale_status.json", $rawJson.Trim(), [System.Text.Encoding]::UTF8)
            } catch {}
          }
          $publicIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 5) } catch { "N/A" }
          $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
          @{
            tailscaleIp=$tailscaleIp
            publicIp=$publicIp
            rdpUser=$rdpUser
            rdpPassword=$password
            hostname=$hostname
            tailscaleStatus=$tailscaleStatus
            authUrl=$authUrl
            startTime=$now
          } | ConvertTo-Json | Set-Content "C:\Users\Public\session_info.json" -Encoding UTF8
          Write-Host "✅ Session info written"
          $envFile = "C:\Users\Public\bot\.env"
          $envLines = @(
          "DISCORD_BOT_TOKEN=$env:DISCORD_BOT_TOKEN",
          "DISCORD_CHANNEL_ID=$env:DISCORD_CHANNEL_ID",
          "DISCORD_WEBHOOK_URL=$env:DISCORD_WEBHOOK_URL",
          "TELEGRAM_API_ID=$env:TELEGRAM_API_ID",
          "TELEGRAM_API_HASH=$env:TELEGRAM_API_HASH",
          "TELEGRAM_BOT_TOKEN=$env:TELEGRAM_BOT_TOKEN",
          "TELEGRAM_CHANNEL_ID=$env:TELEGRAM_CHANNEL_ID",
          "TAILSCALE_AUTHKEY=$env:TAILSCALE_AUTHKEY",
          "RUN_NUMBER=$env:RUN_NUMBER"
          )
          $envLines | Set-Content -Path $envFile -Encoding UTF8 -Force
          Write-Host "✅ .env file written for bot subprocess"
          Write-Host "🤖 Starting Discord/Telegram bot..."
          $restartCount  = 0
          $heartbeatFile = "C:\Users\Public\heartbeat.txt"
          function Start-Bot {
            $botEnv = [System.Environment]::GetEnvironmentVariables()
            $botEnv["DISCORD_BOT_TOKEN"]   = $env:DISCORD_BOT_TOKEN
            $botEnv["DISCORD_CHANNEL_ID"]  = $env:DISCORD_CHANNEL_ID
            $botEnv["DISCORD_WEBHOOK_URL"] = $env:DISCORD_WEBHOOK_URL
            $botEnv["TELEGRAM_API_ID"]     = $env:TELEGRAM_API_ID
            $botEnv["TELEGRAM_API_HASH"]   = $env:TELEGRAM_API_HASH
            $botEnv["TELEGRAM_BOT_TOKEN"]  = $env:TELEGRAM_BOT_TOKEN
            $botEnv["TELEGRAM_CHANNEL_ID"] = $env:TELEGRAM_CHANNEL_ID
            $botEnv["TAILSCALE_AUTHKEY"]   = $env:TAILSCALE_AUTHKEY
            $botEnv["RUN_NUMBER"]          = $env:RUN_NUMBER
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName  = "node"
            $psi.Arguments = "`"$botDir\index.js`""
            $psi.WorkingDirectory = $botDir
            $psi.WindowStyle = [System.Diagnostics.ProcessWindowStyle]::Hidden
            $psi.UseShellExecute = $false
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError  = $true
            foreach ($k in @("DISCORD_BOT_TOKEN","DISCORD_CHANNEL_ID","DISCORD_WEBHOOK_URL","TELEGRAM_API_ID","TELEGRAM_API_HASH","TELEGRAM_BOT_TOKEN","TELEGRAM_CHANNEL_ID","TAILSCALE_AUTHKEY","RUN_NUMBER")) {
              if ($psi.EnvironmentVariables.ContainsKey($k)) { $psi.EnvironmentVariables[$k] = $botEnv[$k] }
              else { $psi.EnvironmentVariables.Add($k, "$($botEnv[$k])") }
            }
            $proc = New-Object System.Diagnostics.Process
            $proc.StartInfo = $psi
            $proc.Start() | Out-Null
            $proc.BeginOutputReadLine()
            $proc.BeginErrorReadLine()
            return $proc
          }
          Get-Process -Name "node" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "⚠️ Killing stale node process PID: $($_.Id)"
            try { taskkill /PID $_.Id /T /F 2>$null } catch {}
          }
          Start-Sleep -Seconds 2
          $botProc = Start-Bot
          Write-Host "🟢 Bot PID: $($botProc.Id)"
          $maxRestarts = 5
          while ($true) {
            Start-Sleep -Seconds 5
            [System.IO.File]::WriteAllText($heartbeatFile,
            "alive: $(Get-Date -Format 'HH:mm:ss') | restarts: $restartCount | bot: $(if (-not $botProc.HasExited) { 'running' } else { 'restarting' })",
            [System.Text.Encoding]::UTF8)
            $loopElapsed = (New-TimeSpan -Start $startTime -End (Get-Date)).TotalSeconds
            if ($loopElapsed % 30 -lt 5) {
              $polPath  = "HKLM:\Software\Policies\Google\Chrome"
              $yahooIds = @("cnmdgidklhhnmpphlfmmopmghfjhgkdi","nljkibfhlpcnanjgbnlnbjecgicbjkge","fpmeembnagmagppkgghhfjfdfcah")
              $cur = Get-ItemProperty -Path $polPath -Name "DefaultSearchProviderSearchURL" -ErrorAction SilentlyContinue
              if ($cur.DefaultSearchProviderSearchURL -notlike "*google.com*") {
                Write-Host "⚠️ Search engine changed — restoring Google..."
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderEnabled"    -Value 1 -Type DWord -Force
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderName"       -Value "Google" -Type String -Force
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderKeyword"    -Value "google.com" -Type String -Force
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderSearchURL"  -Value "https://www.google.com/search?q={searchTerms}" -Type String -Force
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderSuggestURL" -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderIconURL"    -Value "https://www.google.com/favicon.ico" -Type String -Force
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderNewTabURL"  -Value "https://www.google.com" -Type String -Force
                Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderEncodings"  -Value "UTF-8" -Type String -Force
                Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                  $extDir = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data\Default\Extensions"
                  if (Test-Path $extDir) {
                    foreach ($yid in $yahooIds) {
                      $p = Join-Path $extDir $yid
                      if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
                    }
                  }
                }
                Write-Host "✅ Google restored"
              }
            }
            if ($botProc.HasExited) {
              $restartCount++
              $exitCode = $botProc.ExitCode
              Write-Host "⚠️ Bot exited (code=$exitCode, restart number $restartCount of $maxRestarts) — restarting..."
              if ($restartCount -gt $maxRestarts) {
                Write-Host "❌ Max restarts reached — stopping"
                break
              }
              if (Test-Path "$logDir\bot.err.log") {
                $tail = Get-Content "$logDir\bot.err.log" -Tail 5 -ErrorAction SilentlyContinue
                if ($tail) { $tail | ForEach-Object { Write-Host "  ERR: $_" } }
              }
              Start-Sleep -Seconds 10
              Get-Process -Name "node" -ErrorAction SilentlyContinue | ForEach-Object {
                try { taskkill /PID $_.Id /T /F 2>$null } catch {}
              }
              Start-Sleep -Seconds 2
              $botProc = Start-Bot
              Write-Host "🟢 Bot restarted — PID: $($botProc.Id)"
            }
          }
          Write-Host "🏁 Session ending — stopping bot..."
          if (-not $botProc.HasExited) {
            try { taskkill /PID $($botProc.Id) /T /F 2>$null } catch {}
          }
          Get-Process -Name "node" -ErrorAction SilentlyContinue | ForEach-Object {
            try { taskkill /PID $_.Id /T /F 2>$null } catch {}
          }
          Write-Host "✅ Session ended cleanly after $restartCount bot restart(s)"

      - name: Final Forced Backup
        if: always()
        continue-on-error: true
        timeout-minutes: 28
        shell: pwsh
        env:
          TELEGRAM_API_ID:     ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:   ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          $manifestPath = Join-Path $env:TEMP "backup_output\backup_manifest.json"
          if (!(Test-Path $manifestPath)) { exit 0 }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.Success -or -not $manifest.Files) { exit 0 }
          $uploadCode = @'
          const { TelegramClient } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs'); const path = require('path');
          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const mPath = path.join(process.env.TEMP, 'backup_output', 'backup_manifest.json');
          if (!fs.existsSync(mPath)) process.exit(0);
          const m = JSON.parse(fs.readFileSync(mPath, 'utf8'));
          if (!m.Files || !m.Files.length) process.exit(0);
          (async () => {
          let sd = ''; try { if (fs.existsSync('C:\\Users\\Public\\tg_session.dat')) sd = fs.readFileSync('C:\\Users\\Public\\tg_session.dat', 'utf8').trim(); } catch(_) {}
          const c = new TelegramClient(new StringSession(sd), apiId, apiHash, { connectionRetries: 5 });
          await c.start({ botAuthToken: botToken });
          let e = null;
          try { e = await c.getEntity(channelId); } catch (_) { if (/^\d+$/.test(channelId)) try { e = await c.getEntity('-100' + channelId); } catch (_) {} }
          if (!e) process.exit(1);
          let ok = 0, fa = 0;
          for (const f of m.Files) {
          if (!fs.existsSync(f.Path)) { fa++; continue; }
          let u = false;
          for (let a = 1; a <= 3 && !u; a++) {
          try {
          await c.sendFile(e, { file: f.Path, caption: 'Backup: ' + f.Folder + String.fromCharCode(10) + 'File: ' + f.Name, forceDocument: true, fileName: f.Name, workers: 4 });
          ok++; u = true; try { fs.unlinkSync(f.Path); } catch (_) {}
          } catch (err) {
          const mg = err.errorMessage || err.message || '';
          if (mg.includes('FLOOD_WAIT')) await new Promise(r => setTimeout(r, parseInt((mg.match(/\d+/) || ['30'])[0]) * 1000));
          else await new Promise(r => setTimeout(r, a * 3000));
          }
          }
          if (!u) fa++;
          }
          try { await c.sendMessage(e, { message: '🏁 Final: ' + ok + ' ok, ' + fa + ' failed', parseMode: 'html' }); } catch (_) {}
          await c.disconnect();
          process.exit(fa > 0 ? 1 : 0);
          })();
          '@
          Set-Content -Path "C:\Users\Public\final_upload.js" -Value $uploadCode -Encoding UTF8 -Force
          Start-Process -FilePath "node" -ArgumentList "C:\Users\Public\final_upload.js" -WorkingDirectory "C:\Users\Public" -NoNewWindow -PassThru -Wait | Out-Null
          Remove-Item "C:\Users\Public\final_upload.js" -Force -ErrorAction SilentlyContinue
