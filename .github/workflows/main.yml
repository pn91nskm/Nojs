          updatePanel();
          });
          }
          async function checkTimeoutAlerts() {
          const remaining = WORKFLOW_TIMEOUT - (Date.now() - WORKFLOW_START);
          for (const t of ALERT_THRESHOLDS) {
          if (remaining <= t && !firedAlerts.has(t)) {
          firedAlerts.add(t);
