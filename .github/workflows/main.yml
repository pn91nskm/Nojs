name: RDP_ULTRA_STATION_TELEGRAM

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      # رقم تسلسلي من GitHub (يتزايد تلقائياً مع كل تشغيل)
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Node.js
        shell: pwsh
        run: |
          try {
              $nodeVer = (node --version 2>&1).Trim()
              $npmVer = (npm --version 2>&1).Trim()
              if ($nodeVer -match '^v\d') {
                  Write-Host "Node.js already installed: $nodeVer"
                  Write-Host "npm already installed: $npmVer"
                  exit 0
              }
              throw "Node not responding"
          } catch {
              Write-Host "Node.js not found - installing via Chocolatey..."
              choco install nodejs-lts -y --silent --no-progress
              echo "C:\Program Files\nodejs" >> $env:GITHUB_PATH
          }

      - name: Setup RDP User (Dynamic Sequential Name)
        shell: pwsh
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          if ([string]::IsNullOrEmpty($password)) { $password = "admin@123" }
          
          # 🎯 الاسم التسلسلي: rdp-alkshwly-{RUN_NUMBER}
          $runNum = $env:RUN_NUMBER
          if ([string]::IsNullOrEmpty($runNum)) { $runNum = "1" }
          $username = "rdp-alkshwly-$runNum"
          
          # Windows usernames max 20 chars, so truncate if needed
          if ($username.Length -gt 20) { $username = $username.Substring(0, 20) }
          
          Write-Host "🎯 RDP Username: $username (run #$runNum)"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue
          $dirs = @("C:\Users\Public\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop\Apps")
          foreach ($dir in $dirs) {
            if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }
          Write-Host "RDP user configured: $username"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP enabled"

      - name: Install Tailscale
        run: |
          choco install tailscale -y --silent --no-progress
          echo "C:\Program Files\Tailscale" >> $env:GITHUB_PATH
          Write-Host "Tailscale installed"

      - name: Install Node Packages
        run: |
          cd C:\Users\Public
          npm init -y
          npm install telegram@2.26.22 discord.js@14.16.3
          Write-Host "Node packages installed"

      - name: Create Backup Script
        shell: pwsh
        run: |
          $script = @'
          param([string]$ProjectDirectory = "C:\Users\Public\Desktop\Project")
          $global:Prefixes = @("rfcity","zyntra","lyntra","hyntra","qp")
          $global:DynamicPattern = "ynt"
          $global:ExcludeDirs = @("node_modules","bower_components","vendor","jspm_packages","dist","build",".build","out","output","target","bin","obj","Debug","Release",".next",".nuxt",".svelte-kit",".turbo",".parcel-cache",".vite",".angular",".cache","cache","__pycache__",".venv","venv","env",".pytest_cache",".mypy_cache",".ruff_cache",".tox",".eggs",".gradle",".m2",".git",".svn",".hg",".idea",".vs",".terraform","coverage",".nyc_output","__MACOSX",".serverless","instances")
          $global:ExcludeFiles = @("*.log","*.tmp","*.temp","*.bak","*.cache","*.swp","*.swo","*~","*.pdb","*.ilk","*.pyc","*.pyo","Thumbs.db",".DS_Store","desktop.ini")
          $OutputDir = "$env:TEMP\backup_output"
          $TempDir   = "$env:TEMP\backup_work"
          if (!(Test-Path $OutputDir)) { New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null }
          if (!(Test-Path $TempDir))   { New-Item -ItemType Directory -Path $TempDir   -Force | Out-Null }
          function Get-FolderPrefix($Name) {
              foreach ($p in $global:Prefixes) { if ($Name -match "^$([regex]::Escape($p))-") { return $p } }
              if ($Name -match $global:DynamicPattern) { return ($Name -split '-')[0] }
              return "project"
          }
          function Get-UniqueZipName($prefix) {
              $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
              $uid   = -join ((65..90 | Where-Object { [char]$_ -notin @('I','O') } | Get-Random -Count 6) | ForEach-Object { [char]$_ })
              return "$prefix-$stamp-$uid.zip"
          }
          $searchPaths = @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Projects","$env:USERPROFILE\Documents\Projects","$env:USERPROFILE\source\repos","$env:USERPROFILE\OneDrive\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop","C:\Users\Public\Documents","C:\Projects","D:\Projects","D:\",$ProjectDirectory) | Where-Object { Test-Path $_ } | Select-Object -Unique
          $prefixPattern = '^(' + (($global:Prefixes | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')-'
          $folders = @()
          foreach ($sp in $searchPaths) {
              $found = Get-ChildItem -Path $sp -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -match $prefixPattern -or $_.Name -match $global:DynamicPattern) -and $_.Name -notlike '*-backup' }
              if ($found) { $folders += $found }
          }
          $folders = $folders | Sort-Object FullName | Get-Unique -AsString
          if ($folders.Count -eq 0) {
              @{ Success=$true; Files=@(); Count=0 } | ConvertTo-Json | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8
              exit 0
          }
          $results = @()
          foreach ($folder in $folders) {
              $prefix = Get-FolderPrefix -Name $folder.Name
              $zipName = Get-UniqueZipName -prefix $prefix
              $zipPath = Join-Path $OutputDir $zipName
              try {
                  $workDir = Join-Path $TempDir "$prefix-$([guid]::NewGuid().ToString('N').Substring(0,8))"
                  New-Item -ItemType Directory -Path $workDir -Force | Out-Null
                  robocopy $folder.FullName $workDir /E /XD $global:ExcludeDirs /XF $global:ExcludeFiles /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
                  Compress-Archive -Path "$workDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
                  Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue
                  $zipSize = (Get-Item $zipPath).Length
                  $zipSizeMB = [math]::Round($zipSize / 1MB, 2)
                  $results += @{ Path=$zipPath; Name=$zipName; Size=$zipSize; SizeMB=$zipSizeMB; Folder=$folder.Name }
              } catch {}
          }
          @{ Success=$true; Files=$results; Count=$results.Count } | ConvertTo-Json -Depth 3 | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8 -Force
          '@
          Set-Content -Path "C:\Users\Public\backup.ps1" -Value $script -Encoding UTF8 -Force

      - name: Create Discord Bot Script (v5.7 - Sequential Hostname + Smart Auth)
        shell: pwsh
        run: |
          $botDir = "C:\Users\Public\bot"
          if (!(Test-Path $botDir)) { New-Item -ItemType Directory -Path $botDir -Force | Out-Null }
          '{"name":"rdp-bot","version":"5.7.0","private":true,"main":"index.js","dependencies":{"discord.js":"^14.16.3","telegram":"^2.26.22"}}' | Set-Content "$botDir\package.json" -Encoding UTF8
          $botScript = @'
          /**
           * RDP Bot v5.7
           * - Sequential hostname: rdp-alkshwly-{RUN_NUMBER}
           * - Smart auth: authkey → fallback to AuthURL
           * - Ephemeral mode (auto-cleanup)
           */
          const { Client, GatewayIntentBits, ActionRowBuilder, ButtonBuilder, ButtonStyle, EmbedBuilder } = require('discord.js');
          const { TelegramClient } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const { execSync, spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');

          const BOT_TOKEN = process.env.DISCORD_BOT_TOKEN;
          const CHANNEL_ID = process.env.DISCORD_CHANNEL_ID;
          const WEBHOOK_URL = process.env.DISCORD_WEBHOOK_URL;
          const LOCK_FILE = 'C:\\session_active.lock';
          const BACKUP_SCRIPT = 'C:\\Users\\Public\\backup.ps1';
          const TG_SESSION_FILE = 'C:\\Users\\Public\\tg_session.dat';
          const TS_STATUS_FILE = 'C:\\Users\\Public\\tailscale_status.json';
          const TS_EXE = 'C:\\Program Files\\Tailscale\\tailscale.exe';
          const TELEGRAM_API_ID = parseInt(process.env.TELEGRAM_API_ID);
          const TELEGRAM_API_HASH = process.env.TELEGRAM_API_HASH;
          const TELEGRAM_BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const TELEGRAM_CHANNEL = process.env.TELEGRAM_CHANNEL_ID;
          const TAILSCALE_AUTHKEY = process.env.TAILSCALE_AUTHKEY;

          const WORKFLOW_START = Date.now();
          const WORKFLOW_TIMEOUT = 360 * 60 * 1000;
          const ALERT_THRESHOLDS = [10 * 60 * 1000, 5 * 60 * 1000, 1 * 60 * 1000];
          const firedAlerts = new Set();

          if (!BOT_TOKEN || !CHANNEL_ID) { console.error('FATAL: Missing DISCORD creds'); process.exit(1); }

          let state = 'IDLE', currentProc = null, currentPhase = 'IDLE', saveCount = 0, lastResult = 'None';
          let controlChannel = null, lastStatusMsg = null, logLines = [];
          let tgClient = null, tgEntity = null, tailscaleIp = 'N/A';
          let statusPending = false;

          const client = new Client({ intents: [GatewayIntentBits.Guilds, GatewayIntentBits.GuildMessages, GatewayIntentBits.MessageContent] });

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          function maskSecrets(text) {
            return String(text)
              .replace(/--authkey=\S+/g, '--authkey=***')
              .replace(/tskey-[A-Za-z0-9\-]+/g, 'tskey-***')
              .replace(/API key \S+/g, 'API key ***')
              .replace(/ts[A-Za-z0-9_\-]{20,}/g, '***MASKED***');
          }

          function sendDiscordWebhook(content) {
            if (!WEBHOOK_URL) return Promise.resolve(false);
            return new Promise((resolve) => {
              try {
                const body = JSON.stringify({ content: content });
                const url = new URL(WEBHOOK_URL);
                const options = {
                  hostname: url.hostname,
                  path: url.pathname + url.search,
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json; charset=utf-8',
                    'Content-Length': Buffer.byteLength(body, 'utf8')
                  }
                };
                const proto = url.protocol === 'https:' ? https : http;
                const req = proto.request(options, (res) => {
                  let data = '';
                  res.on('data', c => data += c);
                  res.on('end', () => {
                    if (res.statusCode >= 200 && res.statusCode < 300) {
                      console.log('[WH] Discord webhook sent');
                      resolve(true);
                    } else {
                      console.error('[WH] Discord webhook failed: ' + res.statusCode + ' ' + data);
                      resolve(false);
                    }
                  });
                });
                req.on('error', e => { console.error('[WH] Webhook error:', e.message); resolve(false); });
                req.write(body);
                req.end();
              } catch (e) {
                console.error('[WH] Webhook exception:', e.message);
                resolve(false);
              }
            });
          }

          function getTailscaleStatus() {
            let fullJson = '', textStatus = '', ip = null, backendState = 'Unknown';
            let authUrl = null;
            try {
              fullJson = execSync('"' + TS_EXE + '" status --json', { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 });
              const st = JSON.parse(fullJson);
              backendState = st.BackendState || 'Unknown';
              authUrl = st.AuthURL || null;
              if (st.Self && st.Self.TailscaleIPs && st.Self.TailscaleIPs.length > 0) {
                ip = st.Self.TailscaleIPs[0];
              }
            } catch (_) {}
            try {
              textStatus = execSync('"' + TS_EXE + '" status', { encoding: 'utf8' });
            } catch (_) { textStatus = ''; }
            return { fullJson, textStatus, ip, backendState, authUrl };
          }

          function captureTailscaleStatus() {
            const { fullJson } = getTailscaleStatus();
            if (fullJson) {
              try { fs.writeFileSync(TS_STATUS_FILE, fullJson.trim(), 'utf8'); return true; } catch (_) {}
            }
            return false;
          }

          async function sendStatusFileToBoth() {
            if (!fs.existsSync(TS_STATUS_FILE)) return;
            if (tgClient && tgEntity) {
              try {
                await tgClient.sendFile(tgEntity, { file: TS_STATUS_FILE, forceDocument: true, fileName: 'tailscale_status.json' });
                addLog('📎 JSON -> TG');
              } catch (_) { addLog('❌ JSON -> TG failed'); }
            }
            if (controlChannel) {
              try {
                await controlChannel.send({ files: [{ attachment: TS_STATUS_FILE, name: 'tailscale_status.json' }] });
                addLog('📎 JSON -> Discord');
              } catch (_) { addLog('❌ JSON -> Discord failed'); }
            }
            updatePanel();
          }

          async function initTelegramConnection() {
            const delays = [3000, 5000, 8000, 12000, 20000];
            for (let i = 0; i < 5; i++) {
              try {
                let sd = '';
                try { if (fs.existsSync(TG_SESSION_FILE)) sd = fs.readFileSync(TG_SESSION_FILE, 'utf8').trim(); } catch (_) {}
                const inst = new TelegramClient(new StringSession(sd), TELEGRAM_API_ID, TELEGRAM_API_HASH, { connectionRetries: 5 });
                await inst.start({ botAuthToken: TELEGRAM_BOT_TOKEN });
                try { const s = inst.session.save(); if (s && s.length > 10) fs.writeFileSync(TG_SESSION_FILE, s, 'utf8'); } catch (_) {}
                return inst;
              } catch (err) {
                console.error('[TG] Attempt ' + (i + 1) + ' failed:', err.errorMessage || err.message);
                if (i < 4) await sleep(delays[i]);
              }
            }
            return null;
          }

          async function resolveChannelEntity(inst) {
            if (!TELEGRAM_CHANNEL) return null;
            try { return await inst.getEntity(TELEGRAM_CHANNEL); } catch (_) {}
            if (/^\d+$/.test(TELEGRAM_CHANNEL)) {
              try { return await inst.getEntity('-100' + TELEGRAM_CHANNEL); } catch (_) {}
            }
            return null;
          }

          async function sendTelegramMsg(htmlText, maxRetries) {
            if (!tgClient || !tgEntity) return false;
            for (let i = 0; i < (maxRetries || 3); i++) {
              try {
                if (!tgClient.connected) await tgClient.connect();
                await tgClient.sendMessage(tgEntity, { message: htmlText, parseMode: 'html', linkPreview: false });
                return true;
              } catch (err) {
                const m = err.errorMessage || err.message || '';
                if (m.includes('FLOOD_WAIT')) {
                  await sleep(parseInt((m.match(/\d+/) || ['30'])[0]) * 1000);
                  continue;
                }
                if (i < 2) await sleep([2000, 4000][i] || 2000);
              }
            }
            return false;
          }

          async function sendConnectionMessage(sessionInfo) {
            const info = sessionInfo || {};
            const ip = info.tailscaleIp || tailscaleIp || 'N/A';
            const publicIp = info.publicIp || 'N/A';
            const rdpUser = info.rdpUser || 'rdp-alkshwly-1';
            const hostname = info.hostname || 'unknown';
            const status = info.tailscaleStatus || 'Unknown';
            const authUrl = info.authUrl || null;
            const time = info.startTime || new Date().toISOString().replace('T', ' ').substring(0, 19) + ' UTC';

            let msg;
            if (status === 'NeedsLogin' || ip === 'N/A') {
              // Fallback message with AuthURL if available
              if (authUrl) {
                msg = '⚠️ **Tailscale Requires Authentication**\n' +
                      '━━━━━━━━━━━━━━━━━━━━━\n' +
                      '🔗 **Auth URL:** ' + authUrl + '\n' +
                      '🖥️ **Hostname:** ' + hostname + '\n' +
                      '🌐 **Public IP:** ' + publicIp + '\n' +
                      '👤 **RDP User:** ' + rdpUser + '\n' +
                      '📡 **Status:** ' + status + '\n' +
                      '🕐 **Time:** ' + time + '\n' +
                      '━━━━━━━━━━━━━━━━━━━━━\n' +
                      '👉 **Open the Auth URL above to authenticate Tailscale**\n' +
                      '📎 JSON details will follow as attachment';
              } else {
                msg = '❌ **Tailscale Auth Failed**\n' +
                      '━━━━━━━━━━━━━━━━━━━━━\n' +
                      '🖥️ **Hostname:** ' + hostname + '\n' +
                      '🌐 **Public IP:** ' + publicIp + '\n' +
                      '👤 **RDP User:** ' + rdpUser + '\n' +
                      '📡 **Status:** ' + status + '\n' +
                      '🕐 **Time:** ' + time + '\n' +
                      '━━━━━━━━━━━━━━━━━━━━━\n' +
                      '⚠️ **Fix required:** Check TAILSCALE_AUTHKEY secret\n' +
                      '• Must start with `tskey-auth-`\n' +
                      '• Must have **Reusable** option enabled\n' +
                      '• Must not be expired\n' +
                      'Generate at: https://login.tailscale.com/admin/settings/keys';
              }
            } else {
              // Success message
              msg = '🖥️ RDP SESSION READY\n' +
                    '━━━━━━━━━━━━━━━━━━━━━\n' +
                    '🔗 Tailscale IP: ' + ip + '\n' +
                    '🖥️ Hostname: ' + hostname + '\n' +
                    '🌐 Public IP: ' + publicIp + '\n' +
                    '👤 RDP User: ' + rdpUser + '\n' +
                    '🔌 RDP Port: 3389\n' +
                    '📡 Status: ' + status + '\n' +
                    '🕐 Time: ' + time + '\n' +
                    '━━━━━━━━━━━━━━━━━━━━━\n' +
                    'Connect via: mstsc /v:' + ip;
            }

            let discordOk = false;
            if (WEBHOOK_URL) {
              discordOk = await sendDiscordWebhook(msg);
              if (discordOk) addLog('📨 Conn msg -> Discord webhook');
              else addLog('❌ Discord webhook failed');
            }
            if (!discordOk && controlChannel) {
              try {
                await controlChannel.send({ content: msg });
                addLog('📨 Conn msg -> Discord bot');
                discordOk = true;
              } catch (_) { addLog('❌ Discord bot msg failed'); }
            }

            // Telegram: HTML
            const tgHtml = msg
              .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
              .replace(/`([^`]+)`/g, '<code>$1</code>')
              .replace(/^(🔗 Tailscale IP:|🖥️ Hostname:|🌐 Public IP:|👤 RDP User:|🔌 RDP Port:|Connect via:)(.+)$/gm, 
                       '$1<code>$2</code>');

            let tgOk = false;
            if (tgClient && tgEntity) {
              tgOk = await sendTelegramMsg(tgHtml, 3);
              if (tgOk) addLog('📨 Conn msg -> TG');
              else addLog('❌ TG msg failed');
            }

            return discordOk || tgOk;
          }

          async function initializeTelegramAndNotify() {
            if (!TELEGRAM_API_ID || !TELEGRAM_API_HASH || !TELEGRAM_BOT_TOKEN || !TELEGRAM_CHANNEL) {
              addLog('⚠️ TG credentials missing');
              return;
            }
            addLog('📡 Connecting TG...'); updatePanel();
            tgClient = await initTelegramConnection();
            if (!tgClient) { addLog('❌ TG connection failed'); lastResult = '❌ TG connection failed'; updatePanel(); return; }
            tgEntity = await resolveChannelEntity(tgClient);
            if (!tgEntity) { addLog('❌ TG entity not found'); lastResult = '❌ TG entity not found'; updatePanel(); return; }

            let sessionInfo = null;
            try {
              const infoPath = 'C:\\Users\\Public\\session_info.json';
              if (fs.existsSync(infoPath)) {
                sessionInfo = JSON.parse(fs.readFileSync(infoPath, 'utf8'));
                if (sessionInfo.tailscaleIp) tailscaleIp = sessionInfo.tailscaleIp;
              }
            } catch (_) {}

            const sent = await sendConnectionMessage(sessionInfo);
            lastResult = sent ? '✅ Connection msg sent' : '❌ Connection msg failed';
            updatePanel();

            captureTailscaleStatus();
            await sendStatusFileToBoth();
          }

          function addLog(line) {
            const ts = new Date().toLocaleTimeString();
            logLines.push('`' + ts + '` ' + maskSecrets(line));
            if (logLines.length > 8) logLines = logLines.slice(-8);
          }

          function buildEmbed() {
            const colors = { IDLE: 0x99AAB5, COMPRESSING: 0xFFA500, UPLOADING: 0x3498DB, CANCELLING: 0xE74C3C, RESTARTING: 0x9B59B6 };
            const logText = logLines.length > 0 ? logLines.join('\n') : '_No activity yet_';
            const remaining = Math.max(0, 360 - Math.floor((Date.now() - WORKFLOW_START) / 60000));
            return new EmbedBuilder()
              .setTitle('🖥️ RDP Ultra Station Control')
              .setColor(colors[state] || 0x99AAB5)
              .addFields(
                { name: 'Status', value: state, inline: true },
                { name: 'Phase', value: currentPhase, inline: true },
                { name: 'Saves', value: String(saveCount), inline: true },
                { name: 'Remaining', value: remaining + ' min', inline: true },
                { name: 'TS IP', value: '`' + tailscaleIp + '`', inline: true },
                { name: 'TG', value: (tgClient && tgEntity) ? '✅' : '❌', inline: true },
                { name: 'Last', value: maskSecrets(lastResult), inline: false },
                { name: 'Log', value: logText, inline: false }
              )
              .setTimestamp();
          }

          function buildButtons() {
            return [new ActionRowBuilder().addComponents(
              new ButtonBuilder().setCustomId('btn_save').setLabel('Save').setEmoji('💾').setStyle(ButtonStyle.Primary).setDisabled(state !== 'IDLE'),
              new ButtonBuilder().setCustomId('btn_cancel').setLabel('Cancel').setEmoji('🛑').setStyle(ButtonStyle.Danger).setDisabled(state === 'IDLE' || state === 'CANCELLING'),
              new ButtonBuilder().setCustomId('btn_restart_ts').setLabel('Restart TS').setEmoji('🔄').setStyle(ButtonStyle.Secondary).setDisabled(state !== 'IDLE'),
              new ButtonBuilder().setCustomId('btn_status').setLabel('Status').setEmoji('📊').setStyle(ButtonStyle.Secondary)
            )];
          }

          async function postStatus() {
            if (!controlChannel) return;
            try {
              const newMsg = await controlChannel.send({ embeds: [buildEmbed()], components: buildButtons() });
              const old = lastStatusMsg;
              lastStatusMsg = newMsg;
              if (old && old.id !== newMsg.id) { try { await old.delete(); } catch (_) {} }
            } catch (_) {}
          }

          function updatePanel() {
            if (statusPending) return Promise.resolve();
            statusPending = true;
            setTimeout(function() { statusPending = false; postStatus().catch(function(){}); }, 2500);
            return Promise.resolve();
          }

          function killProcessTree(pid) { try { execSync('taskkill /PID ' + pid + ' /T /F', { stdio: 'ignore' }); } catch (_) {} }
          function cleanupTempFiles() {
            try {
              const t = process.env.TEMP || process.env.TMP;
              const o = path.join(t, 'backup_output'), w = path.join(t, 'backup_work');
              if (fs.existsSync(o)) fs.readdirSync(o).forEach(f => { try { fs.unlinkSync(path.join(o, f)); } catch (_) {} });
              if (fs.existsSync(w)) fs.rmSync(w, { recursive: true, force: true });
            } catch (_) {}
          }

          async function restartTailscale() {
            if (state !== 'IDLE') { lastResult = '⚠️ Busy'; updatePanel(); return; }
            state = 'RESTARTING'; currentPhase = 'Restarting TS'; addLog('🔄 Restart'); updatePanel();
            try {
              try { execSync('"' + TS_EXE + '" down', { stdio: 'ignore', timeout: 30000 }); } catch (_) {}
              await sleep(2000);
              let ok = false;
              try { execSync('"' + TS_EXE + '" up --hostname=rdp-alkshwly-' + process.env.RUN_NUMBER + ' --accept-routes', { stdio: 'ignore', timeout: 60000 }); ok = true; } catch (e1) {
                if (TAILSCALE_AUTHKEY) {
                  try { execSync('"' + TS_EXE + '" up --authkey=' + TAILSCALE_AUTHKEY + ' --hostname=rdp-alkshwly-' + process.env.RUN_NUMBER + ' --accept-routes --reset', { stdio: 'ignore', timeout: 60000 }); ok = true; } catch (_) {}
                }
              }
              if (!ok) throw new Error('Reconnect failed');
              let newIp = null;
              for (let i = 0; i < 15; i++) {
                await sleep(2000);
                try {
                  const s = JSON.parse(execSync('"' + TS_EXE + '" status --json', { encoding: 'utf8' }));
                  if (s.Self && s.Self.TailscaleIPs && s.Self.TailscaleIPs[0]) { newIp = s.Self.TailscaleIPs[0]; break; }
                } catch (_) {}
              }
              if (newIp) {
                tailscaleIp = newIp;
                lastResult = '✅ IP: ' + newIp;
                await sendConnectionMessage({ tailscaleIp: newIp, tailscaleStatus: 'Restarted', hostname: 'rdp-alkshwly-' + process.env.RUN_NUMBER });
                captureTailscaleStatus();
                await sendStatusFileToBoth();
              } else {
                lastResult = '⚠️ IP pending';
              }
            } catch (err) {
              lastResult = '❌ ' + maskSecrets(err.message).substring(0, 80);
            }
            state = 'IDLE'; currentPhase = 'IDLE'; updatePanel();
          }

          async function killAll() {
            if (state === 'IDLE') { lastResult = 'No op'; updatePanel(); return; }
            if (state === 'CANCELLING') return;
            state = 'CANCELLING'; updatePanel();
            if (currentProc && currentProc.pid) killProcessTree(currentProc.pid);
            cleanupTempFiles();
            currentProc = null; currentPhase = 'IDLE'; state = 'IDLE';
            lastResult = '🛑 Cancelled'; updatePanel();
          }

          function pipeLog(proc, prefix) {
            if (proc.stdout) proc.stdout.on('data', d => { String(d).split('\n').filter(l => l.trim()).forEach(l => { addLog(l.trim().substring(0, 80)); updatePanel(); }); });
            if (proc.stderr) proc.stderr.on('data', d => { String(d).split('\n').filter(l => l.trim()).forEach(l => { addLog('⚠️ ' + l.trim().substring(0, 77)); updatePanel(); }); });
          }

          function runBackup() {
            if (state !== 'IDLE') return;
            state = 'COMPRESSING'; currentPhase = 'Compressing'; addLog('🗜️ Backup'); updatePanel();
            const proc = spawn('pwsh', ['-ExecutionPolicy', 'Bypass', '-File', BACKUP_SCRIPT], { stdio: 'pipe', windowsHide: true });
            currentProc = proc; pipeLog(proc, '[BACKUP]');
            const to = setTimeout(function() { if (currentProc === proc && state === 'COMPRESSING') { killProcessTree(proc.pid); state = 'IDLE'; currentPhase = 'IDLE'; lastResult = '❌ Timeout'; updatePanel(); } }, 600000);
            proc.on('close', async function(code) {
              clearTimeout(to);
              if (code !== 0) { state = 'IDLE'; currentPhase = 'IDLE'; lastResult = '❌ Exit ' + code; updatePanel(); return; }
              const mPath = path.join(process.env.TEMP || process.env.TMP, 'backup_output', 'backup_manifest.json');
              let files = [];
              if (fs.existsSync(mPath)) { try { const m = JSON.parse(fs.readFileSync(mPath, 'utf8')); if (m.Success && m.Files) files = m.Files; } catch (_) {} }
              if (files.length === 0) { state = 'IDLE'; currentPhase = 'IDLE'; updatePanel(); return; }
              state = 'UPLOADING'; currentPhase = 'Uploading'; addLog('☁️ Upload'); updatePanel();
              let up = 0, fa = 0;
              for (const f of files) {
                if (state === 'CANCELLING') break;
                if (!fs.existsSync(f.Path)) { fa++; continue; }
                let ok = false;
                for (let a = 1; a <= 3 && !ok; a++) {
                  try {
                    if (!tgClient || !tgEntity) throw new Error('No TG');
                    if (!tgClient.connected) await tgClient.connect();
                    await tgClient.sendFile(tgEntity, { file: f.Path, caption: 'Backup: ' + f.Folder + '\nFile: ' + f.Name, forceDocument: true, fileName: f.Name, workers: 4 });
                    up++; ok = true;
                    try { fs.unlinkSync(f.Path); } catch (_) {}
                  } catch (err) {
                    const m = err.errorMessage || err.message || '';
                    if (m.includes('FLOOD_WAIT')) await sleep(parseInt((m.match(/\d+/) || ['30'])[0]) * 1000);
                    else await sleep(a * 3000);
                  }
                }
                if (!ok) fa++;
              }
              currentProc = null; currentPhase = 'IDLE'; state = 'IDLE';
              if (up > 0) { saveCount++; lastResult = '✅ Backup #' + saveCount + ' (' + up + '/' + (up + fa) + ')'; } else { lastResult = '❌ All uploads failed'; }
              updatePanel();
            });
          }

          async function checkTimeoutAlerts() {
            const remaining = WORKFLOW_TIMEOUT - (Date.now() - WORKFLOW_START);
            for (const t of ALERT_THRESHOLDS) {
              if (remaining <= t && !firedAlerts.has(t)) {
                firedAlerts.add(t);
                const mins = Math.round(t / 60000);
                await sendTelegramMsg('⏰ <b>TIMEOUT</b>\n' + mins + ' min remaining');
                if (WEBHOOK_URL) await sendDiscordWebhook('⏰ **TIMEOUT WARNING** - ' + mins + ' min remaining');
                else if (controlChannel) controlChannel.send('⏰ **' + mins + ' min left**').catch(function(){});
              }
            }
          }

          client.once('ready', async function() {
            try { controlChannel = await client.channels.fetch(CHANNEL_ID); lastStatusMsg = await controlChannel.send({ embeds: [buildEmbed()], components: buildButtons() }); } catch (_) {}
            await initializeTelegramAndNotify();
            setInterval(function() { checkTimeoutAlerts().catch(function(){}); }, 30000);
            setInterval(function() { postStatus().catch(function(){}); }, 30000);
          });

          client.on('interactionCreate', async function(i) {
            if (!i.isButton()) return;
            try { await i.deferUpdate(); } catch (_) {}
            switch (i.customId) {
              case 'btn_save': runBackup(); break;
              case 'btn_cancel': await killAll(); break;
              case 'btn_restart_ts': await restartTailscale(); break;
              case 'btn_status': {
                const remaining = Math.max(0, 360 - Math.floor((Date.now() - WORKFLOW_START) / 60000));
                i.followUp({ content: '**State:** ' + state + ' | **Remaining:** ' + remaining + ' min\n**Last:** ' + maskSecrets(lastResult), ephemeral: true }).catch(function(){});
                break;
              }
            }
          });

          client.on('messageCreate', async function(msg) {
            if (msg.author.bot || msg.channelId !== CHANNEL_ID) return;
            const c = msg.content.trim().toLowerCase();
            if (c === '!' || c === '!c') { await killAll(); msg.react('🛑').catch(function(){}); }
            else if (c === '!save') { runBackup(); msg.react('💾').catch(function(){}); }
            else if (c === '!restart') { await restartTailscale(); msg.react('🔄').catch(function(){}); }
            else if (c === '!json') { captureTailscaleStatus(); await sendStatusFileToBoth(); msg.react('📎').catch(function(){}); }
            else if (c === '!conn') { await sendConnectionMessage(); msg.react('📨').catch(function(){}); }
            else if (c === '!status') { msg.reply({ content: '**State:** ' + state + ' | **Last:** ' + maskSecrets(lastResult) }).catch(function(){}); }
          });

          process.on('unhandledRejection', e => console.error('Unhandled:', e.message || e));
          async function shutdown(reason) {
            if (currentProc && currentProc.pid) killProcessTree(currentProc.pid);
            await sendTelegramMsg('🛑 <b>Bot stopped</b> (' + reason + ')');
            client.destroy();
            if (tgClient) try { await tgClient.disconnect(); } catch (_) {}
            process.exit(0);
          }
          process.on('SIGTERM', () => shutdown('SIGTERM'));
          process.on('SIGINT', () => shutdown('SIGINT'));
          setInterval(() => { if (!fs.existsSync(LOCK_FILE)) shutdown('Lock removed'); }, 5000);
          client.login(BOT_TOKEN).catch(e => { console.error('Login failed:', e.message); process.exit(1); });
          '@
          Set-Content -Path "$botDir\index.js" -Value $botScript -Encoding UTF8 -Force

      - name: Fetch Launcher
        shell: pwsh
        continue-on-error: true
        run: |
          $launcherUrl = "${{ secrets.LAUNCHER_RAW_URL }}"
          if ([string]::IsNullOrEmpty($launcherUrl)) { exit 0 }
          try {
              $rawContent = (New-Object System.Net.WebClient).DownloadString($launcherUrl + "?t=" + (Get-Date).Ticks)
              $cleanContent = $rawContent -replace '(?m)^(\s*)//.*$', '$1'
              $cleanContent | Set-Content -Path "C:\Users\Public\Launcher.ps1" -Encoding UTF8 -NoNewline
          } catch {}

      - name: Create Session Lock
        run: |
          New-Item -Path "C:\session_active.lock" -ItemType File -Force | Out-Null

      - name: All-in-One Session (Sequential Hostname + Smart Auth)
        shell: pwsh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $botDir = "C:\Users\Public\bot"
          $logDir = "C:\logs"
          if (!(Test-Path $logDir)) { New-Item -ItemType Directory -Path $logDir -Force | Out-Null }
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"

          # 🎯 Hostname تسلسلي
          $runNum = $env:RUN_NUMBER
          if ([string]::IsNullOrEmpty($runNum)) { $runNum = "1" }
          $hostname = "rdp-alkshwly-$runNum"
          Write-Host "🎯 Hostname: $hostname (run #$runNum)"

          $tailscaleIp = "N/A"
          $tailscaleStatus = "Not installed"
          $authUrl = ""
          $rdpUser = "rdp-alkshwly-$runNum"
          if ($rdpUser.Length -gt 20) { $rdpUser = $rdpUser.Substring(0, 20) }

          if (Test-Path $tsExe) {
              Write-Host "Starting Tailscale..."
              
              $authKey = "$env:TAILSCALE_AUTHKEY"
              $authKeyValid = (-not [string]::IsNullOrEmpty($authKey) -and $authKey.StartsWith("tskey-auth-"))

              if ($authKeyValid) {
                  Write-Host "Attempting authkey connection..."
                  # --ephemeral = auto-cleanup after disconnect (prevents stale nodes)
                  & $tsExe up --authkey $authKey --hostname=$hostname --accept-routes --ephemeral --reset 2>&1 | Out-Null
                  Start-Sleep -Seconds 10

                  $maxWait = 30
                  $waited = 0
                  while ($waited -lt $maxWait) {
                      try {
                          $statusJson = & $tsExe status --json 2>&1 | Out-String
                          $tsData = $statusJson | ConvertFrom-Json -ErrorAction Stop
                          $tailscaleStatus = $tsData.BackendState
                          
                          if ($tsData.BackendState -eq "Running") {
                              if ($tsData.Self -and $tsData.Self.TailscaleIPs -and $tsData.Self.TailscaleIPs.Count -gt 0) {
                                  $tailscaleIp = $tsData.Self.TailscaleIPs[0]
                              }
                              Write-Host "✅ Tailscale connected via authkey: IP=$tailscaleIp"
                              break
                          }
                          elseif ($tsData.BackendState -eq "NeedsLogin") {
                              Write-Host "⚠️ Authkey failed (NeedsLogin) - falling back to AuthURL"
                              if ($tsData.AuthURL) { $authUrl = $tsData.AuthURL }
                              break
                          }
                      } catch { }
                      Start-Sleep -Seconds 2
                      $waited += 2
                  }
              }

              # Fallback: If authkey failed or not provided, generate AuthURL
              if ($tailscaleIp -eq "N/A" -and -not $authUrl) {
                  Write-Host "Starting tailscale up (AuthURL mode)..."
                  Start-Process -FilePath $tsExe -ArgumentList @("up","--hostname=$hostname") -NoNewWindow -PassThru | Out-Null
                  Start-Sleep -Seconds 5
                  
                  for ($i = 0; $i -lt 30; $i++) {
                      Start-Sleep -Seconds 2
                      try {
                          $statusJson = & $tsExe status --json 2>&1 | Out-String
                          $tsData = $statusJson | ConvertFrom-Json -ErrorAction Stop
                          if ($tsData.AuthURL) { 
                              $authUrl = $tsData.AuthURL
                              Write-Host "✅ AuthURL found: $authUrl"
                              break
                          }
                          if ($tsData.BackendState -eq "Running") {
                              if ($tsData.Self -and $tsData.Self.TailscaleIPs -and $tsData.Self.TailscaleIPs.Count -gt 0) {
                                  $tailscaleIp = $tsData.Self.TailscaleIPs[0]
                              }
                              Write-Host "✅ Tailscale now running: IP=$tailscaleIp"
                              break
                          }
                      } catch { }
                  }
              }

              # Fallback for IP extraction
              if ($tailscaleIp -eq "N/A") {
                  $tsIpLine = ipconfig | Select-String "100\.\d+\.\d+\.\d+" | Select-Object -First 1
                  if ($tsIpLine) { 
                      $tailscaleIp = ($tsIpLine.Line -replace '.*?(\d+\.\d+\.\d+\.\d+).*','$1').Trim()
                      $tailscaleStatus = "Connected (fallback)"
                  }
              }

              # Save raw JSON
              try {
                  $rawJson = & $tsExe status --json 2>&1 | Out-String
                  [System.IO.File]::WriteAllText("C:\Users\Public\tailscale_status.json", $rawJson.Trim(), [System.Text.Encoding]::UTF8)
              } catch {}
          }

          # Session info
          $publicIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 5) } catch { "N/A" }
          $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
          
          @{ 
              tailscaleIp=$tailscaleIp
              publicIp=$publicIp
              rdpUser=$rdpUser
              hostname=$hostname
              tailscaleStatus=$tailscaleStatus
              authUrl=$authUrl
              startTime=$now 
          } | ConvertTo-Json | Set-Content "C:\Users\Public\session_info.json" -Encoding UTF8

          Write-Host "✅ Session info written"
          Write-Host "  Hostname: $hostname"
          Write-Host "  RDP User: $rdpUser"
          Write-Host "  TS IP: $tailscaleIp"
          Write-Host "  Status: $tailscaleStatus"

          # Discord webhook initial message
          $webhookUrl = "$env:DISCORD_WEBHOOK_URL"
          if ($webhookUrl) {
              $nl = "`n"
              $msg = "🖥️ **RDP SESSION READY** (run #$runNum)$nl" +
                     "━━━━━━━━━━━━━━━━━━━━━$nl" +
                     "🖥️ **Hostname:** ``$hostname``$nl" +
                     "🔗 **Tailscale IP:** ``$tailscaleIp``$nl" +
                     "🌐 **Public IP:** ``$publicIp``$nl" +
                     "👤 **RDP User:** ``$rdpUser``$nl" +
                     "📡 **Status:** $tailscaleStatus$nl" +
                     "━━━━━━━━━━━━━━━━━━━━━$nl"
              if ($authUrl) {
                  $msg += "⚠️ **Auth required:** $authUrl"
              } else {
                  $msg += "Connect via: ``mstsc /v:$tailscaleIp``"
              }
              $body = @{ content = $msg } | ConvertTo-Json -Compress
              $bodyBytes = [System.Text.Encoding]::UTF8.GetBytes($body)
              try {
                  Invoke-RestMethod -Uri $webhookUrl -Method Post -ContentType "application/json; charset=utf-8" -Body $bodyBytes | Out-Null
                  Write-Host "✅ Discord webhook initial message sent"
              } catch {
                  Write-Host "⚠️ Discord webhook failed: $($_.Exception.Message)"
              }
          }

          Write-Host "Starting Discord bot..."
          $botProc = Start-Process -FilePath "node" -ArgumentList "$botDir\index.js" -WorkingDirectory $botDir -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logDir\bot.out.log" -RedirectStandardError "$logDir\bot.err.log"
          Start-Sleep -Seconds 15

          if ($botProc.HasExited) {
              Write-Host "WARNING: Bot exited early"
              if (Test-Path "$logDir\bot.err.log") { Get-Content "$logDir\bot.err.log" -Tail 15 }
              while (Test-Path "C:\session_active.lock") { Start-Sleep -Seconds 30 }
          } else {
              while (Test-Path "C:\session_active.lock") {
                  Start-Sleep -Seconds 5
                  if ($botProc.HasExited) {
                      $botProc = Start-Process -FilePath "node" -ArgumentList "$botDir\index.js" -WorkingDirectory $botDir -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logDir\bot.out.log" -RedirectStandardError "$logDir\bot.err.log"
                  }
              }
          }

          if (-not $botProc.HasExited) { try { taskkill /PID $($botProc.Id) /T /F 2>$null } catch {} }
          if (Test-Path "C:\session_active.lock") { Remove-Item "C:\session_active.lock" -Force }

      - name: Final Forced Backup
        if: always()
        continue-on-error: true
        timeout-minutes: 28
        shell: pwsh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
