name: RDP_ULTRA_STATION_TELEGRAM

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Node.js
        shell: pwsh
        run: |
          try {
              $nodeVer = (node --version 2>&1).Trim()
              $npmVer = (npm --version 2>&1).Trim()
              if ($nodeVer -match '^v\d') {
                  Write-Host "Node.js already installed: $nodeVer"
                  exit 0
              }
              throw "Node not responding"
          } catch {
              choco install nodejs-lts -y --silent --no-progress
              echo "C:\Program Files\nodejs" >> $env:GITHUB_PATH
          }

      - name: Setup RDP User (Sequential + Password in Message)
        shell: pwsh
        run: |
          $password = "admin@123"
          $runNum = $env:RUN_NUMBER
          if ([string]::IsNullOrEmpty($runNum)) { $runNum = "1" }
          $username = "TOOLBOXLAP"
          Write-Host "🎯 RDP Username: $username (run #$runNum)"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          $dirs = @("C:\Users\Public\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop\Apps")
          foreach ($dir in $dirs) {
              if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Set Chrome as Official Default Browser
        shell: pwsh
        run: |
          $xmlPath = "C:\defaultapps.xml"
          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chromePath)) { $chromePath = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe" }

          try {
              if (!(Test-Path $chromePath)) { throw "Chrome غير مثبت" }
              $xmlContent = '<?xml version="1.0" encoding="UTF-8"?><DefaultAssociations><Association Identifier=".htm" ProgId="ChromeHTML" ApplicationName="Google Chrome" /><Association Identifier=".html" ProgId="ChromeHTML" ApplicationName="Google Chrome" /><Association Identifier="http" ProgId="ChromeHTML" ApplicationName="Google Chrome" /><Association Identifier="https" ProgId="ChromeHTML" ApplicationName="Google Chrome" /></DefaultAssociations>'
              $xmlContent | Set-Content -Path $xmlPath -Encoding UTF8 -Force
              Start-Process dism.exe -ArgumentList "/Online /Import-DefaultAppAssociations:$xmlPath" -Wait -NoNewWindow
          } catch {}
          if (Test-Path $xmlPath) { Remove-Item $xmlPath -Force }

      # ═══════════════════════════════════════════════════════════
      #  🚀 ULTRA CHROME ENGINE: Sync + Passwords + Performance
      #  Developed by AlkshwlyHacker | v2026.Ultimate
      # ═══════════════════════════════════════════════════════════
      - name: Deploy Ultra Chrome Engine (Sync + Passwords + Security)
        shell: pwsh
        run: |
          $pol = "HKLM:\Software\Policies\Google\Chrome"
          $recPol = "HKLM:\Software\Policies\Google\Chrome\Recommended"

          @($pol, $recPol, "$pol\ExtensionInstallForcelist", "$pol\URLBlocklist") | ForEach-Object {
              if (!(Test-Path $_)) { New-Item -Path $_ -Force | Out-Null }
          }

          Write-Host "🔧 [1/6] Configuring Core Search & Browser Identity..."
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEnabled"    -Value 1              -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderName"       -Value "Google Secure" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderKeyword"    -Value "g"            -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL"  -Value "https://www.google.com/search?q={searchTerms}&hl=en&gl=us" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSuggestURL" -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderIconURL"    -Value "https://www.google.com/favicon.ico" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderNewTabURL"  -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEncodings"  -Value "UTF-8"        -Type String -Force
          Set-ItemProperty -Path $pol -Name "HomepageLocation"                -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "NewTabPageLocation"              -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "ShowHomeButton"                  -Value 1              -Type DWord  -Force

          Write-Host "🔐 [2/6] Hardening Password Manager & Autofill..."
          Set-ItemProperty -Path $pol -Name "PasswordManagerEnabled"          -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "PasswordLeakDetectionEnabled"    -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "EnhancedProtectionModeEnabled"   -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "AutofillAddressEnabled"          -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "AutofillCreditCardEnabled"       -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "AutoFillPasswordsEnabled"        -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "BrowserSignin"                   -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "SyncDisabled"                    -Value 0 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "RoamingProfileSupportEnabled"    -Value 1 -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "SyncTypesListDisabled"           -Value "" -Type String -Force

          Write-Host "⚡ [3/6] Performance & Memory Optimization..."
          Set-ItemProperty -Path $pol -Name "MemorySaverEnabled"              -Value 1         -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "HighEfficiencyModeEnabled"       -Value 1         -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "BackgroundModeEnabled"           -Value 0         -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "StartupBoostEnabled"             -Value 0         -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "HardwareAccelerationModeEnabled" -Value 1         -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "DiskCacheSize"                   -Value 268435456 -Type QWord -Force
          Set-ItemProperty -Path $pol -Name "MediaRouterCastAllowAllIPs"      -Value 0         -Type DWord -Force

          Write-Host "🛡️ [4/6] Advanced Security & Privacy Layer..."
          Set-ItemProperty -Path $pol -Name "SafeBrowsingProtectionLevel"        -Value 2        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DownloadRestrictions"               -Value 1        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "JavaScriptBlockedForUrls"           -Value ""       -Type String -Force
          Set-ItemProperty -Path $pol -Name "IncognitoModeAvailability"          -Value 0        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DeveloperToolsAvailability"         -Value 1        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "RemoteAccessHostAllowClientPairing" -Value 0        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DnsOverHttpsMode"                   -Value "secure" -Type String -Force
          Set-ItemProperty -Path $pol -Name "HttpsOnlyMode"                      -Value "allowed"-Type String -Force

          Write-Host "🧹 [5/6] UI Cleanup & Anti-Bloatware..."
          Set-ItemProperty -Path $pol -Name "PromotionalTabsEnabled"        -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "WelcomePageOnOSUpgradeEnabled" -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "HideWebStoreIcon"              -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "NTPCustomBackgroundEnabled"    -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "SidePanelEnabled"              -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "TranslateEnabled"              -Value 1 -Type DWord -Force

          Write-Host "🔒 [6/6] Registry ACL Protection & Watchdog Deployment..."
          try {
              $regKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Software\Policies\Google\Chrome",[Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree,[System.Security.AccessControl.RegistryRights]::ChangePermissions)
              if ($regKey) {
                  $acl = $regKey.GetAccessControl()
                  $usersRule = New-Object System.Security.AccessControl.RegistryAccessRule("BUILTIN\Users","ReadKey","ContainerInherit,ObjectInherit","None","Allow")
                  $adminRule = New-Object System.Security.AccessControl.RegistryAccessRule("BUILTIN\Administrators","FullControl","ContainerInherit,ObjectInherit","None","Allow")
                  $acl.SetAccessRule($usersRule)
                  $acl.SetAccessRule($adminRule)
                  $regKey.SetAccessControl($acl); $regKey.Close()
                  Write-Host "✅ Registry ACLs Locked (Admins Only)"
              }
          } catch { Write-Host "⚠️ ACL Warning: $_" }

          $wdLines = @(
              '$pol = "HKLM:\Software\Policies\Google\Chrome"',
              '$checks = @{ "DefaultSearchProviderSearchURL"="*google.com*"; "PasswordManagerEnabled"=1; "SyncDisabled"=0; "SafeBrowsingProtectionLevel"=2; "MemorySaverEnabled"=1 }',
              '$needsFix = $false',
              'foreach ($key in $checks.Keys) { $val = (Get-ItemProperty -Path $pol -Name $key -ErrorAction SilentlyContinue).$key; if ($val -notlike $checks[$key]) { $needsFix = $true; break } }',
              'if ($needsFix) {',
              '    Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEnabled"   -Value 1 -Type DWord -Force',
              '    Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL" -Value "https://www.google.com/search?q={searchTerms}&hl=en&gl=us" -Type String -Force',
              '    Set-ItemProperty -Path $pol -Name "PasswordManagerEnabled"         -Value 1 -Type DWord -Force',
              '    Set-ItemProperty -Path $pol -Name "SyncDisabled"                   -Value 0 -Type DWord -Force',
              '    Set-ItemProperty -Path $pol -Name "SafeBrowsingProtectionLevel"    -Value 2 -Type DWord -Force',
              '    Set-ItemProperty -Path $pol -Name "MemorySaverEnabled"             -Value 1 -Type DWord -Force',
              '    Write-Output "$((Get-Date).ToString()): Chrome policies restored" | Out-File "C:\logs\chrome_watchdog.log" -Append',
              '}'
          )
          Set-Content -Path "C:\Users\Public\chrome_watchdog.ps1" -Value $wdLines -Encoding UTF8 -Force

          $pwshPath = "C:\Program Files\PowerShell\7\pwsh.exe"
          $action   = New-ScheduledTaskAction -Execute $pwshPath -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File C:\Users\Public\chrome_watchdog.ps1"
          $trigger  = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(10) -RepetitionInterval 00:01:00 -RepetitionDuration 06:00:00
          $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable

          try {
              Register-ScheduledTask -TaskName "ChromeUltraWatchdog" -Action $action -Trigger $trigger -Settings $settings -RunLevel Highest -User "SYSTEM" -Force | Out-Null
              Write-Host "✅ ChromeUltraWatchdog Registered Successfully (Interval: 1 min)"
          } catch {
              Write-Host "❌ Failed to register Watchdog: $_"
              exit 1
          }

          Write-Host "🎉 ULTRA CHROME ENGINE DEPLOYED SUCCESSFULLY"

      - name: Install Tailscale
        run: |
          choco install tailscale -y --silent --no-progress
          echo "C:\Program Files\Tailscale" >> $env:GITHUB_PATH

      - name: Install Node Packages
        run: |
          cd C:\Users\Public
          npm init -y
          npm install telegram@2.26.22 discord.js@14.16.3

      - name: Create Backup Script
        shell: pwsh
        run: |
          $script = @'
          param([string]$ProjectDirectory = "C:\Users\Public\Desktop\Project")
          $global:Prefixes = @("rfcity","zyntra","lyntra","hyntra","qp")
          $global:DynamicPattern = "ynt"
          $global:ExcludeDirs = @("node_modules","bower_components","vendor","jspm_packages","dist","build",".build","out","output","target","bin","obj","Debug","Release",".next",".nuxt",".svelte-kit",".turbo",".parcel-cache",".vite",".angular",".cache","cache","__pycache__",".venv","venv","env",".pytest_cache",".mypy_cache",".ruff_cache",".tox",".eggs",".gradle",".m2",".git",".svn",".hg",".idea",".vs",".terraform","coverage",".nyc_output","__MACOSX",".serverless","instances")
          $global:ExcludeFiles = @("*.log","*.tmp","*.temp","*.bak","*.cache","*.swp","*.swo","*~","*.pdb","*.ilk","*.pyc","*.pyo","Thumbs.db",".DS_Store","desktop.ini")
          $OutputDir = "$env:TEMP\backup_output"
          $TempDir   = "$env:TEMP\backup_work"
          if (!(Test-Path $OutputDir)) { New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null }
          if (!(Test-Path $TempDir))   { New-Item -ItemType Directory -Path $TempDir   -Force | Out-Null }
          function Get-FolderPrefix($Name) {
          foreach ($p in $global:Prefixes) { if ($Name -match "^$([regex]::Escape($p))-") { return $p } }
          if ($Name -match $global:DynamicPattern) { return ($Name -split '-')[0] }
          return "project"
          }
          function Get-UniqueZipName($prefix) {
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $uid   = -join ((65..90 | Where-Object { [char]$_ -notin @('I','O') } | Get-Random -Count 6) | ForEach-Object { [char]$_ })
          return "$prefix-$stamp-$uid.zip"
          }
          $searchPaths = @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Projects","$env:USERPROFILE\Documents\Projects","$env:USERPROFILE\source\repos","$env:USERPROFILE\OneDrive\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop","C:\Users\Public\Documents","C:\Projects","D:\Projects","D:\",$ProjectDirectory) | Where-Object { Test-Path $_ } | Select-Object -Unique
          $prefixPattern = '^(' + (($global:Prefixes | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')-'
          $folders = @()
          foreach ($sp in $searchPaths) {
          $found = Get-ChildItem -Path $sp -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -match $prefixPattern -or $_.Name -match $global:DynamicPattern) -and $_.Name -notlike '*-backup' }
          if ($found) { $folders += $found }
          }
          $folders = $folders | Sort-Object FullName | Get-Unique -AsString
          if ($folders.Count -eq 0) {
          @{ Success=$true; Files=@(); Count=0 } | ConvertTo-Json | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8
          exit 0
          }
          $results = @()
          foreach ($folder in $folders) {
          $prefix = Get-FolderPrefix -Name $folder.Name
          $zipName = Get-UniqueZipName -prefix $prefix
          $zipPath = Join-Path $OutputDir $zipName
          try {
          $workDir = Join-Path $TempDir "$prefix-$([guid]::NewGuid().ToString('N').Substring(0,8))"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          robocopy $folder.FullName $workDir /E /XD $global:ExcludeDirs /XF $global:ExcludeFiles /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
          Compress-Archive -Path "$workDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue
          $zipSize = (Get-Item $zipPath).Length
          $zipSizeMB = [math]::Round($zipSize / 1MB, 2)
          $results += @{ Path=$zipPath; Name=$zipName; Size=$zipSize; SizeMB=$zipSizeMB; Folder=$folder.Name }
          } catch {}
          }
          @{ Success=$true; Files=$results; Count=$results.Count } | ConvertTo-Json -Depth 3 | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8 -Force
          '@
          Set-Content -Path "C:\Users\Public\backup.ps1" -Value $script -Encoding UTF8 -Force
      - name: Create Discord Bot Script (v6.0 - Ultra Logger + Ephemeral + !log)
        shell: pwsh
        run: |
          $botDir = "C:\Users\Public\bot"
          if (!(Test-Path $botDir)) { New-Item -ItemType Directory -Path $botDir -Force | Out-Null }
          '{"name":"rdp-ultra-bot","version":"6.0.0","private":true,"main":"index.js","dependencies":{"discord.js":"^14.16.3","telegram":"^2.26.22"}}' | Set-Content "$botDir\package.json" -Encoding UTF8

          $indexContent = Get-Content "C:\Users\Public\bot\index.js" -Raw -ErrorAction SilentlyContinue
          if ([string]::IsNullOrEmpty($indexContent)) {
              Write-Host "⚠️ index.js not found in bot dir — will be written by next step"
          } else {
              Write-Host "✅ index.js already present ($($indexContent.Length) chars)"
          }

      - name: Write Bot index.js (v6.0)
        shell: pwsh
        run: |
          $botDir = "C:\Users\Public\bot"
          if (!(Test-Path $botDir)) { New-Item -ItemType Directory -Path $botDir -Force | Out-Null }
          # يجب رفع index.js إلى الـ repo وسيُنسخ تلقائياً عبر actions/checkout
          $srcPath = "$env:GITHUB_WORKSPACE\index.js"
          $dstPath = "$botDir\index.js"
          if (Test-Path $srcPath) {
              Copy-Item -Path $srcPath -Destination $dstPath -Force
              Write-Host "✅ index.js copied from repo ($((Get-Item $dstPath).Length) bytes)"
          } else {
              Write-Host "❌ index.js not found in workspace — check repo!"
              exit 1
          }

          # تثبيت الحزم داخل مجلد البوت
          Set-Location $botDir
          npm install --prefer-offline 2>&1 | Select-Object -Last 5 | ForEach-Object { Write-Host $_ }
          Write-Host "✅ Bot packages installed"

      - name: Fetch Launcher & Create Files
        shell: pwsh
        continue-on-error: true
        env:
          LAUNCHER_RAW_URL:      ${{ secrets.LAUNCHER_RAW_URL }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG_CONTENT }}
          INFO_LINE1:            ${{ secrets.INFO_LINE1 }}
          INFO_LINE2:            ${{ secrets.INFO_LINE2 }}
          INFO_LINE3:            ${{ secrets.INFO_LINE3 }}
          PANGOLIN_TOKEN:        ${{ secrets.PANGOLIN_TOKEN }}
          DISCORD_WEBHOOK_URL:   ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_API_ID:       ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:     ${{ secrets.TELEGRAM_API_HASH }}
          RUN_NUMBER:            ${{ github.run_number }}
        run: |
          $publicDir  = "C:\Users\Public"
          $launcher   = "$publicDir\Launcher.ps1"
          $runNum     = $env:RUN_NUMBER
          $nl         = "`n"

          # ── 1. جلب Launcher ──
          $launcherUrl = $env:LAUNCHER_RAW_URL
          $launcherOk  = $false
          if ([string]::IsNullOrEmpty($launcherUrl)) {
              Write-Host "⚠️ LAUNCHER_RAW_URL غير موجود في Secrets — تم التخطي"
          } else {
              try {
                  $rawContent   = (New-Object System.Net.WebClient).DownloadString($launcherUrl + "?t=" + (Get-Date).Ticks)
                  $cleanContent = $rawContent -replace '(?m)^(\s*)//.*$', '$1'
                  $cleanContent | Set-Content -Path $launcher -Encoding UTF8 -NoNewline
                  $launcherOk = $true
                  Write-Host "✅ تم جلب الـ Launcher بنجاح"
              } catch {
                  Write-Host "❌ فشل جلب الـ Launcher: $($_.Exception.Message)"
              }
          }

          # ── 2. إنشاء ملف rclone.conf + save.txt ──
          $rcloneConfig = $env:RCLONE_CONFIG_CONTENT
          if (-not [string]::IsNullOrEmpty($rcloneConfig)) {
              $confDir = "$env:APPDATA\rclone"
              if (!(Test-Path $confDir)) { New-Item -ItemType Directory -Path $confDir -Force | Out-Null }
              Set-Content -Path "$confDir\rclone.conf"    -Value $rcloneConfig -Encoding UTF8 -Force
              Set-Content -Path "$publicDir\save.txt"     -Value $rcloneConfig -Encoding UTF8 -NoNewline -Force
              Write-Host "✅ rclone.conf + save.txt تم إنشاؤهما"
          } else {
              Write-Host "⚠️ RCLONE_CONFIG_CONTENT غير موجود — تم التخطي"
          }

          # ── 3. إنشاء info.txt ──
          $l1 = $env:INFO_LINE1; $l2 = $env:INFO_LINE2; $l3 = $env:INFO_LINE3
          if (-not [string]::IsNullOrEmpty($l1)) {
              @($l1, $l2, $l3) | Set-Content -Path "$publicDir\info.txt" -Encoding UTF8 -NoNewline
              Write-Host "✅ info.txt تم إنشاؤه"
          } else {
              Write-Host "⚠️ INFO_LINE1 غير موجود — تم التخطي"
          }

          # ── 4. إنشاء token.txt ──
          $token = $env:PANGOLIN_TOKEN
          if (-not [string]::IsNullOrEmpty($token)) {
              Set-Content -Path "$publicDir\token.txt" -Value $token -Encoding UTF8 -NoNewline -Force
              Write-Host "✅ token.txt تم إنشاؤه"
          } else {
              Write-Host "⚠️ PANGOLIN_TOKEN غير موجود — تم التخطي"
          }

          # ── 5. إنشاء Desktop shortcuts (SETUP + SAVE) ──
          if ($launcherOk) {
              $pwshExe = "C:\Program Files\PowerShell\7\pwsh.exe"
              $WshShell = New-Object -ComObject WScript.Shell
              foreach ($t in @("SETUP","SAVE")) {
                  $sc = $WshShell.CreateShortcut("C:\Users\Public\Desktop\$t.lnk")
                  $sc.TargetPath = $pwshExe
                  $sc.Arguments  = "-ExecutionPolicy Bypass -File `"$launcher`" $t"
                  $sc.Save()
              }
              Write-Host "✅ Shortcuts SETUP + SAVE تم إنشاؤهما على Desktop"
          }

          # ── 6. إشعار Telegram ──
          $tgToken  = $env:TELEGRAM_BOT_TOKEN
          $tgChatId = $env:TELEGRAM_CHANNEL_ID
          if ((-not [string]::IsNullOrEmpty($tgToken)) -and (-not [string]::IsNullOrEmpty($tgChatId))) {
              $status = if ($launcherOk) { "✅ نجح الجلب" } else { "❌ فشل الجلب" }
              $tgMsg  = "🚀 <b>Launcher Status</b> (run #$runNum)$nl" +
              "━━━━━━━━━━━━━━━━━━━━━$nl" +
              "📦 <b>Launcher:</b> $status$nl" +
              "💾 <b>save.txt:</b> $(if (-not [string]::IsNullOrEmpty($rcloneConfig)) { '✅' } else { '⚠️ مفقود' })$nl" +
              "📄 <b>info.txt:</b> $(if (-not [string]::IsNullOrEmpty($l1)) { '✅' } else { '⚠️ مفقود' })$nl" +
              "🔑 <b>token.txt:</b> $(if (-not [string]::IsNullOrEmpty($token)) { '✅' } else { '⚠️ مفقود' })$nl" +
              "🖥️ <b>Shortcuts:</b> $(if ($launcherOk) { '✅ SETUP + SAVE' } else { '⚠️ لم تُنشأ' })$nl" +
              "━━━━━━━━━━━━━━━━━━━━━"
              $tgBody  = @{ chat_id = $tgChatId; text = $tgMsg; parse_mode = "HTML" } | ConvertTo-Json -Compress
              $tgBytes = [System.Text.Encoding]::UTF8.GetBytes($tgBody)
              try {
                  Invoke-RestMethod -Uri "https://api.telegram.org/bot$tgToken/sendMessage" -Method Post -ContentType "application/json; charset=utf-8" -Body $tgBytes | Out-Null
                  Write-Host "✅ إشعار Telegram أُرسل"
              } catch { Write-Host "⚠️ فشل إشعار Telegram: $($_.Exception.Message)" }
          }

          # ── 7. Session Lock ──
          New-Item -Path "C:\session_active.lock" -ItemType File -Force | Out-Null
          Write-Host "✅ Session lock تم إنشاؤه"

      - name: All-in-One Session (Password + Sequential Hostname)
        shell: pwsh
        env:
          TELEGRAM_API_ID:     ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:   ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_BOT_TOKEN:   ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID:  ${{ secrets.DISCORD_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAILSCALE_AUTHKEY:   ${{ secrets.TAILSCALE_AUTHKEY }}
          RUN_NUMBER:          ${{ github.run_number }}
        run: |
          $botDir = "C:\Users\Public\bot"
          $logDir = "C:\logs"
          if (!(Test-Path $logDir)) { New-Item -ItemType Directory -Path $logDir -Force | Out-Null }
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          $runNum = $env:RUN_NUMBER
          if ([string]::IsNullOrEmpty($runNum)) { $runNum = "1" }
          $hostname = "rdp-alkshwly-$runNum"
          $rdpUser = "TOOLBOXLAP"
          $password = "admin@123"
          $startTime = Get-Date

          Write-Host "🎯 Hostname: $hostname (run #$runNum)"
          Write-Host "👤 RDP User: $rdpUser"

          $tailscaleIp = "N/A"
          $tailscaleStatus = "Not installed"
          $authUrl = ""

          if (Test-Path $tsExe) {
              Write-Host "Starting Tailscale..."

              function Wait-TailscaleReady {
                  param([string]$Label = "")
                  Write-Host "⏳ Polling Tailscale ($Label) every 500ms — no timeout..."
                  while ($true) {
                      Start-Sleep -Milliseconds 500
                      try {
                          $j = & $tsExe status --json 2>&1 | Out-String
                          $d = $j | ConvertFrom-Json -ErrorAction Stop
                          $script:tailscaleStatus = $d.BackendState
                          if ($d.BackendState -eq "Running") {
                              if ($d.Self -and $d.Self.TailscaleIPs -and $d.Self.TailscaleIPs.Count -gt 0) {
                                  $script:tailscaleIp = $d.Self.TailscaleIPs[0]
                              }
                              Write-Host "✅ Tailscale Running! IP=$($script:tailscaleIp)"
                              return "Running"
                          }
                          elseif ($d.BackendState -eq "NeedsLogin") {
                              if ($d.AuthURL -and [string]::IsNullOrEmpty($script:authUrl)) {
                                  $script:authUrl = $d.AuthURL
                              }
                              Write-Host "🔗 NeedsLogin — AuthURL captured"
                              return "NeedsLogin"
                          }
                      } catch { }
                  }
              }

              $authKey      = "$env:TAILSCALE_AUTHKEY"
              $keyMissing   = [string]::IsNullOrEmpty($authKey)
              $keyWrongFmt  = (-not $keyMissing -and -not $authKey.StartsWith("tskey-auth-"))
              $authKeyValid = (-not $keyMissing -and -not $keyWrongFmt)
              $nl           = "`n"

              # PHASE 1 — authkey موجود وصحيح
              if ($authKeyValid) {
                  Write-Host "🔑 PHASE 1: Trying authkey..."
                  & $tsExe up --authkey $authKey --hostname=$hostname --accept-routes --reset 2>&1 | Out-Null
                  $phase1Result = Wait-TailscaleReady -Label "authkey"
                  if ($phase1Result -eq "NeedsLogin") {
                      Write-Host "⚠️ AuthKey رفضه Tailscale — سيتم الانتقال لـ AuthURL"
                  }
              }
              # PHASE 2 — authkey غير موجود أو صيغة خاطئة
              elseif ($keyMissing) {
                  Write-Host "⚠️ PHASE 2a: لا يوجد TAILSCALE_AUTHKEY — سيظهر AuthURL"
                  Start-Process -FilePath $tsExe -ArgumentList @("up","--hostname=$hostname","--accept-routes") -NoNewWindow -PassThru | Out-Null
              }
              elseif ($keyWrongFmt) {
                  Write-Host "⚠️ PHASE 2b: صيغة AuthKey خاطئة — سيظهر AuthURL"
                  Start-Process -FilePath $tsExe -ArgumentList @("up","--hostname=$hostname","--accept-routes") -NoNewWindow -PassThru | Out-Null
              }

              # PHASE 3 — انتظر AuthURL ثم أرسله
              if ($tailscaleIp -eq "N/A") {
                  if ([string]::IsNullOrEmpty($authUrl)) {
                      $waitResult = Wait-TailscaleReady -Label "waiting-for-AuthURL"
                  }
                  if (-not [string]::IsNullOrEmpty($authUrl)) {
                      $publicIpEarly = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 5) } catch { "N/A" }
                      Write-Host "🔗 AuthURL: $authUrl"
                      Write-Host "⏳ انتظار مصادقة المستخدم..."
                      @{
                          tailscaleIp    = "N/A"
                          publicIp       = $publicIpEarly
                          rdpUser        = $rdpUser
                          rdpPassword    = $password
                          hostname       = $hostname
                          tailscaleStatus= "NeedsLogin"
                          authUrl        = $authUrl
                          startTime      = (Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC")
                      } | ConvertTo-Json | Set-Content "C:\Users\Public\session_info.json" -Encoding UTF8
                  }
                  $connectResult = Wait-TailscaleReady -Label "post-auth-connect"
                  if ($connectResult -eq "Running" -and $tailscaleIp -ne "N/A") {
                      Write-Host "✅ Tailscale متصل — IP: $tailscaleIp — البوت سيرسل الإشعار"
                  }
              }

              # PHASE 4 — ipconfig fallback
              if ($tailscaleIp -eq "N/A") {
                  $tsIpLine = ipconfig | Select-String "100\.\d+\.\d+\.\d+" | Select-Object -First 1
                  if ($tsIpLine) {
                      $tailscaleIp     = ($tsIpLine.Line -replace '.*?(\d+\.\d+\.\d+\.\d+).*','$1').Trim()
                      $tailscaleStatus = "Connected (fallback)"
                      Write-Host "✅ Tailscale IP via ipconfig fallback: $tailscaleIp"
                  }
              }

              try {
                  $rawJson = & $tsExe status --json 2>&1 | Out-String
                  [System.IO.File]::WriteAllText("C:\Users\Public\tailscale_status.json", $rawJson.Trim(), [System.Text.Encoding]::UTF8)
              } catch {}
          }

          $publicIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 5) } catch { "N/A" }
          $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
          @{
              tailscaleIp=$tailscaleIp
              publicIp=$publicIp
              rdpUser=$rdpUser
              rdpPassword=$password
              hostname=$hostname
              tailscaleStatus=$tailscaleStatus
              authUrl=$authUrl
              startTime=$now
          } | ConvertTo-Json | Set-Content "C:\Users\Public\session_info.json" -Encoding UTF8
          Write-Host "✅ Session info written (with password)"

          # ════════════════════════════════════════════════════════
          # تشغيل البوت مع restart تلقائي + Google Watchdog داخل الحلقة
          # ════════════════════════════════════════════════════════
          Write-Host "🤖 Starting Discord/Telegram bot..."
          $restartCount  = 0
          $lockFile      = "C:\session_active.lock"
          $heartbeatFile = "C:\Users\Public\heartbeat.txt"

          function Start-Bot {
              return Start-Process -FilePath "node" `
                  -ArgumentList "$botDir\index.js" `
                  -WorkingDirectory $botDir `
                  -WindowStyle Hidden -PassThru `
                  -RedirectStandardOutput "$logDir\bot.out.log" `
                  -RedirectStandardError  "$logDir\bot.err.log"
          }

          $botProc = Start-Bot
          Write-Host "🟢 Bot PID: $($botProc.Id)"

          while (Test-Path $lockFile) {
              Start-Sleep -Seconds 5

              [System.IO.File]::WriteAllText($heartbeatFile,
                  "alive: $(Get-Date -Format 'HH:mm:ss') | restarts: $restartCount | bot: $(if (-not $botProc.HasExited) { 'running' } else { 'restarting' })",
                  [System.Text.Encoding]::UTF8)

              # ── Google Watchdog: تحقق كل ~30 ثانية ──
              $loopElapsed = (New-TimeSpan -Start $startTime -End (Get-Date)).TotalSeconds
              if ($loopElapsed % 30 -lt 5) {
                  $polPath  = "HKLM:\Software\Policies\Google\Chrome"
                  $yahooIds = @("cnmdgidklhhnmpphlfmmopmghfjhgkdi","nljkibfhlpcnanjgbnlnbjecgicbjkge","fpmeembnagmagppkgghhfjfdfajdfcah")
                  $cur = Get-ItemProperty -Path $polPath -Name "DefaultSearchProviderSearchURL" -ErrorAction SilentlyContinue
                  if ($cur.DefaultSearchProviderSearchURL -notlike "*google.com*") {
                      Write-Host "⚠️ محرك البحث تغير — إعادة ضبط Google..."
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderEnabled"    -Value 1        -Type DWord  -Force
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderName"       -Value "Google" -Type String -Force
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderKeyword"    -Value "google.com" -Type String -Force
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderSearchURL"  -Value "https://www.google.com/search?q={searchTerms}" -Type String -Force
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderSuggestURL" -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderIconURL"    -Value "https://www.google.com/favicon.ico" -Type String -Force
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderNewTabURL"  -Value "https://www.google.com" -Type String -Force
                      Set-ItemProperty -Path $polPath -Name "DefaultSearchProviderEncodings"  -Value "UTF-8"  -Type String -Force
                      Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                          $extDir = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data\Default\Extensions"
                          if (Test-Path $extDir) {
                              foreach ($yid in $yahooIds) {
                                  $p = Join-Path $extDir $yid
                                  if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue }
                              }
                          }
                      }
                      Write-Host "✅ Google restored"
                  }
              }

              # restart فوري إذا خرج البوت
              if ($botProc.HasExited) {
                  $restartCount++
                  $exitCode = $botProc.ExitCode
                  Write-Host "⚠️ Bot exited (code=$exitCode, restart #$restartCount) — restarting..."
                  if (Test-Path "$logDir\bot.err.log") {
                      $tail = Get-Content "$logDir\bot.err.log" -Tail 5 -ErrorAction SilentlyContinue
                      if ($tail) { $tail | ForEach-Object { Write-Host "  ERR: $_" } }
                  }
                  Start-Sleep -Seconds 2
                  $botProc = Start-Bot
                  Write-Host "🟢 Bot restarted — PID: $($botProc.Id)"
              }
          }

          Write-Host "🔒 Lock removed — stopping bot and cleaning up..."
          if (-not $botProc.HasExited) {
              try { taskkill /PID $($botProc.Id) /T /F 2>$null } catch {}
          }
          if (Test-Path $lockFile) { Remove-Item $lockFile -Force }
          Write-Host "✅ Session ended cleanly after $restartCount bot restart(s)"

      - name: Final Forced Backup
        if: always()
        continue-on-error: true
        timeout-minutes: 28
        shell: pwsh
        env:
          TELEGRAM_API_ID:     ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH:   ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          $manifestPath = Join-Path $env:TEMP "backup_output\backup_manifest.json"
          if (!(Test-Path $manifestPath)) { exit 0 }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if (-not $manifest.Success -or -not $manifest.Files) { exit 0 }

          $uploadCode = @'
          const { TelegramClient } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs'); const path = require('path');
          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const mPath = path.join(process.env.TEMP, 'backup_output', 'backup_manifest.json');
          if (!fs.existsSync(mPath)) process.exit(0);
          const m = JSON.parse(fs.readFileSync(mPath, 'utf8'));
          if (!m.Files || !m.Files.length) process.exit(0);
          (async () => {
          let sd = ''; try { if (fs.existsSync('C:\\Users\\Public\\tg_session.dat')) sd = fs.readFileSync('C:\\Users\\Public\\tg_session.dat', 'utf8').trim(); } catch(_) {}
          const c = new TelegramClient(new StringSession(sd), apiId, apiHash, { connectionRetries: 5 });
          await c.start({ botAuthToken: botToken });
          let e = null;
          try { e = await c.getEntity(channelId); } catch (_) { if (/^\d+$/.test(channelId)) try { e = await c.getEntity('-100' + channelId); } catch (_) {} }
          if (!e) process.exit(1);
          let ok = 0, fa = 0;
          for (const f of m.Files) {
          if (!fs.existsSync(f.Path)) { fa++; continue; }
          let u = false;
          for (let a = 1; a <= 3 && !u; a++) {
          try {
          await c.sendFile(e, { file: f.Path, caption: 'Backup: ' + f.Folder + '\nFile: ' + f.Name, forceDocument: true, fileName: f.Name, workers: 4 });
          ok++; u = true; try { fs.unlinkSync(f.Path); } catch (_) {}
          } catch (err) {
          const mg = err.errorMessage || err.message || '';
          if (mg.includes('FLOOD_WAIT')) await new Promise(r => setTimeout(r, parseInt((mg.match(/\d+/) || ['30'])[0]) * 1000));
          else await new Promise(r => setTimeout(r, a * 3000));
          }
          }
          if (!u) fa++;
          }
          try { await c.sendMessage(e, { message: '🏁 Final: ' + ok + ' ok, ' + fa + ' failed', parseMode: 'html' }); } catch (_) {}
          await c.disconnect();
          process.exit(fa > 0 ? 1 : 0);
          })();
          '@
          Set-Content -Path "C:\Users\Public\final_upload.js" -Value $uploadCode -Encoding UTF8 -Force
          Start-Process -FilePath "node" -ArgumentList "C:\Users\Public\final_upload.js" -WorkingDirectory "C:\Users\Public" -NoNewWindow -PassThru -Wait | Out-Null
          Remove-Item "C:\Users\Public\final_upload.js" -Force -ErrorAction SilentlyContinue
