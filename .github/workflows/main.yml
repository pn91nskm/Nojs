name: Build ARMv7 Binary (Termux Native)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            file \
            curl \
            git \
            python3 \
            make \
            perl \
            bc \
            binutils

      - name: Fetch file list
        run: |
          if [ -z "${{ secrets.FILES_RAWS }}" ]; then
            echo "ERROR: FILES_RAWS secret is not set"
            exit 1
          fi

          curl -fsSL \
            -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36" \
            "${{ secrets.FILES_RAWS }}" \
            -o file_list.txt

          if [ ! -s file_list.txt ]; then
            echo "ERROR: file_list.txt is empty or download failed"
            exit 1
          fi

          FILE_COUNT=$(wc -l < file_list.txt)
          echo "Fetched $FILE_COUNT file entries"
          echo "Files list (names only):"
          head -10 file_list.txt | awk -F'":"' '{print $1}' | tr -d '"'

      - name: Download source files
        run: |
          python3 << 'PYTHON_SCRIPT'
          import urllib.request
          import os
          import sys

          with open('file_list.txt', 'r', encoding='utf-8') as f:
              content = f.read()

          files = {}
          for line in content.strip().split('\n'):
              if '":"' not in line:
                  continue
              parts = line.split('":"', 1)
              if len(parts) != 2:
                  continue
              
              # ✅ تحويل كل المسارات: backslash → forward slash
              key = parts[0].strip().strip('"').replace('\\\\', '/').replace('\\', '/')
              val = parts[1].strip().strip('"')
              
              key = key.strip()
              val = val.strip()
              
              if key and val:
                  files[key] = val

          if not files:
              print("ERROR: No files parsed from file_list.txt")
              sys.exit(1)

          print(f"Files to download: {len(files)}")
          for f in sorted(files.keys()):
              print(f"  📄 {f}")

          SUCCESS = 0
          FAILED = 0
          SKIPPED = 0

          for file_path, file_url in files.items():
              if not file_url or file_url.strip() == '':
                  print(f"Skipping empty URL: {file_path}")
                  SKIPPED += 1
                  continue

              print(f"Downloading: {file_path}")
              
              dir_name = os.path.dirname(file_path)
              if dir_name:
                  os.makedirs(dir_name, exist_ok=True)

              try:
                  req = urllib.request.Request(file_url)
                  req.add_header('User-Agent', 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36')
                  req.add_header('Referer', 'https://notedev.lyntra.cc.cd/')
                  req.add_header('Origin', 'https://notedev.lyntra.cc.cd')

                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = response.read()

                  with open(file_path, 'wb') as f:
                      f.write(data)

                  print(f"OK: {file_path} ({len(data)} bytes)")
                  SUCCESS += 1

              except Exception as e:
                  print(f"FAILED: {file_path} => {e}")
                  FAILED += 1

          print(f"\nSummary: {SUCCESS} OK, {FAILED} failed, {SKIPPED} skipped")

          if FAILED > 0:
              print("WARNING: Some files failed to download")

          if SUCCESS == 0:
              print("ERROR: No files downloaded successfully")
              sys.exit(1)
          PYTHON_SCRIPT

      # ✅ إنشاء مجلد patch تلقائياً BEFORE التحقق من البنية
      - name: Auto-create patch directory if needed
        run: |
          echo "=== Checking if patch directory is needed ==="
          
          if grep -q "\[patch.crates-io\]" Cargo.toml 2>/dev/null; then
            echo "INFO: [patch.crates-io] found in Cargo.toml"
            
            if [ ! -f "patches/rustls-platform-verifier/Cargo.toml" ]; then
              echo "⚠️  Patch directory missing! Creating it automatically..."
              
              mkdir -p patches/rustls-platform-verifier/src
              
              cat > patches/rustls-platform-verifier/Cargo.toml << 'PATCH_CARGO'
          [package]
          name = "rustls-platform-verifier"
          version = "0.5.3"
          edition = "2021"

          [dependencies]
          rustls = { version = "0.23", default-features = false, features = ["ring"] }
          webpki-roots = "0.26"
          PATCH_CARGO

              cat > patches/rustls-platform-verifier/src/lib.rs << 'PATCH_LIB'
          // Stub replacement for rustls-platform-verifier
          // Uses WebPKI with Mozilla's bundled root certificates
          // Avoids Android JNI dependency which fails on Termux

          use std::sync::Arc;
          use rustls::client::WebPkiServerVerifier;
          use rustls::RootCertStore;

          pub struct Verifier;

          impl Verifier {
              pub fn new(_crypto_provider: Arc<rustls::crypto::CryptoProvider>) -> Result<Self, rustls::Error> {
                  Ok(Self)
              }
              
              pub fn new_with_extra_roots(_crypto_provider: Arc<rustls::crypto::CryptoProvider>, _roots: RootCertStore) -> Result<Self, rustls::Error> {
                  Ok(Self)
              }
          }

          pub fn verifier_for_testing() -> Arc<dyn rustls::client::ServerCertVerifier> {
              let mut roots = RootCertStore::empty();
              roots.extend(webpki_roots::TLS_SERVER_ROOTS.iter().cloned());
              WebPkiServerVerifier::builder(Arc::new(roots))
                  .build()
                  .expect("Failed to build WebPkiServerVerifier")
          }
          PATCH_LIB

              echo "✅ Patch directory created successfully"
              echo "   📁 patches/rustls-platform-verifier/Cargo.toml"
              echo "   📁 patches/rustls-platform-verifier/src/lib.rs"
            else
              echo "✅ Patch directory already exists"
            fi
          else
            echo "INFO: No [patch.crates-io] in Cargo.toml, skipping patch creation"
          fi

      - name: Verify project structure
        run: |
          echo "=== Project Structure Verification ==="

          MISSING=0

          check_file() {
            if [ -f "$1" ]; then
              echo "PASS: $1"
            else
              echo "FAIL: $1 not found"
              MISSING=$((MISSING + 1))
            fi
          }

          check_dir() {
            if [ -d "$1" ]; then
              echo "PASS: $1/"
            else
              echo "FAIL: $1/ not found"
              MISSING=$((MISSING + 1))
            fi
          }

          check_file "Cargo.toml"
          check_dir "src"
          check_file "src/main.rs"

          if [ -d "static" ]; then
            echo "PASS: static/ (optional)"
            check_file "static/index.html"
          fi

          # ✅ التحقق من مجلد patches فقط إذا كان مطلوباً
          if grep -q "\[patch.crates-io\]" Cargo.toml 2>/dev/null; then
            echo "INFO: [patch.crates-io] found in Cargo.toml"
            check_dir "patches"
            if [ -d "patches/rustls-platform-verifier" ]; then
              check_file "patches/rustls-platform-verifier/Cargo.toml"
              check_file "patches/rustls-platform-verifier/src/lib.rs"
            fi
          fi

          echo "======================================="

          if [ $MISSING -gt 0 ]; then
            echo "ERROR: $MISSING required files/dirs missing"
            echo "Current directory structure:"
            find . -not -path '*/.git/*' -type f | sort | head -40
            exit 1
          fi

          echo "Project structure: OK"

          echo "=== Cargo.toml ==="
          cat Cargo.toml

      - name: Cache Android NDK
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: /opt/android-ndk-r26d
          key: android-ndk-r26d-v1

      - name: Download Android NDK r26d
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          echo "Downloading Android NDK r26d..."
          curl -fSL "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip" -o /tmp/ndk.zip
          echo "Extracting NDK..."
          unzip -q /tmp/ndk.zip -d /opt
          rm /tmp/ndk.zip
          echo "NDK ready"
          ls /opt/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin/ | head -10

      - name: Set NDK environment variables
        run: |
          NDK_HOME="/opt/android-ndk-r26d"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          CC="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang"
          CXX="$TOOLCHAIN/bin/armv7a-linux-androideabi21-clang++"
          AR="$TOOLCHAIN/bin/llvm-ar"
          RANLIB="$TOOLCHAIN/bin/llvm-ranlib"
          STRIP="$TOOLCHAIN/bin/llvm-strip"

          echo "NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "TOOLCHAIN=$TOOLCHAIN" >> $GITHUB_ENV
          echo "ANDROID_CC=$CC" >> $GITHUB_ENV
          echo "ANDROID_CXX=$CXX" >> $GITHUB_ENV
          echo "ANDROID_AR=$AR" >> $GITHUB_ENV
          echo "ANDROID_RANLIB=$RANLIB" >> $GITHUB_ENV
          echo "ANDROID_STRIP=$STRIP" >> $GITHUB_ENV

          echo "NDK paths set:"
          echo "CC  = $CC"
          echo "AR  = $AR"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-linux-androideabi

      - name: Configure Cargo linker
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << CARGO_CONFIG
          [target.armv7-linux-androideabi]
          linker = "$ANDROID_CC"
          ar = "$ANDROID_AR"
          CARGO_CONFIG

          echo "Cargo linker config:"
          cat .cargo/config.toml

      - name: Cache OpenSSL for Android ARM
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: /tmp/openssl-android-arm
          key: openssl-3.3.2-android-arm21-v1

      - name: Build OpenSSL static for Android ARM
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: |
          OPENSSL_VERSION="3.3.2"
          echo "Downloading OpenSSL $OPENSSL_VERSION..."
          curl -fSL "https://www.openssl.org/source/openssl-${OPENSSL_VERSION}.tar.gz" | tar xz -C /tmp
          cd /tmp/openssl-${OPENSSL_VERSION}

          export PATH="$TOOLCHAIN/bin:$PATH"
          export ANDROID_NDK_ROOT="$NDK_HOME"
          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"
          export AR="$ANDROID_AR"
          export RANLIB="$ANDROID_RANLIB"

          ./Configure android-arm \
            -D__ANDROID_API__=21 \
            --prefix=/tmp/openssl-android-arm \
            no-shared \
            no-tests \
            no-apps \
            no-engine \
            no-comp

          make -j$(nproc) 2>&1 | tail -5
          make install_sw

          echo "OpenSSL built:"
          ls /tmp/openssl-android-arm/lib/
          ls /tmp/openssl-android-arm/include/openssl/ | head -5

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-registry-v3-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-registry-v3-

      - name: Force clean ALL stale dependencies
        run: |
          echo "=== Force cleaning ALL stale TLS dependencies ==="
          find ~/.cargo/registry -name "*rustls-platform-verifier*" -exec rm -rf {} + 2>/dev/null || true
          find ~/.cargo/git -name "*rustls-platform-verifier*" -exec rm -rf {} + 2>/dev/null || true
          rm -rf target/armv7-linux-androideabi/release/.fingerprint/twilight-gateway-* 2>/dev/null || true
          rm -rf target/armv7-linux-androideabi/release/.fingerprint/rustls-* 2>/dev/null || true
          rm -rf target/armv7-linux-androideabi/release/.fingerprint/reqwest-* 2>/dev/null || true
          echo "✅ All stale dependencies cleaned"

      - name: Build binary
        run: |
          set -e

          export OPENSSL_STATIC=1
          export OPENSSL_DIR=/tmp/openssl-android-arm
          export OPENSSL_LIB_DIR=/tmp/openssl-android-arm/lib
          export OPENSSL_INCLUDE_DIR=/tmp/openssl-android-arm/include
          export OPENSSL_NO_VENDOR=0

          export CC="$ANDROID_CC"
          export CXX="$ANDROID_CXX"
          export AR="$ANDROID_AR"
          export RANLIB="$ANDROID_RANLIB"

          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$ANDROID_CC"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_AR="$ANDROID_AR"

          echo "=== Build Start ==="
          echo "Target  : armv7-linux-androideabi"
          echo "Toolchain: Rust stable + Android NDK r26d + OpenSSL Static"
          echo "==================="
          
          echo "=== Directory structure ==="
          find . -type f \( -name "*.toml" -o -name "*.rs" \) | grep -v target | sort

          cargo build --target armv7-linux-androideabi --release

          BINARY_NAME=$(grep '^name' Cargo.toml | head -1 | cut -d'"' -f2)

          if [ -z "$BINARY_NAME" ]; then
            echo "ERROR: Could not extract binary name from Cargo.toml"
            exit 1
          fi

          RAW_BINARY="target/armv7-linux-androideabi/release/${BINARY_NAME}"

          if [ ! -f "$RAW_BINARY" ]; then
            echo "ERROR: Binary not found at $RAW_BINARY"
            exit 1
          fi

          echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV
          echo "RAW_BINARY=${RAW_BINARY}" >> $GITHUB_ENV

      - name: Strip binary
        run: |
          "$ANDROID_STRIP" "$RAW_BINARY" && echo "Strip OK" || echo "Strip skipped"

      - name: Package binary and assets
        run: |
          set -e
          
          mkdir -p release_package
          cp "$RAW_BINARY" release_package/
          chmod +x "release_package/${BINARY_NAME}"

          python3 << 'PYTHON_SCRIPT'
          import os
          import shutil

          if not os.path.exists('file_list.txt'):
              print("No file_list.txt found, skipping assets copy.")
          else:
              with open('file_list.txt', 'r', encoding='utf-8') as f:
                  content = f.read()

              for line in content.strip().split('\n'):
                  if '":"' not in line:
                      continue
                  parts = line.split('":"', 1)
                  if len(parts) != 2:
                      continue
                  
                  file_path = parts[0].strip().strip('"').replace('\\\\', '/').replace('\\', '/')
                  
                  if file_path.startswith('src/') or file_path == 'Cargo.toml' or file_path == 'Cargo.lock':
                      continue
                      
                  if os.path.exists(file_path):
                      dest = os.path.join('release_package', file_path)
                      os.makedirs(os.path.dirname(dest), exist_ok=True)
                      shutil.copy2(file_path, dest)
                      print(f"Packaged: {file_path}")
          PYTHON_SCRIPT

          ARCHIVE_NAME="${BINARY_NAME}_termux_arm32.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C release_package .

          ABSOLUTE_ARCHIVE_PATH="$(pwd)/${ARCHIVE_NAME}"
          
          FILE_SIZE=$(stat -c%s "$ABSOLUTE_ARCHIVE_PATH")
          FILE_SIZE_MB=$(echo "scale=2; $FILE_SIZE / 1048576" | bc)
          
          echo "BINARY_PATH=${ABSOLUTE_ARCHIVE_PATH}" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV
          echo "FILE_SIZE_MB=${FILE_SIZE_MB}" >> $GITHUB_ENV
          
          echo "Archive created: $ARCHIVE_NAME ($FILE_SIZE_MB MB)"

      - name: Verify binary Termux compatibility
        run: |
          echo "========================================"
          echo "   ELF Verification Report (Termux Native)"
          echo "========================================"

          ELF_CLASS=$(readelf -h "$RAW_BINARY" | grep "Class:" | awk '{print $2}')
          ELF_TYPE=$(readelf -h "$RAW_BINARY" | grep "Type:" | awk '{print $2}')
          ELF_MACHINE=$(readelf -h "$RAW_BINARY" | grep "Machine:" | cut -d: -f2 | xargs)
          ELF_FLAGS=$(readelf -h "$RAW_BINARY" | grep "Flags:" | awk '{print $2}')
          ELF_ENTRY=$(readelf -h "$RAW_BINARY" | grep "Entry point" | awk '{print $NF}')
          INTERP=$(readelf -l "$RAW_BINARY" 2>/dev/null | grep "interpreter" | sed 's/.*\[\(.*\)\]/\1/' | head -1 || echo "static")

          echo "Class          : $ELF_CLASS"
          echo "Type           : $ELF_TYPE"
          echo "Machine        : $ELF_MACHINE"
          echo "Flags          : $ELF_FLAGS"
          echo "Entry Point    : $ELF_ENTRY"
          echo "Interpreter    : $INTERP"
          echo "File size      : $(du -sh $RAW_BINARY | cut -f1)"
          echo "file output    : $(file $RAW_BINARY)"
          echo "========================================"

          PASS=true

          if [[ "$ELF_CLASS" != "ELF32" ]]; then
            echo "FAIL: Expected ELF32, got $ELF_CLASS"
            PASS=false
          else
            echo "PASS: ELF32 confirmed (correct for ARM32)"
          fi

          if [[ "$ELF_MACHINE" != *"ARM"* ]]; then
            echo "FAIL: Expected ARM, got: $ELF_MACHINE"
            PASS=false
          else
            echo "PASS: ARM machine confirmed"
          fi

          if [[ "$INTERP" == *"/system/bin/linker"* ]]; then
            echo "PASS: Uses Android Bionic linker (ideal for Termux Native)"
          elif [[ "$INTERP" == "static" ]]; then
            echo "INFO: Static binary - no interpreter needed"
          else
            echo "WARNING: Interpreter: $INTERP (might not be native Android)"
          fi

          echo "Dynamic deps (must be minimal for Termux):"
          readelf -d "$RAW_BINARY" | grep NEEDED || echo "No dynamic deps (fully static except libc/libm/libdl)"

          echo "========================================"

          if [ "$PASS" = false ]; then
            echo "FINAL: VERIFICATION FAILED"
            echo "Full ELF header dump:"
            readelf -h "$RAW_BINARY"
            exit 1
          fi

          echo "FINAL: ALL CHECKS PASSED - Binary is Termux Native compatible"
          echo "========================================"

      - name: Install telegram
        run: npm install telegram

      - name: Send to Telegram via MTProto
        run: |
          node << 'NODE_SCRIPT'
          const { TelegramClient, Api } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs');

          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const archivePath = process.env.BINARY_PATH;
          const archiveName = process.env.ARCHIVE_NAME;
          const binaryName = process.env.BINARY_NAME;
          const fileSizeMB = process.env.FILE_SIZE_MB;

          if (!apiId || !apiHash || !botToken || !channelId) {
            console.error('Missing required secrets: TELEGRAM_API_ID, TELEGRAM_API_HASH, TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID');
            process.exit(1);
          }

          if (!fs.existsSync(archivePath)) {
            console.error('Archive not found at path:', archivePath);
            process.exit(1);
          }

          let uploadDone = false;

          (async () => {
            const client = new TelegramClient(new StringSession(''), apiId, apiHash, {
              connectionRetries: 5
            });

            await client.start({ botAuthToken: botToken });
            console.log('Connected to Telegram as bot');

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const finalFileName = `${archiveName}`;

            const caption = [
              `Build Successful (Termux Native - No proot needed)`,
              `Binary: ${binaryName}`,
              `Target: armv7-linux-androideabi (Android ARM32 Native)`,
              `Date: ${timestamp}`,
              `Size: ${fileSizeMB} MB`,
              `Built with: Android NDK r26d + Rust stable + OpenSSL Static`,
              ``,
              `Includes: Binary + .env + static/ (all assets)`,
              ``,
              `Installation on Termux (direct, no proot):`,
              `tar -xzf ${finalFileName}`,
              `chmod +x ${binaryName}`,
              `./${binaryName}`,
            ].join('\n');

            let entity = null;

            if (channelId.startsWith('@')) {
              console.log(`Using channel username: ${channelId}`);
              entity = channelId;
            } else {
              const cleanId = parseInt(channelId.replace(/^-100/, ''));
              console.log(`Resolving numeric channel ID: ${cleanId}`);

              try {
                const result = await client.invoke(
                  new Api.channels.GetChannels({
                    id: [new Api.InputChannel({
                      channelId: BigInt(cleanId),
                      accessHash: BigInt(0)
                    })]
                  })
                );

                if (result.chats && result.chats.length > 0) {
                  entity = result.chats[0];
                  console.log('Channel resolved:', entity.title);
                }
              } catch (err) {
                console.log('GetChannels failed:', err.errorMessage || err.message);
                console.log('Trying InputPeerChannel fallback...');

                entity = new Api.InputPeerChannel({
                  channelId: BigInt(cleanId),
                  accessHash: BigInt(0)
                });
              }
            }

            if (!entity) {
              console.error('Could not resolve channel entity');
              process.exit(1);
            }

            console.log('Uploading archive:', finalFileName, `(${fileSizeMB} MB)`);

            await client.sendFile(entity, {
              file: archivePath,
              caption: caption,
              forceDocument: true,
              fileName: finalFileName,
              workers: 4
            });

            uploadDone = true;
            console.log('Upload complete');

            setTimeout(async () => {
              try { await client.disconnect(); } catch (_) {}
              process.exit(0);
            }, 3000);

          })().catch(err => {
            const msg = err.errorMessage || err.message || String(err);
            if (uploadDone || msg === 'TIMEOUT') {
              console.log('Upload succeeded, ignoring background timeout');
              process.exit(0);
            }
            console.error('Telegram error:', msg);
            process.exit(1);
          });
          NODE_SCRIPT
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          BINARY_PATH: ${{ env.BINARY_PATH }}
          ARCHIVE_NAME: ${{ env.ARCHIVE_NAME }}
          BINARY_NAME: ${{ env.BINARY_NAME }}
          FILE_SIZE_MB: ${{ env.FILE_SIZE_MB }}

      - name: Cleanup
        if: always()
        run: |
          rm -f file_list.txt
          rm -rf .cargo
          echo "Cleanup complete"
