name: RDP_ULTRA_STATION_TELEGRAM

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Timezone
        run: |
          tzutil /s "Arabic Standard Time"
          Write-Host "Timezone set to UTC+3"

      - name: Install Node.js
        run: |
          choco install nodejs-lts -y --silent --no-progress
          echo "C:\Program Files\nodejs" >> $env:GITHUB_PATH

      - name: Setup RDP User
        shell: pwsh
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          $username = "${{ secrets.RDP_USERNAME }}"
          if ([string]::IsNullOrEmpty($password)) { $password = "admin@123" }
          if ([string]::IsNullOrEmpty($username)) { $username = "TOOLBOXLAP" }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          $dirs = @("C:\Users\Public\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop\Apps")
          foreach ($dir in $dirs) {
            if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }
          Write-Host "RDP user configured"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP enabled"

      - name: Install Node Packages (telegram + discord.js)
        run: |
          cd C:\Users\Public
          npm init -y
          npm install telegram discord.js

      - name: Create Backup Script
        shell: pwsh
        run: |
          $script = @'
          param([string]$ProjectDirectory = "C:\Users\Public\Desktop\Project")
          $global:Prefixes = @("rfcity","zyntra","lyntra","hyntra","qp")
          $global:DynamicPattern = "ynt"
          $global:ExcludeDirs = @(
              "node_modules","bower_components","vendor","jspm_packages",
              "dist","build",".build","out","output","target","bin","obj","Debug","Release",
              ".next",".nuxt",".svelte-kit",".turbo",".parcel-cache",".vite",".angular",
              ".cache","cache","__pycache__",
              ".venv","venv","env",".pytest_cache",".mypy_cache",".ruff_cache",".tox",".eggs",
              ".gradle",".m2",".git",".svn",".hg",".idea",".vs",
              ".terraform","coverage",".nyc_output","__MACOSX",".serverless","instances"
          )
          $global:ExcludeFiles = @(
              "*.log","*.tmp","*.temp","*.bak","*.cache","*.swp","*.swo","*~",
              "*.pdb","*.ilk","*.pyc","*.pyo","Thumbs.db",".DS_Store","desktop.ini"
          )
          $OutputDir = "$env:TEMP\backup_output"
          $TempDir = "$env:TEMP\backup_work"
          if (!(Test-Path $OutputDir)) { New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null }
          if (!(Test-Path $TempDir)) { New-Item -ItemType Directory -Path $TempDir -Force | Out-Null }

          function Get-FolderPrefix($Name) {
              foreach ($p in $global:Prefixes) { if ($Name -match "^$([regex]::Escape($p))-") { return $p } }
              if ($Name -match $global:DynamicPattern) { return ($Name -split '-')[0] }
              return "project"
          }
          function Get-UniqueZipName($prefix) {
              $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
              $uid = -join ((65..90 | Where-Object { [char]$_ -notin @('I','O') } | Get-Random -Count 6) | ForEach-Object { [char]$_ })
              return "$prefix-$stamp-$uid.zip"
          }

          $searchPaths = @(
              "$env:USERPROFILE\Downloads", "$env:USERPROFILE\Desktop",
              "$env:USERPROFILE\Projects", "$env:USERPROFILE\Documents\Projects",
              "$env:USERPROFILE\source\repos", "$env:USERPROFILE\OneDrive\Desktop",
              "C:\Users\Public\Desktop\Project", "C:\Users\Public\Desktop",
              "C:\Users\Public\Documents", "C:\Projects", "D:\Projects", "D:\", $ProjectDirectory
          ) | Where-Object { Test-Path $_ } | Select-Object -Unique

          $prefixPattern = '^(' + (($global:Prefixes | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')-'
          $folders = @()
          foreach ($sp in $searchPaths) {
              $found = Get-ChildItem -Path $sp -Directory -Force -ErrorAction SilentlyContinue |
                  Where-Object { ($_.Name -match $prefixPattern -or $_.Name -match $global:DynamicPattern) -and $_.Name -notlike '*-backup' }
              if ($found) { $folders += $found }
          }
          $folders = $folders | Sort-Object FullName | Get-Unique -AsString

          if ($folders.Count -eq 0) {
              Write-Host "[INFO] No folders to backup"
              @{ Success=$true; Files=@(); Count=0 } | ConvertTo-Json | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8
              exit 0
          }

          Write-Host "[FOLDERS] Found $($folders.Count) folders"
          $results = @()

          foreach ($folder in $folders) {
              $prefix = Get-FolderPrefix -Name $folder.Name
              $zipName = Get-UniqueZipName -prefix $prefix
              $zipPath = Join-Path $OutputDir $zipName
              try {
                  $workDir = Join-Path $TempDir "$prefix-$([guid]::NewGuid().ToString('N').Substring(0,8))"
                  New-Item -ItemType Directory -Path $workDir -Force | Out-Null
                  robocopy $folder.FullName $workDir /E /XD $global:ExcludeDirs /XF $global:ExcludeFiles /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
                  Compress-Archive -Path "$workDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
                  Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue
                  $zipSize = (Get-Item $zipPath).Length
                  Write-Host "  Created: $zipName ($([math]::Round($zipSize/1MB,2)) MB)"
                  $results += @{ Path=$zipPath; Name=$zipName; Size=$zipSize; Folder=$folder.Name }
              } catch {
                  Write-Host "  ERROR: $($_.Exception.Message)"
              }
          }

          @{ Success=$true; Files=$results; Count=$results.Count } | ConvertTo-Json -Depth 3 | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8 -Force
          Write-Host "BACKUP COMPLETE: $($results.Count) files"
          '@
          Set-Content -Path "C:\Users\Public\backup.ps1" -Value $script -Encoding UTF8 -Force
          Write-Host "Backup script created"

      - name: Create Telegram Upload Script
        shell: pwsh
        run: |
          $script = @'
          const { TelegramClient, Api } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs');
          const path = require('path');

          const apiId = parseInt(process.env.TELEGRAM_API_ID);
          const apiHash = process.env.TELEGRAM_API_HASH;
          const botToken = process.env.TELEGRAM_BOT_TOKEN;
          const channelId = process.env.TELEGRAM_CHANNEL_ID;
          const manifestPath = path.join(process.env.TEMP || process.env.TMP || 'C:\\Users\\Public\\AppData\\Local\\Temp', 'backup_output', 'backup_manifest.json');

          if (!apiId || !apiHash || !botToken || !channelId) {
            console.error('ERROR: Missing required Telegram secrets');
            process.exit(1);
          }

          if (!fs.existsSync(manifestPath)) {
            console.error('ERROR: Manifest not found at:', manifestPath);
            process.exit(1);
          }

          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          if (!manifest.Success || !manifest.Files || manifest.Files.length === 0) {
            console.log('No files to upload');
            process.exit(0);
          }

          console.log('Files to upload:', manifest.Count);
          manifest.Files.forEach(f => console.log('  ' + f.Name + ' - ' + Math.round(f.Size / 1048576) + ' MB'));

          let uploadDone = false;

          (async () => {
            const client = new TelegramClient(new StringSession(''), apiId, apiHash, { connectionRetries: 5 });
            await client.start({ botAuthToken: botToken });
            console.log('Connected to Telegram as bot');

            let entity = null;
            if (channelId.startsWith('@')) {
              entity = channelId;
            } else {
              const cleanId = parseInt(channelId.replace(/^-100/, ''));
              try {
                const result = await client.invoke(new Api.channels.GetChannels({
                  id: [new Api.InputChannel({ channelId: BigInt(cleanId), accessHash: BigInt(0) })]
                }));
                if (result.chats && result.chats.length > 0) { entity = result.chats[0]; }
              } catch (err) {
                entity = new Api.InputPeerChannel({ channelId: BigInt(cleanId), accessHash: BigInt(0) });
              }
            }

            if (!entity) { console.error('Could not resolve channel'); process.exit(1); }

            let success = 0, failed = 0;
            for (const file of manifest.Files) {
              if (!fs.existsSync(file.Path)) { console.error('File missing:', file.Path); failed++; continue; }
              try {
                const ts = new Date().toISOString().replace(/[:.]/g, '-');
                const caption = [
                  'Backup: ' + file.Folder,
                  'File: ' + file.Name,
                  'Size: ' + Math.round(file.Size / 1048576) + ' MB',
                  'Date: ' + ts,
                  '',
                  'Source: RDP_ULTRA_STATION',
                  'Status: Success'
                ].join('\n');
                await client.sendFile(entity, { file: file.Path, caption: caption, forceDocument: true, fileName: file.Name, workers: 4 });
                console.log('Uploaded:', file.Name);
                success++;
                try { fs.unlinkSync(file.Path); } catch (_) {}
              } catch (err) { console.error('Failed:', file.Name, err.errorMessage || err.message); failed++; }
            }

            uploadDone = true;
            console.log('UPLOAD SUMMARY: ' + success + ' success, ' + failed + ' failed');
            setTimeout(async () => { try { await client.disconnect(); } catch (_) {} process.exit(failed > 0 ? 1 : 0); }, 3000);
          })().catch(err => {
            const msg = err.errorMessage || err.message || String(err);
            if (uploadDone || msg === 'TIMEOUT') { process.exit(0); }
            console.error('Telegram error:', msg);
            process.exit(1);
          });
          '@
          Set-Content -Path "C:\Users\Public\upload.js" -Value $script -Encoding UTF8 -Force
          Write-Host "Upload script created"

      - name: Create Discord Bot Script
        shell: pwsh
        run: |
          $botDir = "C:\Users\Public\bot"
          if (!(Test-Path $botDir)) { New-Item -ItemType Directory -Path $botDir -Force | Out-Null }

          $packageJson = @'
          {
            "name": "rdp-backup-bot",
            "version": "1.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "discord.js": "^14.0.0",
              "telegram": "^2.0.0"
            }
          }
          '@
          Set-Content -Path "$botDir\package.json" -Value $packageJson -Encoding UTF8 -Force

          $botScript = @'
          const { Client, GatewayIntentBits, ActionRowBuilder, ButtonBuilder, ButtonStyle, EmbedBuilder } = require('discord.js');
          const { execSync, spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          const BOT_TOKEN = process.env.DISCORD_BOT_TOKEN;
          const CHANNEL_ID = process.env.DISCORD_CHANNEL_ID;
          const LOCK_FILE = 'C:\\session_active.lock';
          const BACKUP_SCRIPT = 'C:\\Users\\Public\\backup.ps1';
          const UPLOAD_SCRIPT = 'C:\\Users\\Public\\upload.js';

          if (!BOT_TOKEN || !CHANNEL_ID) {
            console.error('FATAL: DISCORD_BOT_TOKEN or DISCORD_CHANNEL_ID missing');
            process.exit(1);
          }

          // ═══════════════════════════════════════════
          // STATE MACHINE
          // ═══════════════════════════════════════════
          let state = 'IDLE'; // IDLE | COMPRESSING | UPLOADING | CANCELLING
          let currentProc = null;
          let currentPhase = 'IDLE';
          let saveCount = 0;
          let lastResult = 'None';
          let controlMessage = null;

          const client = new Client({
            intents: [
              GatewayIntentBits.Guilds,
              GatewayIntentBits.GuildMessages,
              GatewayIntentBits.MessageContent
            ]
          });

          // ═══════════════════════════════════════════
          // EMBED + BUTTONS BUILDER
          // ═══════════════════════════════════════════
          function buildEmbed() {
            const stateEmoji = { IDLE: '⏸️', COMPRESSING: '🗜️', UPLOADING: '☁️', CANCELLING: '🛑' };
            const stateLabel = { IDLE: 'Idle', COMPRESSING: 'Compressing...', UPLOADING: 'Uploading to Telegram...', CANCELLING: 'Cancelling...' };
            const colors = { IDLE: 0x99AAB5, COMPRESSING: 0xFFA500, UPLOADING: 0x3498DB, CANCELLING: 0xE74C3C };

            const embed = new EmbedBuilder()
              .setTitle('🖥️ RDP Backup Control')
              .setColor(colors[state] || 0x99AAB5)
              .addFields(
                { name: 'Status', value: (stateEmoji[state] || '⏸️') + ' ' + (stateLabel[state] || 'Idle'), inline: true },
                { name: 'Phase', value: currentPhase, inline: true },
                { name: 'Saves Completed', value: String(saveCount), inline: true },
                { name: 'Last Result', value: lastResult, inline: false }
              )
              .setTimestamp();
            return embed;
          }

          function buildButtons() {
            const row = new ActionRowBuilder().addComponents(
              new ButtonBuilder()
                .setCustomId('btn_save')
                .setLabel('Save')
                .setEmoji('💾')
                .setStyle(ButtonStyle.Primary)
                .setDisabled(state !== 'IDLE'),
              new ButtonBuilder()
                .setCustomId('btn_cancel')
                .setLabel('Cancel')
                .setEmoji('🛑')
                .setStyle(ButtonStyle.Danger)
                .setDisabled(state === 'IDLE' || state === 'CANCELLING'),
              new ButtonBuilder()
                .setCustomId('btn_status')
                .setLabel('Status')
                .setEmoji('📊')
                .setStyle(ButtonStyle.Secondary)
                .setDisabled(false)
            );
            return [row];
          }

          async function updatePanel() {
            if (!controlMessage) return;
            try {
              await controlMessage.edit({ embeds: [buildEmbed()], components: buildButtons() });
            } catch (_) {}
          }

          // ═══════════════════════════════════════════
          // KILL SWITCH — kills entire process tree
          // ═══════════════════════════════════════════
          function killProcessTree(pid) {
            try {
              execSync('taskkill /PID ' + pid + ' /T /F', { stdio: 'ignore' });
              console.log('Killed process tree PID:', pid);
            } catch (e) {
              console.log('taskkill failed (may already be dead):', e.message);
            }
          }

          function cleanupTempFiles() {
            try {
              const tempDir = process.env.TEMP || process.env.TMP || 'C:\\Users\\Public\\AppData\\Local\\Temp';
              const outputDir = path.join(tempDir, 'backup_output');
              const workDir = path.join(tempDir, 'backup_work');
              if (fs.existsSync(outputDir)) {
                fs.readdirSync(outputDir).forEach(f => {
                  try { fs.unlinkSync(path.join(outputDir, f)); } catch (_) {}
                });
              }
              if (fs.existsSync(workDir)) {
                fs.rmSync(workDir, { recursive: true, force: true });
              }
            } catch (_) {}
          }

          async function killAll() {
            if (state === 'IDLE') {
              lastResult = 'No operation running';
              await updatePanel();
              return;
            }
            if (state === 'CANCELLING') return;

            state = 'CANCELLING';
            await updatePanel();
            console.log('KILL ALL triggered — phase was:', currentPhase);

            if (currentProc && currentProc.pid) {
              killProcessTree(currentProc.pid);
            }

            // Safety: kill any orphaned robocopy or Compress-Archive child
            try { execSync('taskkill /IM robocopy.exe /F', { stdio: 'ignore' }); } catch (_) {}

            cleanupTempFiles();

            currentProc = null;
            currentPhase = 'IDLE';
            state = 'IDLE';
            lastResult = '🛑 Cancelled by user';
            await updatePanel();
            console.log('Kill complete — back to IDLE');
          }

          // ═══════════════════════════════════════════
          // BACKUP ENGINE
          // ═══════════════════════════════════════════
          function runBackup() {
            if (state !== 'IDLE') {
              console.log('Backup ignored — state is', state);
              return;
            }

            state = 'COMPRESSING';
            currentPhase = 'Compressing';
            updatePanel();
            console.log('Backup started — compressing...');

            const backupProc = spawn('pwsh', ['-ExecutionPolicy', 'Bypass', '-File', BACKUP_SCRIPT], {
              stdio: 'pipe',
              windowsHide: true
            });
            currentProc = backupProc;

            let backupOutput = '';
            backupProc.stdout.on('data', d => { backupOutput += d.toString(); });
            backupProc.stderr.on('data', d => { backupOutput += d.toString(); });

            const backupTimeout = setTimeout(() => {
              if (currentProc === backupProc && state === 'COMPRESSING') {
                console.log('Backup timeout — killing');
                killProcessTree(backupProc.pid);
                state = 'IDLE';
                currentPhase = 'IDLE';
                currentProc = null;
                lastResult = '❌ Backup timeout (10 min)';
                updatePanel();
              }
            }, 600000);

            backupProc.on('close', (code) => {
              clearTimeout(backupTimeout);
              if (state === 'CANCELLING') return;
              if (code !== 0) {
                state = 'IDLE';
                currentPhase = 'IDLE';
                currentProc = null;
                lastResult = '❌ Backup failed (exit ' + code + ')';
                updatePanel();
                console.log('Backup failed with code', code);
                return;
              }

              console.log('Backup done — starting upload...');
              state = 'UPLOADING';
              currentPhase = 'Uploading to Telegram';
              updatePanel();

              const uploadProc = spawn('node', [UPLOAD_SCRIPT], {
                stdio: 'pipe',
                windowsHide: true,
                env: { ...process.env }
              });
              currentProc = uploadProc;

              let uploadOutput = '';
              uploadProc.stdout.on('data', d => { uploadOutput += d.toString(); });
              uploadProc.stderr.on('data', d => { uploadOutput += d.toString(); });

              const uploadTimeout = setTimeout(() => {
                if (currentProc === uploadProc && state === 'UPLOADING') {
                  console.log('Upload timeout — killing');
                  killProcessTree(uploadProc.pid);
                  state = 'IDLE';
                  currentPhase = 'IDLE';
                  currentProc = null;
                  lastResult = '❌ Upload timeout (15 min)';
                  updatePanel();
                }
              }, 900000);

              uploadProc.on('close', (uCode) => {
                clearTimeout(uploadTimeout);
                if (state === 'CANCELLING') return;
                currentProc = null;
                currentPhase = 'IDLE';
                if (uCode === 0) {
                  saveCount++;
                  lastResult = '✅ Backup #' + saveCount + ' complete';
                  state = 'IDLE';
                  console.log('Upload success');
                } else {
                  lastResult = '❌ Upload failed (exit ' + uCode + ')';
                  state = 'IDLE';
                  console.log('Upload failed with code', uCode);
                }
                updatePanel();
              });

              uploadProc.on('error', (err) => {
                clearTimeout(uploadTimeout);
                if (state === 'CANCELLING') return;
                currentProc = null;
                currentPhase = 'IDLE';
                state = 'IDLE';
                lastResult = '❌ Upload error: ' + err.message;
                updatePanel();
              });
            });

            backupProc.on('error', (err) => {
              clearTimeout(backupTimeout);
              if (state === 'CANCELLING') return;
              currentProc = null;
              currentPhase = 'IDLE';
              state = 'IDLE';
              lastResult = '❌ Backup error: ' + err.message;
              updatePanel();
            });
          }

          // ═══════════════════════════════════════════
          // DISCORD EVENTS
          // ═══════════════════════════════════════════
          client.once('ready', async () => {
            console.log('Bot online as:', client.user.tag);
            try {
              const channel = await client.channels.fetch(CHANNEL_ID);
              if (!channel) { console.error('Channel not found:', CHANNEL_ID); process.exit(1); }
              controlMessage = await channel.send({ embeds: [buildEmbed()], components: buildButtons() });
              console.log('Control panel sent to channel');
            } catch (err) {
              console.error('Failed to send control panel:', err.message);
            }
          });

          // Button interactions
          client.on('interactionCreate', async (interaction) => {
            if (!interaction.isButton()) return;
            try { await interaction.deferUpdate(); } catch (_) {}

            switch (interaction.customId) {
              case 'btn_save':
                runBackup();
                break;
              case 'btn_cancel':
                await killAll();
                break;
              case 'btn_status':
                try {
                  await interaction.followUp({
                    content: 'State: ' + state + ' | Phase: ' + currentPhase + ' | Saves: ' + saveCount + ' | Last: ' + lastResult,
                    ephemeral: true
                  });
                } catch (_) {}
                break;
            }
          });

          // Text commands
          client.on('messageCreate', async (msg) => {
            if (msg.author.bot) return;
            if (msg.channelId !== CHANNEL_ID) return;

            const content = msg.content.trim().toLowerCase();

            if (content === '!' || content === '!c' || content === '!cancel') {
              await killAll();
              try { await msg.react('🛑'); } catch (_) {}
              return;
            }

            if (content === '!save' || content === '!start') {
              runBackup();
              try { await msg.react('💾'); } catch (_) {}
              return;
            }

            if (content === '!status') {
              try {
                await msg.reply({
                  content: 'State: ' + state + ' | Phase: ' + currentPhase + ' | Saves: ' + saveCount + ' | Last: ' + lastResult,
                  ephemeral: true
                });
              } catch (_) {}
              return;
            }
          });

          // ═══════════════════════════════════════════
          // ERROR HANDLING + GRACEFUL SHUTDOWN
          // ═══════════════════════════════════════════
          process.on('unhandledRejection', (err) => {
            console.error('Unhandled rejection:', err.message || err);
          });

          process.on('SIGTERM', () => {
            console.log('SIGTERM received — shutting down');
            if (currentProc && currentProc.pid) killProcessTree(currentProc.pid);
            client.destroy();
            process.exit(0);
          });

          process.on('SIGINT', () => {
            console.log('SIGINT received — shutting down');
            if (currentProc && currentProc.pid) killProcessTree(currentProc.pid);
            client.destroy();
            process.exit(0);
          });

          // ═══════════════════════════════════════════
          // SESSION WATCHDOG — exit when lock removed
          // ═══════════════════════════════════════════
          setInterval(() => {
            if (!fs.existsSync(LOCK_FILE)) {
              console.log('Session lock removed — bot shutting down');
              if (currentProc && currentProc.pid) killProcessTree(currentProc.pid);
              client.destroy();
              process.exit(0);
            }
          }, 5000);

          // ═══════════════════════════════════════════
          // START
          // ═══════════════════════════════════════════
          client.login(BOT_TOKEN).catch(err => {
            console.error('Login failed:', err.message);
            process.exit(1);
          });
          '@
          Set-Content -Path "$botDir\index.js" -Value $botScript -Encoding UTF8 -Force
          Write-Host "Discord bot script created"

      - name: Fetch Launcher from Secret
        shell: pwsh
        run: |
          $launcherUrl = "${{ secrets.LAUNCHER_RAW_URL }}"
          if ([string]::IsNullOrEmpty($launcherUrl)) {
              Write-Host "WARNING: LAUNCHER_RAW_URL secret not set, skipping"
              exit 0
          }
          try {
              $rawContent = (New-Object System.Net.WebClient).DownloadString($launcherUrl + "?t=" + (Get-Date).Ticks)
              $cleanContent = $rawContent -replace '(?m)^(\s*)//.*$', '$1'
              $cleanContent | Set-Content -Path "C:\Users\Public\Launcher.ps1" -Encoding UTF8 -NoNewline
              Write-Host "Launcher fetched successfully"
          } catch {
              Write-Host "WARNING: Failed to fetch launcher: $($_.Exception.Message)"
          }

      - name: Create Session Lock
        run: |
          New-Item -Path "C:\session_active.lock" -ItemType File -Force | Out-Null

      - name: Start Discord Bot + Wait for Session End
        shell: pwsh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          $botDir = "C:\Users\Public\bot"
          Write-Host "Starting Discord bot..."
          $botProc = Start-Process -FilePath "node" -ArgumentList "$botDir\index.js" -WorkingDirectory $botDir -NoNewWindow -PassThru
          Write-Host "Bot PID: $($botProc.Id)"
          Start-Sleep -Seconds 10

          if ($botProc.HasExited) {
              Write-Host "WARNING: Bot exited early with code $($botProc.ExitCode)"
              Write-Host "Running without Discord control — waiting for session end"
              while (Test-Path "C:\session_active.lock") { Start-Sleep -Seconds 30 }
          } else {
              Write-Host "Bot is running. Waiting for session to end..."
              while (Test-Path "C:\session_active.lock") {
                  Start-Sleep -Seconds 5
                  if ($botProc.HasExited) {
                      Write-Host "Bot died — restarting..."
                      $botProc = Start-Process -FilePath "node" -ArgumentList "$botDir\index.js" -WorkingDirectory $botDir -NoNewWindow -PassThru
                      Write-Host "Bot restarted PID: $($botProc.Id)"
                  }
              }
          }

          Write-Host "Session ended — stopping bot..."
          if (-not $botProc.HasExited) {
              try { taskkill /PID $($botProc.Id) /T /F 2>$null } catch {}
          }
          if (Test-Path "C:\session_active.lock") { Remove-Item "C:\session_active.lock" -Force }
          Write-Host "Bot stopped"

      - name: Final Forced Backup
        if: always()
        continue-on-error: true
        timeout-minutes: 28
        shell: pwsh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          $lockFile = "C:\session_active.lock"
          $tempDir = $env:TEMP
          $manifestPath = Join-Path $tempDir "backup_output\backup_manifest.json"

          Write-Host "=== FINAL FORCED BACKUP ==="

          # Clean any leftover temp files
          $workDir = Join-Path $tempDir "backup_work"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue }

          Write-Host "Running backup.ps1..."
          $bp = Start-Process -FilePath "pwsh" -ArgumentList "-ExecutionPolicy Bypass -File C:\Users\Public\backup.ps1" -NoNewWindow -PassThru -Wait
          Write-Host "Backup exit code: $($bp.ExitCode)"

          if (Test-Path $manifestPath) {
              $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
              if ($manifest.Count -gt 0) {
                  Write-Host "Uploading $($manifest.Count) files to Telegram..."
                  $up = Start-Process -FilePath "node" -ArgumentList "C:\Users\Public\upload.js" -NoNewWindow -PassThru -Wait
                  Write-Host "Upload exit code: $($up.ExitCode)"
                  if ($up.ExitCode -eq 0) {
                      Write-Host "FINAL BACKUP: SUCCESS"
                  } else {
                      Write-Host "FINAL BACKUP: UPLOAD FAILED"
                  }
              } else {
                  Write-Host "FINAL BACKUP: No files to upload"
              }
          } else {
              Write-Host "FINAL BACKUP: No manifest found"
          }

          if (Test-Path $lockFile) { Remove-Item $lockFile -Force -ErrorAction SilentlyContinue }
          Write-Host "=== WORKFLOW COMPLETE ==="
