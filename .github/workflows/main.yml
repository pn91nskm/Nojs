          } catch (_) {}
          }
          if (newIp) {
          tailscaleIp = newIp;
          lastResult = '✅ IP: ' + newIp;
          await sendConnectionMessage({ tailscaleIp: newIp, tailscaleStatus: 'Restarted', hostname: 'rdp-alkshwly-' + runNum });
