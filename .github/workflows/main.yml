name: RDP_ULTRA_STATION_TELEGRAM

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      RUN_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Node.js
        shell: pwsh
        run: |
          try {
              $nodeVer = (node --version 2>&1).Trim()
              $npmVer = (npm --version 2>&1).Trim()
              if ($nodeVer -match '^v\d') {
                  Write-Host "Node.js already installed: $nodeVer"
                  exit 0
              }
              throw "Node not responding"
          } catch {
              choco install nodejs-lts -y --silent --no-progress
              echo "C:\Program Files\nodejs" >> $env:GITHUB_PATH
          }

      - name: Setup RDP User (Sequential + Password in Message)
        shell: pwsh
        run: |
          $password = "admin@123"
          $runNum = $env:RUN_NUMBER
          if ([string]::IsNullOrEmpty($runNum)) { $runNum = "1" }
          $username = "TOOLBOXLAP"
          Write-Host "🎯 RDP Username: $username (run #$runNum)"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username -ErrorAction SilentlyContinue

          $dirs = @("C:\Users\Public\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop\Apps")
          foreach ($dir in $dirs) {
              if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Set Chrome as Official Default Browser
        shell: pwsh
        run: |
          $xmlPath = "C:\defaultapps.xml"
          $chromePath = "${env:ProgramFiles}\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chromePath)) { $chromePath = "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe" }

          try {
              if (!(Test-Path $chromePath)) { throw "Chrome غير مثبت" }
              $xmlContent = '<?xml version="1.0" encoding="UTF-8"?><DefaultAssociations><Association Identifier=".htm" ProgId="ChromeHTML" ApplicationName="Google Chrome" /><Association Identifier=".html" ProgId="ChromeHTML" ApplicationName="Google Chrome" /><Association Identifier="http" ProgId="ChromeHTML" ApplicationName="Google Chrome" /><Association Identifier="https" ProgId="ChromeHTML" ApplicationName="Google Chrome" /></DefaultAssociations>'
              $xmlContent | Set-Content -Path $xmlPath -Encoding UTF8 -Force
              Start-Process dism.exe -ArgumentList "/Online /Import-DefaultAppAssociations:$xmlPath" -Wait -NoNewWindow
          } catch {}
          if (Test-Path $xmlPath) { Remove-Item $xmlPath -Force }

      # ═══════════════════════════════════════════════════════════
      #  دفاع متعدد الطبقات: إجبار Google + تدمير Yahoo
      # ═══════════════════════════════════════════════════════════
      - name: Force Google & Destroy Yahoo (All Layers)
        shell: pwsh
        run: |
          Get-Process chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

          $pol = "HKLM:\Software\Policies\Google\Chrome"
          if (!(Test-Path $pol)) { New-Item -Path $pol -Force | Out-Null }

          # ── الطبقة 1: سياسات Chrome الكاملة (managed) + كلمات المرور ──
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEnabled"    -Value 1        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderName"       -Value "Google" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderKeyword"    -Value "google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL"  -Value "https://www.google.com/search?q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSuggestURL" -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderIconURL"    -Value "https://www.google.com/favicon.ico" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderNewTabURL"  -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEncodings"  -Value "UTF-8"  -Type String -Force

          Set-ItemProperty -Path $pol -Name "PasswordManagerEnabled"    -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "BrowserSignin"             -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "AutofillAddressEnabled"    -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "AutofillCreditCardEnabled" -Value 1 -Type DWord -Force

          Set-ItemProperty -Path $pol -Name "DeveloperToolsAvailability"  -Value 1 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "PromotionalTabsEnabled"       -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "WelcomePageOnOSUpgradeEnabled"-Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "BackgroundModeEnabled"        -Value 0 -Type DWord -Force
          Set-ItemProperty -Path $pol -Name "StartupBoostEnabled"          -Value 0 -Type DWord -Force
          Write-Host "✅ الطبقة 1: سياسات Chrome + Sync/كلمات المرور"

          # ── الطبقة 2: حظر جميع الإضافات + التثبيت الخارجي ──
          $blockPath = "$pol\ExtensionInstallBlocklist"
          if (!(Test-Path $blockPath)) { New-Item -Path $blockPath -Force | Out-Null }
          Set-ItemProperty -Path $blockPath -Name "1" -Value "*" -Type String -Force
          $typeBlock = "$pol\ExtensionInstallTypeBlocklist"
          if (!(Test-Path $typeBlock)) { New-Item -Path $typeBlock -Force | Out-Null }
          Set-ItemProperty -Path $typeBlock -Name "1" -Value "development" -Type String -Force
          Set-ItemProperty -Path $typeBlock -Name "2" -Value "sideload"    -Type String -Force
          Write-Host "✅ الطبقة 2: حظر جميع الإضافات + التثبيت الخارجي"

          # ── الطبقة 3: حذف Yahoo من كل مكان ──
          $yahooIds = @("cnmdgidklhhnmpphlfmmopmghfjhgkdi","nljkibfhlpcnanjgbnlnbjecgicbjkge","fpmeembnagmagppkgghhfjfdfajdfcah")
          Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $extDir = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data\Default\Extensions"
              if (Test-Path $extDir) {
                  foreach ($yid in $yahooIds) {
                      $p = Join-Path $extDir $yid
                      if (Test-Path $p) { Remove-Item $p -Recurse -Force -ErrorAction SilentlyContinue; Write-Host "  🗑️ extension $yid ($($_.Name))" }
                  }
              }
          }
          $uninstallKeys = @("HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*","HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*")
          foreach ($key in $uninstallKeys) {
              Get-ItemProperty $key -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*Yahoo*" } | ForEach-Object {
                  if ($_.UninstallString) {
                      $cmd = $_.UninstallString -replace '/I','/X'
                      Start-Process cmd -ArgumentList "/c `"$cmd`" /S /quiet /norestart" -Wait -NoNewWindow -ErrorAction SilentlyContinue
                  }
              }
          }
          @("HKLM:\SOFTWARE\Yahoo","HKCU:\SOFTWARE\Yahoo","HKLM:\SOFTWARE\WOW6432Node\Yahoo") | ForEach-Object {
              if (Test-Path $_) { Remove-Item $_ -Recurse -Force -ErrorAction SilentlyContinue }
          }
          Write-Host "✅ الطبقة 3: حذف Yahoo"

          # ── الطبقة 4: حذف Preferences + First Run لجميع المستخدمين ──
          Get-ChildItem "C:\Users" -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              $profileDir = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data\Default"
              if (Test-Path $profileDir) {
                  @("Preferences","Secure Preferences") | ForEach-Object {
                      $fp = Join-Path $profileDir $_
                      if (Test-Path $fp) { Remove-Item $fp -Force -ErrorAction SilentlyContinue }
                  }
              }
              $userData = Join-Path $_.FullName "AppData\Local\Google\Chrome\User Data"
              if (!(Test-Path $userData)) { New-Item -Path $userData -ItemType Directory -Force | Out-Null }
              "" | Set-Content (Join-Path $userData "First Run") -Force
          }
          Write-Host "✅ الطبقة 4: حذف Preferences + First Run"

          # ── الطبقة 5: حماية Registry بـ ACLs ──
          try {
              $regKey = [Microsoft.Win32.Registry]::LocalMachine.OpenSubKey("Software\Policies\Google\Chrome",[Microsoft.Win32.RegistryKeyPermissionCheck]::ReadWriteSubTree,[System.Security.AccessControl.RegistryRights]::ChangePermissions)
              $acl = $regKey.GetAccessControl()
              $usersRule = New-Object System.Security.AccessControl.RegistryAccessRule("BUILTIN\Users","ReadKey","ContainerInherit,ObjectInherit","None","Allow")
              $acl.AddAccessRule($usersRule)
              $regKey.SetAccessControl($acl); $regKey.Close()
              Write-Host "✅ الطبقة 5: حماية Registry بـ ACLs"
          } catch { Write-Host "⚠️ تعذر ضبط ACLs: $_" }

          # ── الطبقة 6: Watchdog — Scheduled Task كل 30 ثانية كـ SYSTEM ──
          $watchdogContent = @'
          $pol = "HKLM:\Software\Policies\Google\Chrome"
          $cur = Get-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL" -ErrorAction SilentlyContinue
          if ($cur.DefaultSearchProviderSearchURL -notlike "*google.com*") {
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEnabled"    -Value 1        -Type DWord  -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderName"       -Value "Google" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderKeyword"    -Value "google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSearchURL"  -Value "https://www.google.com/search?q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderSuggestURL" -Value "https://www.google.com/complete/search?client=chrome&q={searchTerms}" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderIconURL"    -Value "https://www.google.com/favicon.ico" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderNewTabURL"  -Value "https://www.google.com" -Type String -Force
          Set-ItemProperty -Path $pol -Name "DefaultSearchProviderEncodings"  -Value "UTF-8"  -Type String -Force
          }
          '@
          Set-Content -Path "C:\Users\Public\search_watchdog.ps1" -Value $watchdogContent -Encoding UTF8
          try {
              $pwshPath = "C:\Program Files\PowerShell\7\pwsh.exe"
              $action   = New-ScheduledTaskAction -Execute $pwshPath -Argument "-ExecutionPolicy Bypass -WindowStyle Hidden -File C:\Users\Public\search_watchdog.ps1"
              $trigger  = New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(5) -RepetitionInterval 00:00:30 -RepetitionDuration 06:00:00
              $settings = New-ScheduledTaskSettingsSet -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries -StartWhenAvailable
              Register-ScheduledTask -TaskName "GoogleSearchWatchdog" -Action $action -Trigger $trigger -Settings $settings -RunLevel Highest -User "SYSTEM" -Force | Out-Null
              Write-Host "✅ الطبقة 6: Watchdog مُسجّل (كل 30 ثانية كـ SYSTEM)"
          } catch { Write-Host "⚠️ تعذر تسجيل Watchdog: $_" }

          Write-Host "🛡️ اكتمل الدفاع متعدد الطبقات — Google مُجبر + كلمات المرور مفعّلة"

      - name: Install Tailscale
        run: |
          choco install tailscale -y --silent --no-progress
          echo "C:\Program Files\Tailscale" >> $env:GITHUB_PATH

      - name: Install Node Packages
        run: |
          cd C:\Users\Public
          npm init -y
          npm install telegram@2.26.22 discord.js@14.16.3

      - name: Create Backup Script
        shell: pwsh
        run: |
          $script = @'
          param([string]$ProjectDirectory = "C:\Users\Public\Desktop\Project")
          $global:Prefixes = @("rfcity","zyntra","lyntra","hyntra","qp")
          $global:DynamicPattern = "ynt"
          $global:ExcludeDirs = @("node_modules","bower_components","vendor","jspm_packages","dist","build",".build","out","output","target","bin","obj","Debug","Release",".next",".nuxt",".svelte-kit",".turbo",".parcel-cache",".vite",".angular",".cache","cache","__pycache__",".venv","venv","env",".pytest_cache",".mypy_cache",".ruff_cache",".tox",".eggs",".gradle",".m2",".git",".svn",".hg",".idea",".vs",".terraform","coverage",".nyc_output","__MACOSX",".serverless","instances")
          $global:ExcludeFiles = @("*.log","*.tmp","*.temp","*.bak","*.cache","*.swp","*.swo","*~","*.pdb","*.ilk","*.pyc","*.pyo","Thumbs.db",".DS_Store","desktop.ini")
          $OutputDir = "$env:TEMP\backup_output"
          $TempDir   = "$env:TEMP\backup_work"
          if (!(Test-Path $OutputDir)) { New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null }
          if (!(Test-Path $TempDir))   { New-Item -ItemType Directory -Path $TempDir   -Force | Out-Null }
          function Get-FolderPrefix($Name) {
          foreach ($p in $global:Prefixes) { if ($Name -match "^$([regex]::Escape($p))-") { return $p } }
          if ($Name -match $global:DynamicPattern) { return ($Name -split '-')[0] }
          return "project"
          }
          function Get-UniqueZipName($prefix) {
          $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $uid   = -join ((65..90 | Where-Object { [char]$_ -notin @('I','O') } | Get-Random -Count 6) | ForEach-Object { [char]$_ })
          return "$prefix-$stamp-$uid.zip"
          }
          $searchPaths = @("$env:USERPROFILE\Downloads","$env:USERPROFILE\Desktop","$env:USERPROFILE\Projects","$env:USERPROFILE\Documents\Projects","$env:USERPROFILE\source\repos","$env:USERPROFILE\OneDrive\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop","C:\Users\Public\Documents","C:\Projects","D:\Projects","D:\",$ProjectDirectory) | Where-Object { Test-Path $_ } | Select-Object -Unique
          $prefixPattern = '^(' + (($global:Prefixes | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')-'
          $folders = @()
          foreach ($sp in $searchPaths) {
          $found = Get-ChildItem -Path $sp -Directory -Force -ErrorAction SilentlyContinue | Where-Object { ($_.Name -match $prefixPattern -or $_.Name -match $global:DynamicPattern) -and $_.Name -notlike '*-backup' }
          if ($found) { $folders += $found }
          }
          $folders = $folders | Sort-Object FullName | Get-Unique -AsString
          if ($folders.Count -eq 0) {
          @{ Success=$true; Files=@(); Count=0 } | ConvertTo-Json | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8
          exit 0
          }
          $results = @()
          foreach ($folder in $folders) {
          $prefix = Get-FolderPrefix -Name $folder.Name
          $zipName = Get-UniqueZipName -prefix $prefix
          $zipPath = Join-Path $OutputDir $zipName
          try {
          $workDir = Join-Path $TempDir "$prefix-$([guid]::NewGuid().ToString('N').Substring(0,8))"
          New-Item -ItemType Directory -Path $workDir -Force | Out-Null
          robocopy $folder.FullName $workDir /E /XD $global:ExcludeDirs /XF $global:ExcludeFiles /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null
          Compress-Archive -Path "$workDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue
          $zipSize = (Get-Item $zipPath).Length
          $zipSizeMB = [math]::Round($zipSize / 1MB, 2)
          $results += @{ Path=$zipPath; Name=$zipName; Size=$zipSize; SizeMB=$zipSizeMB; Folder=$folder.Name }
          } catch {}
          }
          @{ Success=$true; Files=$results; Count=$results.Count } | ConvertTo-Json -Depth 3 | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8 -Force
          '@
          Set-Content -Path "C:\Users\Public\backup.ps1" -Value $script -Encoding UTF8 -Force

      - name: Create Discord Bot Script (v5.8 - Password + Unified Commands)
        shell: pwsh
        run: |
          $botDir = "C:\Users\Public\bot"
          if (!(Test-Path $botDir)) { New-Item -ItemType Directory -Path $botDir -Force | Out-Null }
          '{"name":"rdp-bot","version":"5.8.0","private":true,"main":"index.js","dependencies":{"discord.js":"^14.16.3","telegram":"^2.26.22"}}' | Set-Content "$botDir\package.json" -Encoding UTF8
          $botScript = @'
          /**
          * RDP Bot v5.8
          * - Password included in connection message
          * - Unified commands: work in BOTH Discord and Telegram
          * - Telegram inline buttons for interactive control
          * - Comprehensive error handling (no crashes)
          */
          const { Client, GatewayIntentBits, ActionRowBuilder, ButtonBuilder, ButtonStyle, EmbedBuilder } = require('discord.js');
          const { TelegramClient, Api } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const { execSync, spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');
          const BOT_TOKEN = process.env.DISCORD_BOT_TOKEN;
          const CHANNEL_ID = process.env.DISCORD_CHANNEL_ID;
          const WEBHOOK_URL = process.env.DISCORD_WEBHOOK_URL;
          const LOCK_FILE = 'C:\\session_active.lock';
          const BACKUP_SCRIPT = 'C:\\Users\\Public\\backup.ps1';
          const TG_SESSION_FILE = 'C:\\Users\\Public\\tg_session.dat';
          const TS_STATUS_FILE = 'C:\\Users\\Public\\tailscale_status.json';
          const TS_EXE = 'C:\\Program Files\\Tailscale\\tailscale.exe';
          const TELEGRAM_API_ID = parseInt(process.env.TELEGRAM_API_ID);
          const TELEGRAM_API_HASH = process.env.TELEGRAM_API_HASH;
          const TELEGRAM_BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const TELEGRAM_CHANNEL = process.env.TELEGRAM_CHANNEL_ID;
          const TAILSCALE_AUTHKEY = process.env.TAILSCALE_AUTHKEY;
          const WORKFLOW_START = Date.now();
          const WORKFLOW_TIMEOUT = 360 * 60 * 1000;
          const ALERT_THRESHOLDS = [10 * 60 * 1000, 5 * 60 * 1000, 1 * 60 * 1000];
          const firedAlerts = new Set();
          if (!BOT_TOKEN || !CHANNEL_ID) { console.error('FATAL: Missing DISCORD creds'); process.exit(1); }
          let state = 'IDLE', currentProc = null, currentPhase = 'IDLE', saveCount = 0, lastResult = 'None';
          let controlChannel = null, lastStatusMsg = null, logLines = [];
          let tgClient = null, tgEntity = null, tailscaleIp = 'N/A';
          let statusPending = false;
          let tgPanelMsg = null;
          const client = new Client({ intents: [GatewayIntentBits.Guilds, GatewayIntentBits.GuildMessages, GatewayIntentBits.MessageContent] });
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
          function maskSecrets(text) {
          return String(text)
          .replace(/--authkey=\S+/g, '--authkey=***')
          .replace(/tskey-[A-Za-z0-9\-]+/g, 'tskey-***')
          .replace(/API key \S+/g, 'API key ***')
          .replace(/ts[A-Za-z0-9_\-]{20,}/g, '***MASKED***');
          }
          function sendDiscordWebhook(content) {
          if (!WEBHOOK_URL) return Promise.resolve(false);
          return new Promise((resolve) => {
          try {
          const body = JSON.stringify({ content: content });
          const url = new URL(WEBHOOK_URL);
          const options = {
          hostname: url.hostname,
          path: url.pathname + url.search,
          method: 'POST',
          headers: {
          'Content-Type': 'application/json; charset=utf-8',
          'Content-Length': Buffer.byteLength(body, 'utf8')
          }
          };
          const proto = url.protocol === 'https:' ? https : http;
          const req = proto.request(options, (res) => {
          let data = '';
          res.on('data', c => data += c);
          res.on('end', () => {
          if (res.statusCode >= 200 && res.statusCode < 300) {
          console.log('[WH] Discord webhook sent');
          resolve(true);
          } else {
          console.error('[WH] Discord webhook failed: ' + res.statusCode);
          resolve(false);
          }
          });
          });
          req.on('error', e => { console.error('[WH] Error:', e.message); resolve(false); });
          req.write(body);
          req.end();
          } catch (e) {
          console.error('[WH] Exception:', e.message);
          resolve(false);
          }
          });
          }
          function getTailscaleStatus() {
          let fullJson = '', textStatus = '', ip = null, backendState = 'Unknown', authUrl = null;
          try {
          fullJson = execSync('"' + TS_EXE + '" status --json', { encoding: 'utf8', maxBuffer: 10 * 1024 * 1024 });
          const st = JSON.parse(fullJson);
          backendState = st.BackendState || 'Unknown';
          authUrl = st.AuthURL || null;
          if (st.Self && st.Self.TailscaleIPs && st.Self.TailscaleIPs.length > 0) {
          ip = st.Self.TailscaleIPs[0];
          }
          } catch (_) {}
          try {
          textStatus = execSync('"' + TS_EXE + '" status', { encoding: 'utf8' });
          } catch (_) { textStatus = ''; }
          return { fullJson, textStatus, ip, backendState, authUrl };
          }
          function captureTailscaleStatus() {
          const { fullJson } = getTailscaleStatus();
          if (fullJson) {
          try { fs.writeFileSync(TS_STATUS_FILE, fullJson.trim(), 'utf8'); return true; } catch (_) {}
          }
          return false;
          }
          async function sendStatusFileToBoth() {
          if (!fs.existsSync(TS_STATUS_FILE)) return;
          if (tgClient && tgEntity) {
          try {
          await tgClient.sendFile(tgEntity, { file: TS_STATUS_FILE, forceDocument: true, fileName: 'tailscale_status.json' });
          addLog('📎 JSON -> TG');
          } catch (_) { addLog('❌ JSON -> TG failed'); }
          }
          if (controlChannel) {
          try {
          await controlChannel.send({ files: [{ attachment: TS_STATUS_FILE, name: 'tailscale_status.json' }] });
          addLog('📎 JSON -> Discord');
          } catch (_) { addLog('❌ JSON -> Discord failed'); }
          }
          updatePanel();
          }
          async function initTelegramConnection() {
          const delays = [3000, 5000, 8000, 12000, 20000];
          for (let i = 0; i < 5; i++) {
          try {
          let sd = '';
          try { if (fs.existsSync(TG_SESSION_FILE)) sd = fs.readFileSync(TG_SESSION_FILE, 'utf8').trim(); } catch (_) {}
          const inst = new TelegramClient(new StringSession(sd), TELEGRAM_API_ID, TELEGRAM_API_HASH, { connectionRetries: 5 });
          await inst.start({ botAuthToken: TELEGRAM_BOT_TOKEN });
          try { const s = inst.session.save(); if (s && s.length > 10) fs.writeFileSync(TG_SESSION_FILE, s, 'utf8'); } catch (_) {}
          return inst;
          } catch (err) {
          console.error('[TG] Attempt ' + (i + 1) + ' failed:', err.errorMessage || err.message);
          if (i < 4) await sleep(delays[i]);
          }
          }
          return null;
          }
          async function resolveChannelEntity(inst) {
          if (!TELEGRAM_CHANNEL) return null;
          try { return await inst.getEntity(TELEGRAM_CHANNEL); } catch (_) {}
          if (/^\d+$/.test(TELEGRAM_CHANNEL)) {
          try { return await inst.getEntity('-100' + TELEGRAM_CHANNEL); } catch (_) {}
          }
          return null;
          }
          async function sendTelegramMsg(htmlText, maxRetries) {
          if (!tgClient || !tgEntity) return false;
          for (let i = 0; i < (maxRetries || 3); i++) {
          try {
          if (!tgClient.connected) await tgClient.connect();
          await tgClient.sendMessage(tgEntity, { message: htmlText, parseMode: 'html', linkPreview: false });
          return true;
          } catch (err) {
          const m = err.errorMessage || err.message || '';
          if (m.includes('FLOOD_WAIT')) {
          await sleep(parseInt((m.match(/\d+/) || ['30'])[0]) * 1000);
          continue;
          }
          if (i < 2) await sleep([2000, 4000][i] || 2000);
          }
          }
          return false;
          }
          // ============================================================
          // CONNECTION MESSAGE with PASSWORD
          // ============================================================
          async function sendConnectionMessage(sessionInfo) {
          const info = sessionInfo || {};
