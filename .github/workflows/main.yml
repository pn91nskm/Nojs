name: RDP_ULTRA_STATION_TELEGRAM

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Node.js
        shell: pwsh
        run: |
          try {
              $nodeVer = (node --version 2>&1).Trim()
              $npmVer = (npm --version 2>&1).Trim()
              if ($nodeVer -match '^v\d') {
                  Write-Host "Node.js already installed: $nodeVer"
                  Write-Host "npm already installed: $npmVer"
                  exit 0
              }
              throw "Node not responding"
          } catch {
              Write-Host "Node.js not found - installing via Chocolatey..."
              choco install nodejs-lts -y --silent --no-progress
              echo "C:\Program Files\nodejs" >> $env:GITHUB_PATH
          }

      - name: Setup RDP User
        shell: pwsh
        run: |
          $password = "${{ secrets.RDP_PASSWORD }}"
          $username = "${{ secrets.RDP_USERNAME }}"
          if ([string]::IsNullOrEmpty($password)) { $password = "admin@123" }
          if ([string]::IsNullOrEmpty($username)) { $username = "TOOLBOXLAP" }
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              New-LocalUser -Name $username -Password $securePass -AccountNeverExpires | Out-Null
          }
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          $dirs = @("C:\Users\Public\Desktop","C:\Users\Public\Desktop\Project","C:\Users\Public\Desktop\Apps")
          foreach ($dir in $dirs) {
            if (!(Test-Path $dir)) { New-Item -ItemType Directory -Path $dir -Force | Out-Null }
          }
          Write-Host "RDP user configured"

      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force
          Write-Host "RDP enabled"

      - name: Install Tailscale
        run: |
          choco install tailscale -y --silent --no-progress
          $tailscalePath = "C:\Program Files\Tailscale"
          echo "$tailscalePath" >> $env:GITHUB_PATH
          Write-Host "Tailscale installed"

      - name: Install Node Packages
        run: |
          cd C:\Users\Public
          npm init -y
          npm install telegram@2.26.22 discord.js@14.16.3
          Write-Host "Node packages installed"

      - name: Create Backup Script
        shell: pwsh
        run: |
          $script = @'
          param([string]$ProjectDirectory = "C:\Users\Public\Desktop\Project")

          $global:Prefixes = @("rfcity","zyntra","lyntra","hyntra","qp")
          $global:DynamicPattern = "ynt"
          $global:ExcludeDirs = @(
              "node_modules","bower_components","vendor","jspm_packages",
              "dist","build",".build","out","output","target","bin","obj","Debug","Release",
              ".next",".nuxt",".svelte-kit",".turbo",".parcel-cache",".vite",".angular",
              ".cache","cache","__pycache__",
              ".venv","venv","env",".pytest_cache",".mypy_cache",".ruff_cache",".tox",".eggs",
              ".gradle",".m2",".git",".svn",".hg",".idea",".vs",
              ".terraform","coverage",".nyc_output","__MACOSX",".serverless","instances"
          )
          $global:ExcludeFiles = @(
              "*.log","*.tmp","*.temp","*.bak","*.cache","*.swp","*.swo","*~",
              "*.pdb","*.ilk","*.pyc","*.pyo","Thumbs.db",".DS_Store","desktop.ini"
          )

          $OutputDir = "$env:TEMP\backup_output"
          $TempDir   = "$env:TEMP\backup_work"
          if (!(Test-Path $OutputDir)) { New-Item -ItemType Directory -Path $OutputDir -Force | Out-Null }
          if (!(Test-Path $TempDir))   { New-Item -ItemType Directory -Path $TempDir   -Force | Out-Null }

          function Get-FolderPrefix($Name) {
              foreach ($p in $global:Prefixes) { if ($Name -match "^$([regex]::Escape($p))-") { return $p } }
              if ($Name -match $global:DynamicPattern) { return ($Name -split '-')[0] }
              return "project"
          }

          function Get-UniqueZipName($prefix) {
              $stamp = Get-Date -Format "yyyyMMdd-HHmmss"
              $uid   = -join ((65..90 | Where-Object { [char]$_ -notin @('I','O') } | Get-Random -Count 6) | ForEach-Object { [char]$_ })
              return "$prefix-$stamp-$uid.zip"
          }

          $searchPaths = @(
              "$env:USERPROFILE\Downloads",
              "$env:USERPROFILE\Desktop",
              "$env:USERPROFILE\Projects",
              "$env:USERPROFILE\Documents\Projects",
              "$env:USERPROFILE\source\repos",
              "$env:USERPROFILE\OneDrive\Desktop",
              "C:\Users\Public\Desktop\Project",
              "C:\Users\Public\Desktop",
              "C:\Users\Public\Documents",
              "C:\Projects",
              "D:\Projects",
              "D:\",
              $ProjectDirectory
          ) | Where-Object { Test-Path $_ } | Select-Object -Unique

          Write-Host "[BACKUP] Searching in: $($searchPaths -join ', ')"

          $prefixPattern = '^(' + (($global:Prefixes | ForEach-Object { [regex]::Escape($_) }) -join '|') + ')-'
          $folders = @()
          foreach ($sp in $searchPaths) {
              $found = Get-ChildItem -Path $sp -Directory -Force -ErrorAction SilentlyContinue |
                  Where-Object { ($_.Name -match $prefixPattern -or $_.Name -match $global:DynamicPattern) -and $_.Name -notlike '*-backup' }
              if ($found) { $folders += $found }
          }
          $folders = $folders | Sort-Object FullName | Get-Unique -AsString

          if ($folders.Count -eq 0) {
              Write-Host "[BACKUP] No matching folders found."
              Write-Host "[BACKUP] Expected patterns: $($global:Prefixes -join ', ')-* or folders containing '$($global:DynamicPattern)'"
              @{ Success=$true; Files=@(); Count=0; Message="No folders found matching patterns: $($global:Prefixes -join ', ')-* or containing '$($global:DynamicPattern)'" } |
                  ConvertTo-Json | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8
              exit 0
          }

          Write-Host "[BACKUP] Found $($folders.Count) folder(s):"
          $folders | ForEach-Object { Write-Host "  - $($_.Name) ($($_.FullName))" }

          $results = @()
          foreach ($folder in $folders) {
              $prefix  = Get-FolderPrefix -Name $folder.Name
              $zipName = Get-UniqueZipName -prefix $prefix
              $zipPath = Join-Path $OutputDir $zipName

              Write-Host "[BACKUP] Processing: $($folder.Name)"
              Write-Host "  Prefix   : $prefix"
              Write-Host "  Zip name : $zipName"

              try {
                  $workDir = Join-Path $TempDir "$prefix-$([guid]::NewGuid().ToString('N').Substring(0,8))"
                  New-Item -ItemType Directory -Path $workDir -Force | Out-Null

                  Write-Host "  Copying with exclusions (robocopy)..."
                  Write-Host "  Excluded dirs : $($global:ExcludeDirs -join ', ')"
                  Write-Host "  Excluded files: $($global:ExcludeFiles -join ', ')"
                  robocopy $folder.FullName $workDir /E /XD $global:ExcludeDirs /XF $global:ExcludeFiles /R:1 /W:1 /NFL /NDL /NJH /NJS | Out-Null

                  $fileCount = (Get-ChildItem $workDir -Recurse -File -ErrorAction SilentlyContinue).Count
                  Write-Host "  Files copied : $fileCount"

                  Write-Host "  Compressing..."
                  Compress-Archive -Path "$workDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
                  Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue

                  $zipSize   = (Get-Item $zipPath).Length
                  $zipSizeMB = [math]::Round($zipSize / 1MB, 2)
                  Write-Host "  Created: $zipName ($zipSizeMB MB)"

                  $results += @{ Path=$zipPath; Name=$zipName; Size=$zipSize; SizeMB=$zipSizeMB; Folder=$folder.Name }
              } catch {
                  Write-Host "  ERROR: $($_.Exception.Message)"
              }
          }

          @{ Success=$true; Files=$results; Count=$results.Count; Message="$($results.Count) file(s) ready for upload" } |
              ConvertTo-Json -Depth 3 | Out-File "$OutputDir\backup_manifest.json" -Encoding UTF8 -Force

          Write-Host "[BACKUP] COMPLETE: $($results.Count) zip(s) created"
          '@
          Set-Content -Path "C:\Users\Public\backup.ps1" -Value $script -Encoding UTF8 -Force
          Write-Host "Backup script created"

      - name: Create Unified MTProto Notifier
        shell: pwsh
        run: |
          $notifierScript = @'
          /**
           * notifier.js - Unified MTProto Notification Service
           * Uses GramJS (MTProto 2.0) for direct Telegram DC connection
           * Replaces all curl/Bot API calls with a single reliable connection
           */
          const { TelegramClient } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const fs = require('fs');
          const path = require('path');

          const SESSION_FILE = 'C:\\Users\\Public\\tg_session.dat';
          const MAX_RETRIES  = 3;
          const DELAYS       = [2000, 4000, 8000];

          function loadSession() {
            try {
              if (fs.existsSync(SESSION_FILE)) {
                const data = fs.readFileSync(SESSION_FILE, 'utf8').trim();
                if (data && data.length > 10) return data;
              }
            } catch (_) {}
            return '';
          }

          function saveSession(sessionString) {
            try {
              if (sessionString && sessionString.length > 10) {
                fs.writeFileSync(SESSION_FILE, sessionString, 'utf8');
              }
            } catch (_) {}
          }

          async function createClient() {
            const apiId     = parseInt(process.env.TELEGRAM_API_ID);
            const apiHash   = process.env.TELEGRAM_API_HASH;
            const botToken  = process.env.TELEGRAM_BOT_TOKEN;

            if (!apiId || !apiHash || !botToken) {
              console.error('[TG-NOTIFY] Missing TELEGRAM_API_ID, TELEGRAM_API_HASH, or TELEGRAM_BOT_TOKEN');
              process.exit(1);
            }

            const session = new StringSession(loadSession());
            const client = new TelegramClient(session, apiId, apiHash, {
              connectionRetries: 5,
              deviceModel: 'RDP-ULTRA-STATION',
              systemVersion: '1.0',
              appVersion: '2.0.0'
            });

            await client.start({ botAuthToken: botToken });
            saveSession(client.session.save());
            console.log('[TG-NOTIFY] MTProto connection established');
            return client;
          }

          async function resolveEntity(client, channelId) {
            if (!channelId) {
              throw new Error('TELEGRAM_CHANNEL_ID is empty');
            }

            // Attempt 1: Direct resolution (handles @username and -100...)
            try {
              const entity = await client.getEntity(channelId);
              console.log('[TG-NOTIFY] Entity resolved directly:', entity.title || channelId);
              return entity;
            } catch (err) {
              console.log('[TG-NOTIFY] Direct resolution failed:', err.errorMessage || err.message);
            }

            // Attempt 2: If pure numeric, add -100 prefix
            if (/^\d+$/.test(channelId)) {
              try {
                const entity = await client.getEntity('-100' + channelId);
                console.log('[TG-NOTIFY] Entity resolved with -100 prefix');
                return entity;
              } catch (err) {
                console.log('[TG-NOTIFY] -100 prefix resolution failed:', err.errorMessage || err.message);
              }
            }

            // Attempt 3: If starts with -100, try removing and re-adding
            if (channelId.startsWith('-100')) {
              try {
                const entity = await client.getEntity(channelId);
                return entity;
              } catch (_) {}
            }

            throw new Error('Could not resolve Telegram entity: ' + channelId);
          }

          async function sendMessageWithRetry(client, entity, htmlText, maxRetries) {
            const retries = maxRetries || MAX_RETRIES;
            for (let i = 0; i < retries; i++) {
              try {
                await client.sendMessage(entity, {
                  message: htmlText,
                  parseMode: 'html',
                  linkPreview: false
                });
                console.log('[TG-NOTIFY] Message sent successfully (attempt ' + (i + 1) + ')');
                return true;
              } catch (err) {
                const errMsg = err.errorMessage || err.message || String(err);
                console.error('[TG-NOTIFY] Attempt ' + (i + 1) + ' failed:', errMsg);

                // Handle FLOOD_WAIT (rate limiting)
                if (errMsg.includes('FLOOD_WAIT')) {
                  const waitMatch = errMsg.match(/(\d+)/);
                  const waitSec = waitMatch ? parseInt(waitMatch[1]) : 30;
                  console.log('[TG-NOTIFY] FLOOD_WAIT - waiting ' + waitSec + 's');
                  await new Promise(function(r) { setTimeout(r, waitSec * 1000); });
                  continue;
                }

                // Handle CHANNEL_INVALID (re-resolve entity)
                if (errMsg.includes('CHANNEL_INVALID') || errMsg.includes('PEER_ID_INVALID')) {
                  console.log('[TG-NOTIFY] Channel invalid - will retry with fresh resolution');
                }

                if (i < retries - 1) {
                  console.log('[TG-NOTIFY] Waiting ' + DELAYS[i] + 'ms before retry...');
                  await new Promise(function(r) { setTimeout(r, DELAYS[i]); });
                }
              }
            }
            return false;
          }

          async function main() {
            const args = process.argv.slice(2);
            const msgIdx = args.indexOf('--message');
            const fileIdx = args.indexOf('--file');
            const captionIdx = args.indexOf('--caption');

            const message = msgIdx !== -1 ? args[msgIdx + 1] : null;
            const filePath = fileIdx !== -1 ? args[fileIdx + 1] : null;
            const caption = captionIdx !== -1 ? args[captionIdx + 1] : '';
            const channelId = process.env.TELEGRAM_CHANNEL_ID;

            if (!message && !filePath) {
              console.error('[TG-NOTIFY] Usage: node notifier.js --message "text" OR --file "path" --caption "text"');
              process.exit(1);
            }

            if (!channelId) {
              console.error('[TG-NOTIFY] TELEGRAM_CHANNEL_ID not set');
              process.exit(1);
            }

            let client = null;
            try {
              client = await createClient();
              const entity = await resolveEntity(client, channelId);

              if (message) {
                const success = await sendMessageWithRetry(client, entity, message);
                if (!success) {
                  console.error('[TG-NOTIFY] Failed to send message after ' + MAX_RETRIES + ' attempts');
                  process.exit(1);
                }
              }

              if (filePath && fs.existsSync(filePath)) {
                const fileName = path.basename(filePath);
                console.log('[TG-NOTIFY] Uploading file:', fileName);
                let uploaded = false;
                for (let i = 0; i < MAX_RETRIES; i++) {
                  try {
                    await client.sendFile(entity, {
                      file: filePath,
                      caption: caption || fileName,
                      forceDocument: true,
                      fileName: fileName,
                      workers: 4,
                      parseMode: 'html'
                    });
                    console.log('[TG-NOTIFY] File uploaded:', fileName);
                    uploaded = true;
                    break;
                  } catch (err) {
                    const errMsg = err.errorMessage || err.message || '';
                    console.error('[TG-NOTIFY] File upload attempt ' + (i + 1) + ' failed:', errMsg);
                    if (errMsg.includes('FLOOD_WAIT')) {
                      const waitMatch = errMsg.match(/(\d+)/);
                      const waitSec = waitMatch ? parseInt(waitMatch[1]) : 30;
                      await new Promise(function(r) { setTimeout(r, waitSec * 1000); });
                    } else if (i < MAX_RETRIES - 1) {
                      await new Promise(function(r) { setTimeout(r, DELAYS[i]); });
                    }
                  }
                }
                if (!uploaded) {
                  console.error('[TG-NOTIFY] File upload failed after retries');
                  process.exit(1);
                }
              }

              console.log('[TG-NOTIFY] All operations completed successfully');
              process.exit(0);
            } catch (err) {
              console.error('[TG-NOTIFY] Fatal error:', err.errorMessage || err.message || err);
              process.exit(1);
            } finally {
              if (client) {
                try { await client.disconnect(); } catch (_) {}
              }
            }
          }

          main();
          '@
          Set-Content -Path "C:\Users\Public\notifier.js" -Value $notifierScript -Encoding UTF8 -Force
          Write-Host "Unified MTProto notifier created"

      - name: Create Discord Bot Script (MTProto Unified)
        shell: pwsh
        run: |
          $botDir = "C:\Users\Public\bot"
          if (!(Test-Path $botDir)) { New-Item -ItemType Directory -Path $botDir -Force | Out-Null }
          $packageJson = @'
          {
            "name": "rdp-backup-bot",
            "version": "3.0.0",
            "private": true,
            "main": "index.js",
            "dependencies": {
              "discord.js": "^14.16.3",
              "telegram": "^2.26.22"
            }
          }
          '@
          Set-Content -Path "$botDir\package.json" -Value $packageJson -Encoding UTF8 -Force
          $botScript = @'
          /**
           * RDP Ultra Station Bot v3.0
           * - Discord: Interactive control panel (buttons, commands, live status)
           * - Telegram: MTProto notifications + file uploads via shared notifier
           * - Features: Tailscale restart, retry logic, timeout alerts
           */
          const { Client, GatewayIntentBits, ActionRowBuilder, ButtonBuilder, ButtonStyle, EmbedBuilder } = require('discord.js');
          const { TelegramClient } = require('telegram');
          const { StringSession } = require('telegram/sessions');
          const { execSync, spawn } = require('child_process');
          const fs = require('fs');
          const path = require('path');

          // ====== Configuration ======
          const BOT_TOKEN          = process.env.DISCORD_BOT_TOKEN;
          const CHANNEL_ID         = process.env.DISCORD_CHANNEL_ID;
          const LOCK_FILE          = 'C:\\session_active.lock';
          const BACKUP_SCRIPT      = 'C:\\Users\\Public\\backup.ps1';
          const NOTIFIER_SCRIPT    = 'C:\\Users\\Public\\notifier.js';
          const SESSION_FILE       = 'C:\\Users\\Public\\tg_session.dat';
          const TELEGRAM_API_ID    = parseInt(process.env.TELEGRAM_API_ID);
          const TELEGRAM_API_HASH  = process.env.TELEGRAM_API_HASH;
          const TELEGRAM_BOT_TOKEN = process.env.TELEGRAM_BOT_TOKEN;
          const TELEGRAM_CHANNEL   = process.env.TELEGRAM_CHANNEL_ID;
          const TAILSCALE_AUTHKEY  = process.env.TAILSCALE_AUTHKEY;

          // ====== Timeout Alert System (Suggestion #5) ======
          const WORKFLOW_START   = Date.now();
          const WORKFLOW_TIMEOUT = 360 * 60 * 1000;
          const ALERT_THRESHOLDS = [10 * 60 * 1000, 5 * 60 * 1000, 1 * 60 * 1000];
          const firedAlerts      = new Set();

          if (!BOT_TOKEN || !CHANNEL_ID) {
            console.error('FATAL: DISCORD_BOT_TOKEN or DISCORD_CHANNEL_ID missing');
            process.exit(1);
          }

          // ====== State Management ======
          let state          = 'IDLE';
          let currentProc    = null;
          let currentPhase   = 'IDLE';
          let saveCount      = 0;
          let lastResult     = 'None';
          let controlMessage = null;
          let logLines       = [];
          let tgClient       = null;
          let tgEntity       = null;
          let tailscaleIp    = 'N/A';

          const client = new Client({
            intents: [
              GatewayIntentBits.Guilds,
              GatewayIntentBits.GuildMessages,
              GatewayIntentBits.MessageContent
            ]
          });

          // ====== MTProto Connection (Shared) ======
          async function initTelegram() {
            if (!TELEGRAM_API_ID || !TELEGRAM_API_HASH || !TELEGRAM_BOT_TOKEN || !TELEGRAM_CHANNEL) {
              console.log('[TG] Telegram credentials incomplete - notifications disabled');
              return;
            }
            try {
              let sessionData = '';
              try {
                if (fs.existsSync(SESSION_FILE)) {
                  sessionData = fs.readFileSync(SESSION_FILE, 'utf8').trim();
                }
              } catch (_) {}

              tgClient = new TelegramClient(
                new StringSession(sessionData),
                TELEGRAM_API_ID,
                TELEGRAM_API_HASH,
                { connectionRetries: 5, deviceModel: 'RDP-ULTRA-STATION' }
              );
              await tgClient.start({ botAuthToken: TELEGRAM_BOT_TOKEN });

              try {
                fs.writeFileSync(SESSION_FILE, tgClient.session.save(), 'utf8');
              } catch (_) {}

              // Resolve entity with fallbacks
              try {
                tgEntity = await tgClient.getEntity(TELEGRAM_CHANNEL);
              } catch (_) {
                if (/^\d+$/.test(TELEGRAM_CHANNEL)) {
                  tgEntity = await tgClient.getEntity('-100' + TELEGRAM_CHANNEL);
                } else {
                  throw new Error('Entity resolution failed');
                }
              }

              console.log('[TG] MTProto connected - entity resolved');
            } catch (err) {
              console.error('[TG] Init failed:', err.errorMessage || err.message);
              tgClient = null;
              tgEntity = null;
            }
          }

          // ====== Send Telegram Message with Retry (Suggestion #4) ======
          async function sendTelegramMsg(htmlText, maxRetries) {
            if (!tgClient || !tgEntity) return false;
            const retries = maxRetries || 3;
            const delays = [2000, 4000, 8000];
            for (let i = 0; i < retries; i++) {
              try {
                await tgClient.sendMessage(tgEntity, {
                  message: htmlText,
                  parseMode: 'html',
                  linkPreview: false
                });
                return true;
              } catch (err) {
                const msg = err.errorMessage || err.message || '';
                console.error('[TG] Send attempt ' + (i + 1) + ' failed:', msg);
                if (msg.includes('FLOOD_WAIT')) {
                  const wait = parseInt((msg.match(/\d+/) || ['30'])[0]);
                  await new Promise(function(r) { setTimeout(r, wait * 1000); });
                  continue;
                }
                if (i < retries - 1) {
                  await new Promise(function(r) { setTimeout(r, delays[i]); });
                }
              }
            }
            return false;
          }

          // ====== Notify All Services (Discord + Telegram) ======
          async function notifyAll(text, discordContent) {
            await sendTelegramMsg(text);
            if (controlMessage && controlMessage.channel) {
              try {
                await controlMessage.channel.send(discordContent || text.replace(/<[^>]*>/g, ''));
              } catch (_) {}
            }
          }

          // ====== Logging ======
          function addLog(line) {
            const ts = new Date().toLocaleTimeString();
            logLines.push('`' + ts + '` ' + line);
            if (logLines.length > 8) logLines = logLines.slice(-8);
          }

          // ====== Embed Builder ======
          function buildEmbed() {
            const stateEmoji = { IDLE: '⏸️', COMPRESSING: '🗜️', UPLOADING: '☁️', CANCELLING: '🛑', RESTARTING: '🔄' };
            const stateLabel = { IDLE: 'Idle', COMPRESSING: 'Compressing...', UPLOADING: 'Uploading...', CANCELLING: 'Cancelling...', RESTARTING: 'Restarting Tailscale...' };
            const colors     = { IDLE: 0x99AAB5, COMPRESSING: 0xFFA500, UPLOADING: 0x3498DB, CANCELLING: 0xE74C3C, RESTARTING: 0x9B59B6 };
            const logText    = logLines.length > 0 ? logLines.join('\n') : '_No activity yet_';
            const elapsed    = Math.floor((Date.now() - WORKFLOW_START) / 60000);
            const remaining  = Math.max(0, 360 - elapsed);

            return new EmbedBuilder()
              .setTitle('🖥️ RDP Ultra Station Control')
              .setColor(colors[state] || 0x99AAB5)
              .addFields(
                { name: 'Status',          value: (stateEmoji[state] || '⏸️') + ' ' + (stateLabel[state] || 'Idle'), inline: true },
                { name: 'Phase',           value: currentPhase, inline: true },
                { name: 'Saves',           value: String(saveCount), inline: true },
                { name: 'Remaining',       value: remaining + ' min', inline: true },
                { name: 'Tailscale IP',    value: '`' + tailscaleIp + '`', inline: true },
                { name: 'Last Result',     value: lastResult, inline: false },
                { name: 'Activity Log',    value: logText, inline: false }
              )
              .setTimestamp();
          }

          function buildButtons() {
            return [new ActionRowBuilder().addComponents(
              new ButtonBuilder().setCustomId('btn_save').setLabel('Save').setEmoji('💾').setStyle(ButtonStyle.Primary).setDisabled(state !== 'IDLE'),
              new ButtonBuilder().setCustomId('btn_cancel').setLabel('Cancel').setEmoji('🛑').setStyle(ButtonStyle.Danger).setDisabled(state === 'IDLE' || state === 'CANCELLING'),
              new ButtonBuilder().setCustomId('btn_restart_ts').setLabel('Restart Tailscale').setEmoji('🔄').setStyle(ButtonStyle.Secondary).setDisabled(state !== 'IDLE'),
              new ButtonBuilder().setCustomId('btn_status').setLabel('Status').setEmoji('📊').setStyle(ButtonStyle.Secondary).setDisabled(false)
            )];
          }

          async function updatePanel() {
            if (!controlMessage) return;
            try {
              await controlMessage.edit({ embeds: [buildEmbed()], components: buildButtons() });
            } catch (_) {}
          }

          // ====== Process Management ======
          function killProcessTree(pid) {
            try { execSync('taskkill /PID ' + pid + ' /T /F', { stdio: 'ignore' }); } catch (_) {}
          }

          function cleanupTempFiles() {
            try {
              const tempDir   = process.env.TEMP || process.env.TMP;
              const outputDir = path.join(tempDir, 'backup_output');
              const workDir   = path.join(tempDir, 'backup_work');
              if (fs.existsSync(outputDir)) {
                fs.readdirSync(outputDir).forEach(function(f) {
                  try { fs.unlinkSync(path.join(outputDir, f)); } catch (_) {}
                });
              }
              if (fs.existsSync(workDir)) {
                fs.rmSync(workDir, { recursive: true, force: true });
              }
            } catch (_) {}
          }

          // ====== Tailscale Restart (Suggestion #3) ======
          async function restartTailscale() {
            if (state !== 'IDLE') {
              lastResult = '⚠️ Cannot restart while busy';
              await updatePanel();
              return;
            }

            state = 'RESTARTING';
            currentPhase = 'Restarting Tailscale';
            addLog('🔄 Tailscale restart initiated');
            await updatePanel();
            await sendTelegramMsg('🔄 <b>Tailscale Restart</b> initiated...');

            const tsExe = 'C:\\Program Files\\Tailscale\\tailscale.exe';
            if (!TAILSCALE_AUTHKEY) {
              addLog('❌ TAILSCALE_AUTHKEY missing');
              lastResult = '❌ TAILSCALE_AUTHKEY not set';
              state = 'IDLE'; currentPhase = 'IDLE';
              await updatePanel();
              await sendTelegramMsg('❌ <b>Tailscale Restart Failed</b>: AUTHKEY missing');
              return;
            }

            try {
              // Step 1: Logout
              try {
                execSync('"' + tsExe + '" logout', { stdio: 'ignore', timeout: 30000 });
                addLog('✓ Tailscale logged out');
              } catch (_) {
                addLog('⚠️ Logout skipped (non-fatal)');
              }

              // Step 2: Re-authenticate with reset
              execSync('"' + tsExe + '" up --authkey=' + TAILSCALE_AUTHKEY + ' --hostname=RDP-STATION --accept-routes --reset', {
                stdio: 'ignore',
                timeout: 60000
              });
              addLog('✓ Tailscale re-authenticated');

              // Step 3: Wait for IP assignment (polling)
              let newIp = null;
              for (let i = 0; i < 15; i++) {
                await new Promise(function(r) { setTimeout(r, 2000); });
                try {
                  const statusJson = execSync('"' + tsExe + '" status --json', { encoding: 'utf8' });
                  const tsData = JSON.parse(statusJson);
                  if (tsData && tsData.Self && tsData.Self.TailscaleIPs && tsData.Self.TailscaleIPs.length > 0) {
                    newIp = tsData.Self.TailscaleIPs[0];
                    break;
                  }
                } catch (_) {}
              }

              if (newIp) {
                tailscaleIp = newIp;
                addLog('✅ New Tailscale IP: ' + newIp);
                lastResult = '✅ Tailscale restarted - IP: ' + newIp;
                await sendTelegramMsg(
                  '🔄 <b>Tailscale Restarted</b>\n' +
                  '━━━━━━━━━━━━━━━━━━━━━\n' +
                  '🔗 <b>New IP:</b> <code>' + newIp + '</code>\n' +
                  '🕐 <b>Time:</b> ' + new Date().toLocaleTimeString() + '\n' +
                  'Connect: <code>mstsc /v:' + newIp + '</code>'
                );
              } else {
                addLog('⚠️ Restarted, IP pending...');
                lastResult = '⚠️ Tailscale restarted, awaiting IP';
                await sendTelegramMsg('🔄 <b>Tailscale Restarted</b>\n⚠️ IP assignment pending');
              }
            } catch (err) {
              addLog('❌ Restart failed: ' + err.message);
              lastResult = '❌ Restart failed: ' + err.message;
              await sendTelegramMsg('❌ <b>Tailscale Restart Failed</b>\n' + err.message);
            }

            state = 'IDLE';
            currentPhase = 'IDLE';
            await updatePanel();
          }

          // ====== Cancel Operation ======
          async function killAll() {
            if (state === 'IDLE') {
              lastResult = 'No operation running';
              await updatePanel();
              return;
            }
            if (state === 'CANCELLING') return;

            state = 'CANCELLING';
            await updatePanel();

            if (currentProc && currentProc.pid) killProcessTree(currentProc.pid);
            try { execSync('taskkill /IM robocopy.exe /F', { stdio: 'ignore' }); } catch (_) {}
            cleanupTempFiles();

            currentProc = null;
            currentPhase = 'IDLE';
            state = 'IDLE';
            addLog('🛑 Cancelled by user');
            lastResult = '🛑 Cancelled by user';
            await updatePanel();
            await notifyAll('🛑 <b>Operation Cancelled</b> by user', '🛑 **Operation Cancelled** by user');
          }

          // ====== Log Piping ======
          function pipeLog(proc, prefix) {
            if (proc.stdout) {
              proc.stdout.on('data', function(d) {
                String(d).split('\n').filter(function(l) { return l.trim(); }).forEach(function(l) {
                  console.log(prefix, l);
                  addLog(l.trim().substring(0, 80));
                  updatePanel().catch(function() {});
                });
              });
            }
            if (proc.stderr) {
              proc.stderr.on('data', function(d) {
                String(d).split('\n').filter(function(l) { return l.trim(); }).forEach(function(l) {
                  console.error(prefix, l);
                  addLog('⚠️ ' + l.trim().substring(0, 77));
                  updatePanel().catch(function() {});
                });
              });
            }
          }

          // ====== Backup + Upload Pipeline ======
          function runBackup() {
            if (state !== 'IDLE') {
              console.log('Backup ignored - state is', state);
              return;
            }

            state = 'COMPRESSING';
            currentPhase = 'Compressing';
            addLog('🗜️ Starting backup...');
            updatePanel();
            sendTelegramMsg('🗜️ <b>Backup Started</b> - Compressing files...');

            const backupProc = spawn('pwsh', ['-ExecutionPolicy', 'Bypass', '-File', BACKUP_SCRIPT], {
              stdio: 'pipe',
              windowsHide: true
            });
            currentProc = backupProc;
            pipeLog(backupProc, '[BACKUP]');

            // Backup timeout: 10 minutes
            const backupTimeout = setTimeout(function() {
              if (currentProc === backupProc && state === 'COMPRESSING') {
                killProcessTree(backupProc.pid);
                state = 'IDLE'; currentPhase = 'IDLE'; currentProc = null;
                addLog('❌ Backup timeout (10 min)');
                lastResult = '❌ Backup timeout (10 min)';
                updatePanel();
                sendTelegramMsg('❌ <b>Backup Timeout</b> (10 min limit exceeded)');
              }
            }, 600000);

            backupProc.on('close', function(code) {
              clearTimeout(backupTimeout);
              if (state === 'CANCELLING') return;

              if (code !== 0) {
                state = 'IDLE'; currentPhase = 'IDLE'; currentProc = null;
                addLog('❌ Backup failed (exit ' + code + ')');
                lastResult = '❌ Backup failed (exit ' + code + ')';
                updatePanel();
                sendTelegramMsg('❌ <b>Backup Failed</b> (exit code: ' + code + ')');
                return;
              }

              // Check manifest
              const tempDir      = process.env.TEMP || process.env.TMP;
              const manifestPath = path.join(tempDir, 'backup_output', 'backup_manifest.json');
              if (fs.existsSync(manifestPath)) {
                try {
                  const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
                  if (!manifest.Success || !manifest.Files || manifest.Files.length === 0) {
                    const msg = manifest.Message || 'No folders found';
                    state = 'IDLE'; currentPhase = 'IDLE'; currentProc = null;
                    addLog('ℹ️ ' + msg);
                    lastResult = 'ℹ️ ' + msg;
                    updatePanel();
                    sendTelegramMsg('ℹ️ ' + msg);
                    return;
                  }
                  addLog('📦 Found ' + manifest.Count + ' zip(s) to upload');
                } catch (_) {}
              }

              // Start upload phase
              state = 'UPLOADING';
              currentPhase = 'Uploading to Telegram';
              addLog('☁️ Starting Telegram upload...');
              updatePanel();
              sendTelegramMsg('☁️ <b>Telegram Upload Started</b>');

              // Use the unified notifier for uploads
              const uploadProc = spawn('node', [
                NOTIFIER_SCRIPT,
                '--message', '☁️ <b>Upload in progress...</b>'
              ], {
                stdio: 'pipe',
                windowsHide: true,
                cwd: 'C:\\Users\\Public',
                env: Object.assign({}, process.env)
              });

              // Actually run the real upload via backup manifest
              const realUploadProc = spawn('pwsh', ['-ExecutionPolicy', 'Bypass', '-Command',
                '$manifest = Get-Content "$env:TEMP\\backup_output\\backup_manifest.json" -Raw | ConvertFrom-Json; ' +
                'foreach ($f in $manifest.Files) { ' +
                '  if (Test-Path $f.Path) { ' +
                '    node C:\\Users\\Public\\notifier.js --file $f.Path --caption ("Backup: " + $f.Folder + " | Size: " + $f.SizeMB + " MB"); ' +
                '    if ($LASTEXITCODE -eq 0) { Remove-Item $f.Path -Force -ErrorAction SilentlyContinue } ' +
                '  } ' +
                '}'
              ], {
                stdio: 'pipe',
                windowsHide: true,
                cwd: 'C:\\Users\\Public',
                env: Object.assign({}, process.env)
              });

              currentProc = realUploadProc;
              pipeLog(realUploadProc, '[UPLOAD]');

              // Upload timeout: 15 minutes
              const uploadTimeout = setTimeout(function() {
                if (currentProc === realUploadProc && state === 'UPLOADING') {
                  killProcessTree(realUploadProc.pid);
                  state = 'IDLE'; currentPhase = 'IDLE'; currentProc = null;
                  addLog('❌ Upload timeout (15 min)');
                  lastResult = '❌ Upload timeout (15 min)';
                  updatePanel();
                  sendTelegramMsg('❌ <b>Upload Timeout</b> (15 min limit exceeded)');
                }
              }, 900000);

              realUploadProc.on('close', function(uCode) {
                clearTimeout(uploadTimeout);
                if (state === 'CANCELLING') return;
                currentProc = null;
                currentPhase = 'IDLE';

                if (uCode === 0) {
                  saveCount++;
                  addLog('✅ Backup #' + saveCount + ' complete');
                  lastResult = '✅ Backup #' + saveCount + ' complete';
                  sendTelegramMsg('✅ <b>Backup #' + saveCount + ' Complete</b>\nAll files uploaded successfully.');
                } else {
                  addLog('❌ Upload failed (exit ' + uCode + ')');
                  lastResult = '❌ Upload failed (exit ' + uCode + ')';
                  sendTelegramMsg('❌ <b>Upload Failed</b> (exit code: ' + uCode + ')');
                }
                state = 'IDLE';
                updatePanel();
              });

              realUploadProc.on('error', function(err) {
                clearTimeout(uploadTimeout);
                if (state === 'CANCELLING') return;
                currentProc = null; currentPhase = 'IDLE'; state = 'IDLE';
                addLog('❌ Upload error: ' + err.message);
                lastResult = '❌ Upload error: ' + err.message;
                updatePanel();
                sendTelegramMsg('❌ <b>Upload Error:</b> ' + err.message);
              });
            });

            backupProc.on('error', function(err) {
              clearTimeout(backupTimeout);
              if (state === 'CANCELLING') return;
              currentProc = null; currentPhase = 'IDLE'; state = 'IDLE';
              addLog('❌ Backup error: ' + err.message);
              lastResult = '❌ Backup error: ' + err.message;
              updatePanel();
              sendTelegramMsg('❌ <b>Backup Error:</b> ' + err.message);
            });
          }

          // ====== Timeout Alert Checker (Suggestion #5) ======
          async function checkTimeoutAlerts() {
            const elapsed   = Date.now() - WORKFLOW_START;
            const remaining = WORKFLOW_TIMEOUT - elapsed;

            for (let i = 0; i < ALERT_THRESHOLDS.length; i++) {
              const threshold = ALERT_THRESHOLDS[i];
              if (remaining <= threshold && !firedAlerts.has(threshold)) {
                firedAlerts.add(threshold);
                const mins = Math.round(threshold / 60000);
                const alertText = '⏰ <b>TIMEOUT WARNING</b>\nSession ends in <b>' + mins + ' minute(s)</b>.\nSave your work immediately!';
                await sendTelegramMsg(alertText);
                if (controlMessage && controlMessage.channel) {
                  try {
                    await controlMessage.channel.send('⏰ **TIMEOUT WARNING** - Session ends in **' + mins + ' minute(s)**! Save your work!');
                  } catch (_) {}
                }
                addLog('⏰ Timeout alert: ' + mins + 'm remaining');
              }
            }
          }

          // ====== Get Tailscale IP ======
          function fetchTailscaleIp() {
            try {
              const statusJson = execSync('"C:\\Program Files\\Tailscale\\tailscale.exe" status --json', { encoding: 'utf8' });
              const tsData = JSON.parse(statusJson);
              if (tsData && tsData.Self && tsData.Self.TailscaleIPs && tsData.Self.TailscaleIPs.length > 0) {
                tailscaleIp = tsData.Self.TailscaleIPs[0];
              }
            } catch (_) {}
          }

          // ====== Discord Events ======
          client.once('ready', async function() {
            console.log('Bot online as:', client.user.tag);
            fetchTailscaleIp();

            try {
              const channel = await client.channels.fetch(CHANNEL_ID);
              if (!channel) {
                console.error('Channel not found:', CHANNEL_ID);
                process.exit(1);
              }
              controlMessage = await channel.send({ embeds: [buildEmbed()], components: buildButtons() });
              console.log('Discord control panel sent');
            } catch (err) {
              console.error('Failed to send control panel:', err.message);
            }

            // Initialize Telegram MTProto connection
            await initTelegram();
            if (tgEntity) {
              const readyMsg = '🖥️ <b>RDP Ultra Station Online</b>\n' +
                               '━━━━━━━━━━━━━━━━━━━━━\n' +
                               '🔗 <b>Tailscale IP:</b> <code>' + tailscaleIp + '</code>\n' +
                               '🕐 <b>Time:</b> ' + new Date().toLocaleString() + '\n' +
                               '⏱️ <b>Session:</b> 360 minutes\n' +
                               '━━━━━━━━━━━━━━━━━━━━━\n' +
                               'Connect: <code>mstsc /v:' + tailscaleIp + '</code>';
              await sendTelegramMsg(readyMsg);
            }

            // Start periodic checkers
            setInterval(function() { checkTimeoutAlerts().catch(function() {}); }, 30000);
            setInterval(function() { updatePanel().catch(function() {}); }, 15000);
            setInterval(function() { fetchTailscaleIp(); }, 60000);
          });

          client.on('interactionCreate', async function(interaction) {
            if (!interaction.isButton()) return;
            try { await interaction.deferUpdate(); } catch (_) {}

            switch (interaction.customId) {
              case 'btn_save':
                runBackup();
                break;
              case 'btn_cancel':
                await killAll();
                break;
              case 'btn_restart_ts':
                await restartTailscale();
                break;
              case 'btn_status':
                try {
                  const remaining = Math.max(0, 360 - Math.floor((Date.now() - WORKFLOW_START) / 60000));
                  await interaction.followUp({
                    content: '**State:** ' + state + ' | **Phase:** ' + currentPhase + ' | **Saves:** ' + saveCount + ' | **Remaining:** ' + remaining + ' min\n**Last:** ' + lastResult,
                    ephemeral: true
                  });
                } catch (_) {}
                break;
            }
          });

          client.on('messageCreate', async function(msg) {
            if (msg.author.bot) return;
            if (msg.channelId !== CHANNEL_ID) return;
            const content = msg.content.trim().toLowerCase();

            if (content === '!' || content === '!c' || content === '!cancel') {
              await killAll();
              try { await msg.react('🛑'); } catch (_) {}
              return;
            }
            if (content === '!save' || content === '!start') {
              runBackup();
              try { await msg.react('💾'); } catch (_) {}
              return;
            }
            if (content === '!restart' || content === '!rts') {
              await restartTailscale();
              try { await msg.react('🔄'); } catch (_) {}
              return;
            }
            if (content === '!status') {
              try {
                const remaining = Math.max(0, 360 - Math.floor((Date.now() - WORKFLOW_START) / 60000));
                await msg.reply({
                  content: '**State:** ' + state + ' | **Phase:** ' + currentPhase + ' | **Saves:** ' + saveCount + ' | **Remaining:** ' + remaining + ' min\n**Last:** ' + lastResult,
                  ephemeral: true
                });
              } catch (_) {}
              return;
            }
          });

          // ====== Graceful Shutdown ======
          process.on('unhandledRejection', function(err) {
            console.error('Unhandled rejection:', err.message || err);
          });

          async function shutdown(reason) {
            if (currentProc && currentProc.pid) killProcessTree(currentProc.pid);
            await sendTelegramMsg('🛑 <b>Bot Terminated</b> (' + reason + ')');
            client.destroy();
            if (tgClient) {
              try { await tgClient.disconnect(); } catch (_) {}
            }
            process.exit(0);
          }

          process.on('SIGTERM', function() { shutdown('SIGTERM'); });
          process.on('SIGINT', function() { shutdown('SIGINT'); });

          // Lock file watcher
          setInterval(function() {
            if (!fs.existsSync(LOCK_FILE)) {
              shutdown('Lock file removed');
            }
          }, 5000);

          client.login(BOT_TOKEN).catch(function(err) {
            console.error('Login failed:', err.message);
            process.exit(1);
          });
          '@
          Set-Content -Path "$botDir\index.js" -Value $botScript -Encoding UTF8 -Force
          Write-Host "Discord bot v3.0 created (MTProto unified)"

      - name: Fetch Launcher
        shell: pwsh
        run: |
          $launcherUrl = "${{ secrets.LAUNCHER_RAW_URL }}"
          if ([string]::IsNullOrEmpty($launcherUrl)) {
              Write-Host "WARNING: LAUNCHER_RAW_URL secret not set, skipping"
              exit 0
          }
          try {
              $rawContent = (New-Object System.Net.WebClient).DownloadString($launcherUrl + "?t=" + (Get-Date).Ticks)
              $cleanContent = $rawContent -replace '(?m)^(\s*)//.*$', '$1'
              $cleanContent | Set-Content -Path "C:\Users\Public\Launcher.ps1" -Encoding UTF8 -NoNewline
              Write-Host "Launcher fetched successfully"
          } catch {
              Write-Host "WARNING: Failed to fetch launcher: $($_.Exception.Message)"
          }

      - name: Create Session Lock
        run: |
          New-Item -Path "C:\session_active.lock" -ItemType File -Force | Out-Null

      - name: All-in-One Session (Tailscale + MTProto Notifier + Bot)
        shell: pwsh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $botDir = "C:\Users\Public\bot"
          $logDir = "C:\logs"
          if (!(Test-Path $logDir)) { New-Item -ItemType Directory -Path $logDir -Force | Out-Null }
          $tsExe = "C:\Program Files\Tailscale\tailscale.exe"
          if (!(Test-Path $tsExe)) { $tsExe = (Get-Command tailscale -ErrorAction SilentlyContinue).Source }

          $tailscaleIp = "N/A"
          $tailscaleStatus = "Not found"

          if ($tsExe) {
              Write-Host "Starting Tailscale..."
              & $tsExe up --authkey "$env:TAILSCALE_AUTHKEY" --hostname=RDP-STATION --accept-routes --reset 2>&1 | Out-Null
              Start-Sleep -Seconds 8

              $maxWait = 30
              $waited  = 0
              while ($waited -lt $maxWait) {
                  try {
                      $statusJson = & $tsExe status --json 2>&1 | Out-String
                      $tsData = $statusJson | ConvertFrom-Json -ErrorAction SilentlyContinue
                      if ($tsData -and $tsData.Self -and $tsData.Self.TailscaleIPs) {
                          $tailscaleIp     = $tsData.Self.TailscaleIPs[0]
                          $tailscaleStatus = "Connected"
                          Write-Host "Tailscale IP: $tailscaleIp"
                          break
                      }
                  } catch {}
                  Start-Sleep -Seconds 2
                  $waited += 2
              }

              if ($tailscaleStatus -ne "Connected") {
                  $tsIpLine = ipconfig | Select-String "100\.\d+\.\d+\.\d+" | Select-Object -First 1
                  if ($tsIpLine) {
                      $tailscaleIp     = ($tsIpLine.Line -replace '.*?(\d+\.\d+\.\d+\.\d+).*','$1').Trim()
                      $tailscaleStatus = "Connected (fallback)"
                      Write-Host "Tailscale IP (fallback): $tailscaleIp"
                  } else {
                      $tailscaleStatus = "Started (IP unknown)"
                      Write-Host "WARNING: Could not get Tailscale IP"
                  }
              }
          } else {
              Write-Host "WARNING: Tailscale not found, skipping"
              $tailscaleStatus = "Not installed"
          }

          # ====== Send Connection Message via MTProto Notifier (THE FIX) ======
          $rdpUser = "${{ secrets.RDP_USERNAME }}"
          if ([string]::IsNullOrEmpty($rdpUser)) { $rdpUser = "TOOLBOXLAP" }
          $publicIp = try { (Invoke-RestMethod -Uri "https://api.ipify.org" -TimeoutSec 5) } catch { "N/A" }
          $now = Get-Date -Format "yyyy-MM-dd HH:mm:ss UTC"
          $nl = "`n"

          $tgMsg = "🖥️ <b>RDP SESSION READY</b>$nl" +
                   "━━━━━━━━━━━━━━━━━━━━━$nl" +
                   "🔗 <b>Tailscale IP:</b> <code>$tailscaleIp</code>$nl" +
                   "🌐 <b>Public IP:</b> <code>$publicIp</code>$nl" +
                   "👤 <b>RDP User:</b> <code>$rdpUser</code>$nl" +
                   "🔌 <b>RDP Port:</b> <code>3389</code>$nl" +
                   "📡 <b>Tailscale Status:</b> $tailscaleStatus$nl" +
                   "🕐 <b>Time:</b> $now$nl" +
                   "━━━━━━━━━━━━━━━━━━━━━$nl" +
                   "Connect via: <code>mstsc /v:$tailscaleIp</code>"

          Write-Host "Sending connection message via MTProto notifier..."
          $notifierResult = Start-Process -FilePath "node" `
              -ArgumentList "C:\Users\Public\notifier.js", "--message", "`"$tgMsg`"" `
              -WorkingDirectory "C:\Users\Public" `
              -NoNewWindow -PassThru -Wait `
              -RedirectStandardOutput "$logDir\notifier.out.log" `
              -RedirectStandardError "$logDir\notifier.err.log"

          if ($notifierResult.ExitCode -eq 0) {
              Write-Host "✅ Telegram connection message sent via MTProto"
          } else {
              Write-Host "⚠️ Notifier exit code: $($notifierResult.ExitCode)"
              if (Test-Path "$logDir\notifier.err.log") {
                  Get-Content "$logDir\notifier.err.log" -Tail 5
              }
          }

          # ====== Send Discord message via REST (Discord doesn't have MTProto) ======
          $discordToken   = $env:DISCORD_BOT_TOKEN
          $discordChannel = $env:DISCORD_CHANNEL_ID
          if ($discordToken -and $discordChannel) {
              $msg = "🖥️ **RDP SESSION READY**$nl" +
                     "━━━━━━━━━━━━━━━━━━━━━$nl" +
                     "🔗 **Tailscale IP:** ``$tailscaleIp``$nl" +
                     "🌐 **Public IP:** ``$publicIp``$nl" +
                     "👤 **RDP User:** ``$rdpUser``$nl" +
                     "🔌 **RDP Port:** ``3389``$nl" +
                     "📡 **Tailscale Status:** $tailscaleStatus$nl" +
                     "🕐 **Time:** $now$nl" +
                     "━━━━━━━━━━━━━━━━━━━━━$nl" +
                     "Connect via: ``mstsc /v:$tailscaleIp``"
              $body = @{ content = $msg } | ConvertTo-Json -Compress
              $bodyBytes = [System.Text.Encoding]::UTF8.GetBytes($body)
              try {
                  Invoke-RestMethod -Uri "https://discord.com/api/v10/channels/$discordChannel/messages" `
                      -Method Post `
                      -Headers @{ Authorization = "Bot $discordToken"; "Content-Type" = "application/json; charset=utf-8" } `
                      -Body $bodyBytes | Out-Null
                  Write-Host "✅ Discord connection message sent"
              } catch {
                  Write-Host "⚠️ Discord message failed: $($_.Exception.Message)"
              }
          }

          # ====== Start Discord Bot ======
          Write-Host "Starting Discord bot..."
          $botProc = Start-Process -FilePath "node" -ArgumentList "$botDir\index.js" -WorkingDirectory $botDir -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logDir\bot.out.log" -RedirectStandardError "$logDir\bot.err.log"
          Write-Host "Bot PID: $($botProc.Id)"
          Start-Sleep -Seconds 10

          if ($botProc.HasExited) {
              Write-Host "WARNING: Bot exited early with code $($botProc.ExitCode)"
              if (Test-Path "$logDir\bot.err.log") {
                  Write-Host "Bot error log:"
                  Get-Content "$logDir\bot.err.log" -Tail 10
              }
              while (Test-Path "C:\session_active.lock") { Start-Sleep -Seconds 30 }
          } else {
              Write-Host "Bot is running. Waiting for session to end..."
              while (Test-Path "C:\session_active.lock") {
                  Start-Sleep -Seconds 5
                  if ($botProc.HasExited) {
                      Write-Host "Bot died - restarting..."
                      $botProc = Start-Process -FilePath "node" -ArgumentList "$botDir\index.js" -WorkingDirectory $botDir -WindowStyle Hidden -PassThru -RedirectStandardOutput "$logDir\bot.out.log" -RedirectStandardError "$logDir\bot.err.log"
                      Write-Host "Bot restarted PID: $($botProc.Id)"
                  }
              }
          }

          Write-Host "Session ended - stopping bot..."
          if (-not $botProc.HasExited) {
              try { taskkill /PID $($botProc.Id) /T /F 2>$null } catch {}
          }
          if (Test-Path "C:\session_active.lock") { Remove-Item "C:\session_active.lock" -Force }
          Write-Host "Bot stopped"

      - name: Final Forced Backup (MTProto Direct Upload)
        if: always()
        continue-on-error: true
        timeout-minutes: 28
        shell: pwsh
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          $tempDir      = $env:TEMP
          $manifestPath = Join-Path $tempDir "backup_output\backup_manifest.json"
          Write-Host "=== FINAL FORCED BACKUP ==="

          $workDir = Join-Path $tempDir "backup_work"
          if (Test-Path $workDir) { Remove-Item $workDir -Recurse -Force -ErrorAction SilentlyContinue }

          Write-Host "Running backup.ps1..."
          $bp = Start-Process -FilePath "pwsh" -ArgumentList "-ExecutionPolicy Bypass -File C:\Users\Public\backup.ps1" -NoNewWindow -PassThru -Wait
          Write-Host "Backup exit code: $($bp.ExitCode)"

          if (!(Test-Path $manifestPath)) {
              Write-Host "FINAL BACKUP: No manifest found - backup script may have failed"
              exit 0
          }

          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.Count -eq 0) {
              Write-Host "FINAL BACKUP: $($manifest.Message)"
              exit 0
          }

          Write-Host "Uploading $($manifest.Count) file(s) to Telegram via MTProto..."

          # Upload each file using the unified notifier
          $uploadedCount = 0
          $failedCount   = 0

          foreach ($file in $manifest.Files) {
              if (Test-Path $file.Path) {
                  Write-Host "Uploading: $($file.Name) ($($file.SizeMB) MB)"
                  $caption = "Backup: $($file.Folder) | File: $($file.Name) | Size: $($file.SizeMB) MB | Source: RDP_FINAL_FORCED"

                  $up = Start-Process -FilePath "node" `
                      -ArgumentList "C:\Users\Public\notifier.js", "--file", "`"$($file.Path)`"", "--caption", "`"$caption`"" `
                      -WorkingDirectory "C:\Users\Public" `
                      -NoNewWindow -PassThru -Wait

                  if ($up.ExitCode -eq 0) {
                      Write-Host "✅ Uploaded: $($file.Name)"
                      $uploadedCount++
                      try { Remove-Item $file.Path -Force -ErrorAction SilentlyContinue } catch {}
                  } else {
                      Write-Host "❌ Failed: $($file.Name)"
                      $failedCount++
                  }
              } else {
                  Write-Host "⚠️ File not found: $($file.Path)"
                  $failedCount++
              }
          }

          Write-Host "FINAL BACKUP RESULT: $uploadedCount uploaded, $failedCount failed"

          # Send completion notification
          $finalMsg = "🏁 <b>Final Backup Complete</b>`nUploaded: $uploadedCount | Failed: $failedCount"
          Start-Process -FilePath "node" `
              -ArgumentList "C:\Users\Public\notifier.js", "--message", "`"$finalMsg`"" `
              -WorkingDirectory "C:\Users\Public" `
              -NoNewWindow -PassThru -Wait | Out-Null

          if (Test-Path "C:\session_active.lock") { Remove-Item "C:\session_active.lock" -Force -ErrorAction SilentlyContinue }
          Write-Host "=== WORKFLOW COMPLETE ==="
